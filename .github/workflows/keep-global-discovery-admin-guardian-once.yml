name: KEEP global discovery + admin guardian repair
on:
  push:
    branches: [reconcile/claude-main-20260825]
    paths:
      - scripts/patch_keep_global_discovery_and_admin_guardian.py
      - .github/workflows/keep-global-discovery-admin-guardian-once.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: reconcile/claude-main-20260825, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - run: git pull --ff-only origin reconcile/claude-main-20260825
      - run: python scripts/patch_keep_global_discovery_and_admin_guardian.py
      - run: npm ci
      - run: npx tsc -p packages/mobile/tsconfig.json --noEmit && npx tsc -p packages/admin/tsconfig.json --noEmit
      - name: Commit repair
        run: |
          git config user.name "KEEP Guardian"
          git config user.email "actions@github.com"
          git add packages/mobile/src/screens/DiscoverScreen.tsx packages/admin/pages/operations.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(global): resilient discovery and visible auto repair"
          git push origin HEAD:reconcile/claude-main-20260825
