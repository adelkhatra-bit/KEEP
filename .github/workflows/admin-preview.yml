name: KEEP — Super Admin Preview

on:
  push:
    branches: [main]
    paths:
      - 'packages/admin/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/admin-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace packages/admin run type-check
      - run: npm --workspace packages/admin run build
      - name: Rewrite paths for portable preview
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('packages/admin/out')
          for p in root.rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('href="/_next/', 'href="./_next/')
              s = s.replace('src="/_next/', 'src="./_next/')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: admin-preview
          publish_dir: packages/admin/out
          force_orphan: true
