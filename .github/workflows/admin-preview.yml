name: KEEP — Super Admin Preview

on:
  push:
    branches: [main]
    paths:
      - 'packages/admin/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/admin-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      KEEP_ADMIN_BASE_PATH: /KEEP/admin-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace packages/admin run type-check
      - run: npm --workspace packages/admin run build
      - name: Publish Super Admin inside the public KEEP preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web-preview
          publish_dir: packages/admin/out
          destination_dir: admin-preview
          keep_files: true
