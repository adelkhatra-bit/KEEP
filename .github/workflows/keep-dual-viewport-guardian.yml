name: KEEP — Mobile + Desktop Guardian

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'packages/mobile/**'
      - '!packages/mobile/**/__tests__/**'
      - '!packages/mobile/**/*.test.ts'
      - '!packages/mobile/**/*.test.tsx'
      - '!packages/mobile/**/*.spec.ts'
      - '!packages/mobile/**/*.spec.tsx'
      - 'packages/music/**'
      - '.github/workflows/keep-dual-viewport-guardian.yml'
  pull_request:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'packages/mobile/**'
      - 'packages/music/**'
      - '.github/workflows/keep-dual-viewport-guardian.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

# Never run this production-backed browser load in parallel with another
# guardian. This prevents CI fan-out from starving GoTrue/Postgres.
concurrency:
  group: keep-production-supabase-browser-audits
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dual-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      EXPO_PUBLIC_SUPABASE_URL: https://rrhqsqzcplvmwxizqnla.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru
      EXPO_PUBLIC_DEMO_MODE: 'false'
      EXPO_PUBLIC_KEEP_PREVIEW: '0'
      EXPO_PUBLIC_KEEP_REAL_RECOGNITION: 'false'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3010
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run type-check
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Start KEEP Web runtime
        working-directory: packages/mobile
        run: |
          node scripts/start-web.cjs --port 8081 --clear >/tmp/keep-dual-runtime.log 2>&1 &
          echo $! >/tmp/keep-dual-runtime.pid
          for i in {1..120}; do
            if grep -Fq '[KEEP WEB] READY http://localhost:8081' /tmp/keep-dual-runtime.log 2>/dev/null && curl -fsS http://127.0.0.1:8081 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/keep-dual-runtime.log
          exit 1

      - name: Test KEEP critical loop — mobile 390x844 + desktop smoke 1440x900
        run: |
          mkdir -p artifacts/dual-viewport
          # Chromium's built-in fake microphone is silent. Loki correctly rejects
          # a silent capture, so feed a deterministic 440 Hz WAV instead.
          python3 - <<'PY'
          import math, struct, wave
          rate = 44100
          seconds = 30
          with wave.open('/tmp/keep-tone.wav', 'wb') as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(rate)
              frames = bytearray()
              for i in range(rate * seconds):
                  sample = int(0.35 * 32767 * math.sin(2 * math.pi * 440 * i / rate))
                  frames.extend(struct.pack('<h', sample))
              out.writeframes(frames)
          PY
          cat > keep-critical-loop.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const ORIGIN = 'http://127.0.0.1:8081';
          const CITY = 'Saint-Jean-de-Thurigneux';
          const USERNAME = 'guardian390';
          const BIO = 'Profil test mobile 390x844';
          const WEBSITE = 'https://keep.test/guardian390';
          const INSTAGRAM = 'https://instagram.com/guardian390';
          const tabs = ['Loki Music','Découvertes','Playlists','Soirées','Profil'];

          async function clickRobust(page, locator, label) {
            let lastError;
            for (let attempt = 1; attempt <= 5; attempt += 1) {
              try {
                await locator.waitFor({state:'visible',timeout:10000});
                await locator.scrollIntoViewIfNeeded().catch(()=>{});
                await page.keyboard.press('Escape').catch(()=>{});
                await locator.click({timeout:3000});
                return;
              } catch (error) {
                lastError = error;
                await page.waitForTimeout(180 * attempt);
              }
            }
            await locator.click({force:true,timeout:2000}).catch(()=>{ throw new Error(`${label}: ${String(lastError?.message || lastError || 'click failed')}`); });
          }

          async function openKeep(page) {
            await page.goto(ORIGIN,{waitUntil:'domcontentloaded',timeout:60000});
            const tryFree=page.getByText('ESSAYER GRATUITEMENT',{exact:true}).last();
            if (await tryFree.isVisible().catch(()=>false)) await clickRobust(page,tryFree,'Guest trial');
            for (const tab of tabs) await page.getByText(tab,{exact:true}).last().waitFor({state:'visible',timeout:15000});
          }

          async function openEdit(page) {
            await clickRobust(page,page.getByText('Profil',{exact:true}).last(),'Profil tab');
            const menu=page.getByLabel('Menu du profil').last();
            await menu.waitFor({state:'visible',timeout:15000});
            await clickRobust(page,menu,'Profile menu');
            let edit=page.getByText('Réglages du profil',{exact:true}).last();
            if (!await edit.isVisible().catch(()=>false)) {
              const backToMenu=page.getByText('‹ Menu',{exact:true}).last();
              if (await backToMenu.isVisible().catch(()=>false)) {
                await clickRobust(page,backToMenu,'Reset profile menu');
                edit=page.getByText('Réglages du profil',{exact:true}).last();
              }
            }
            await edit.waitFor({state:'visible',timeout:15000});
            await clickRobust(page,edit,'Edit profile menu item');
            const usernameField=page.getByPlaceholder('tonpseudo').last();
            if (!await usernameField.isVisible().catch(()=>false)) {
              const openSettings=page.getByText('OUVRIR LES REGLAGES',{exact:true}).last();
              await openSettings.waitFor({state:'visible',timeout:15000});
              await clickRobust(page,openSettings,'Open profile settings');
            }
            await usernameField.waitFor({state:'visible',timeout:15000});
          }

          async function assertProfileForm(page) {
            const username=page.getByPlaceholder('tonpseudo').last();
            const bio=page.getByPlaceholder('Quelques mots sur toi').last();
            const city=page.getByPlaceholder('Commence à saisir une ville').last();
            const website=page.getByPlaceholder('https://...').last();
            if(await username.inputValue()!==USERNAME) throw new Error(`username not persisted: ${await username.inputValue()}`);
            if(await bio.inputValue()!==BIO) throw new Error(`bio not persisted: ${await bio.inputValue()}`);
            if(await city.inputValue()!==CITY) throw new Error(`city not persisted: ${await city.inputValue()}`);
            if(await website.inputValue()!==WEBSITE) throw new Error(`website not persisted: ${await website.inputValue()}`);
            await page.getByText('France',{exact:true}).last().waitFor({state:'visible',timeout:15000});
            // La date est désormais rendue par un Selector accessible et non
            // par un simple Text isolé : tester le vrai contrôle évite un
            // faux négatif tout en vérifiant exactement la valeur persistée.
            await page.getByLabel('Date de naissance : 1990-01-01').last().waitFor({state:'visible',timeout:15000});
          }

          async function openPublicProfileSettings(page) {
            // Depuis Réglages du profil, l'onglet bas "Profil" existe encore
            // dans le DOM mais il est caché derrière l'écran courant. Revenir
            // par le vrai bouton de navigation évite de cliquer un doublon
            // invisible.
            const backToProfile=page.getByLabel('Retour au profil').last();
            if (await backToProfile.isVisible().catch(()=>false)) {
              await clickRobust(page,backToProfile,'Back to profile before public settings');
            }
            const menu=page.getByLabel('Menu du profil').last();
            await menu.waitFor({state:'visible',timeout:15000});
            await clickRobust(page,menu,'Open profile menu for public settings');
            const entry=page.getByLabel('Réseaux & site web').last();
            await entry.waitFor({state:'visible',timeout:15000});
            await clickRobust(page,entry,'Public profile settings');
            await page.getByText('Réseaux sociaux',{exact:true}).last().waitFor({state:'visible',timeout:15000});
          }

          async function assertNoOverflow(page,label) {
            const dims=await page.evaluate(()=>({width:innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(dims.scrollWidth>dims.width+1) throw new Error(`${label}: horizontal overflow ${JSON.stringify(dims)}`);
          }

          async function assertProfileFreeAligned(page) {
            // Contrat produit final : FREE vit dans la barre des compteurs,
            // immédiatement à droite de Reprises. Il ne doit jamais être
            // aligné/attaché au type de profil (Fan/Créateur/etc.).
            const repriseLabel=page.getByText('Reprises',{exact:true}).last();
            const free=page.getByLabel(/Free en mode démo|détail de mes Free/i).last();
            await repriseLabel.waitFor({state:'visible',timeout:15000});
            await free.waitFor({state:'visible',timeout:15000});
            const repriseCard=repriseLabel.locator('..');
            const [repriseBox,freeBox]=await Promise.all([repriseCard.boundingBox(),free.boundingBox()]);
            if(!repriseBox||!freeBox) throw new Error('Profil: impossible de mesurer Reprises / FREE');
            const repriseCenter=repriseBox.y+(repriseBox.height/2);
            const freeCenter=freeBox.y+(freeBox.height/2);
            if(Math.abs(repriseCenter-freeCenter)>6) {
              throw new Error(`Profil: FREE n'est pas sur la ligne de Reprises ${JSON.stringify({repriseBox,freeBox})}`);
            }
            if(freeBox.x <= repriseBox.x + repriseBox.width - 2) {
              throw new Error(`Profil: FREE doit être immédiatement à droite de Reprises ${JSON.stringify({repriseBox,freeBox})}`);
            }
          }

          (async()=>{
            const browser = await chromium.launch({ headless:true, args:['--use-fake-ui-for-media-stream','--use-fake-device-for-media-stream','--use-file-for-fake-audio-capture=/tmp/keep-tone.wav'] });
            const report=[];

            {
              const context=await browser.newContext({viewport:{width:1440,height:900},deviceScaleFactor:1});
              const page=await context.newPage();
              await openKeep(page);

              const assertResponsiveSurface = async (label, width, height) => {
                await page.setViewportSize({ width, height });
                await page.waitForTimeout(350);
                const surface = await page.evaluate(() => {
                  const root = document.getElementById('root');
                  const box = root?.getBoundingClientRect();
                  return {
                    bodyText: (document.body?.innerText || '').trim().length,
                    rootChildren: root?.children.length || 0,
                    rootWidth: Math.round(box?.width || 0),
                    rootHeight: Math.round(box?.height || 0),
                    innerWidth,
                    innerHeight,
                  };
                });
                if (surface.bodyText < 10 || surface.rootChildren < 1) throw new Error(`${label}: blank application surface ${JSON.stringify(surface)}`);
                if (surface.rootWidth < width - 2 || surface.rootHeight < height - 2) throw new Error(`${label}: root does not expand with viewport ${JSON.stringify(surface)}`);
                for (const tab of tabs) await page.getByText(tab,{exact:true}).last().waitFor({state:'visible',timeout:10000});
                await assertNoOverflow(page,label);
              };

              // Reproduit exactement le cas signalé : plein écran -> fenêtre réduite
              // par DevTools/Inspecter -> téléphone -> retour plein écran, sans reload.
              await assertResponsiveSurface('desktop-full-1440x900',1440,900);
              await assertResponsiveSurface('desktop-inspector-900x700',900,700);
              await assertResponsiveSurface('mobile-resize-390x844',390,844);
              await assertResponsiveSurface('desktop-return-1440x900',1440,900);

              // Cas exact utilisateur : Profil visible avec DevTools docké,
              // puis fermeture / retour plein écran SANS reload.
              await assertResponsiveSurface('profile-before-open-768x700',768,700);
              await clickRobust(page,page.getByText('Profil',{exact:true}).last(),'Desktop Profil tab');
              await page.getByLabel('Menu du profil').last().waitFor({state:'visible',timeout:15000});
              await assertResponsiveSurface('profile-devtools-open-768x700',768,700);
              await assertResponsiveSurface('profile-devtools-closed-1440x900',1440,900);
              await page.getByLabel('Menu du profil').last().waitFor({state:'visible',timeout:15000});
              await page.screenshot({path:'artifacts/dual-viewport/desktop-1440x900-profile.png',fullPage:true});
              report.push('desktop + profile resize 1440x900 -> 900x700 -> 390x844 -> 1440x900 + profile 768x700 -> 1440x900: PASS');
              await context.close();
            }

            const context=await browser.newContext({
              viewport:{width:390,height:844},
              deviceScaleFactor:1,
              geolocation:{latitude:45.95,longitude:4.884},
            });
            await context.grantPermissions(['geolocation','microphone'], {origin:ORIGIN});
            const page=await context.newPage();
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('dialog',async d=>d.accept().catch(()=>{}));

            await page.route('https://api.bigdatacloud.net/**', async route => route.fulfill({
              status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*'},
              body:JSON.stringify({city:CITY,locality:CITY,countryCode:'FR'}),
            }));
            await page.route('https://nominatim.openstreetmap.org/**', async route => route.fulfill({
              status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*'},
              body:JSON.stringify({address:{village:CITY,country_code:'fr'}}),
            }));

            await openKeep(page);
            await page.screenshot({path:'artifacts/dual-viewport/01-listen-idle.png',fullPage:true});

            // Le mini-tour de première installation est une vraie surcouche.
            // Un utilisateur appuie d'abord sur Passer/Suivant ; le Guardian
            // doit reproduire ce geste et ne jamais cliquer à travers l'aide.
            const skipCoach=page.getByLabel('Passer le mini-tour').last();
            if(await skipCoach.isVisible().catch(()=>false)) {
              await skipCoach.click({force:true});
              await page.waitForTimeout(180);
            }

            const start=page.getByLabel(/Identifier un morceau|Activer le micro|Démarrer une écoute/).last();
            await start.waitFor({state:'visible',timeout:15000});
            await clickRobust(page,start,'Listen start');
            await page.getByText(/MICRO · (?:ANALYSE|ACTIF)/i).last().waitFor({state:'visible',timeout:15000});
            const stop=page.getByLabel('Couper le micro').last();
            await stop.waitFor({state:'visible',timeout:15000});
            await page.screenshot({path:'artifacts/dual-viewport/02-listen-active.png',fullPage:true});
            await clickRobust(page,stop,'Listen stop');
            await start.waitFor({state:'visible',timeout:15000});

            await clickRobust(page,page.getByText('Découvertes',{exact:true}).last(),'Découvertes tab');
            await page.getByText('1 · DISTANCE',{exact:true}).last().waitFor({state:'visible',timeout:15000});
            await clickRobust(page,page.getByText('Playlists',{exact:true}).last(),'Playlists tab');
            await clickRobust(page,page.getByText('Soirées',{exact:true}).last(),'Soirées tab');
            // Le parcours validé ouvre désormais le vrai Battle directement :
            // aucun onglet/lanceur "Salon musical" intermédiaire ne doit revenir.
            const openBattle=page.getByLabel('Ouvrir directement Battle').last();
            await openBattle.waitFor({state:'visible',timeout:15000});
            await clickRobust(page,openBattle,'Open Battle directly');
            // Le premier marqueur réellement rendu dans l'écran de configuration est FORMAT DU BATTLE.
            await page.getByText('FORMAT DU BATTLE',{exact:true}).last().waitFor({state:'visible',timeout:20000});
            await page.getByText('10 s / titre',{exact:true}).last().waitFor({state:'visible',timeout:15000});
            await page.getByLabel('Jouer en solo').last().waitFor({state:'visible',timeout:15000});
            await page.getByLabel('Jouer en ligne').last().waitFor({state:'visible',timeout:15000});
            await assertNoOverflow(page,'battle-390x844');
            await page.screenshot({path:'artifacts/dual-viewport/03-battle-v3.png',fullPage:true});
            await clickRobust(page,page.getByText('‹',{exact:true}).last(),'Close Battle');
            await page.getByText('Soirées',{exact:true}).last().waitFor({state:'visible',timeout:15000});

            await clickRobust(page,page.getByText('Profil',{exact:true}).last(),'Profil alignment check');
            await page.getByLabel('Menu du profil').last().waitFor({state:'visible',timeout:15000});
            await assertProfileFreeAligned(page);
            await page.screenshot({path:'artifacts/dual-viewport/03b-profile-free-aligned.png',fullPage:true});

            await openEdit(page);
            await page.getByPlaceholder('tonpseudo').last().fill(USERNAME);
            await page.getByPlaceholder('Quelques mots sur toi').last().fill(BIO);
            await page.getByPlaceholder('https://...').last().fill(WEBSITE);

            const cityInput=page.getByPlaceholder('Commence à saisir une ville').last();
            const locate=page.getByText('Utiliser ma position',{exact:true}).last();
            await locate.waitFor({state:'visible',timeout:15000});
            await clickRobust(page,locate,'Use my location');
            await page.waitForFunction((expected) => {
              const field=[...document.querySelectorAll('input,textarea')].find(el=>el.getAttribute('placeholder')==='Commence à saisir une ville');
              return Boolean(field && String(field.value || '')===expected);
            }, CITY, {timeout:15000});
            if(await cityInput.inputValue()!==CITY) throw new Error(`GPS city mismatch: ${await cityInput.inputValue()}`);
            await page.getByText('France',{exact:true}).last().waitFor({state:'visible',timeout:15000});
            await page.getByText(/Position trouvée/i).last().waitFor({state:'visible',timeout:15000});

            const birthDateSelector=page.getByLabel(/Date de naissance\s*:\s*/i).last();
            await birthDateSelector.waitFor({state:'visible',timeout:15000});
            // Flux modal : aucun Escape avant ouverture/validation. Le helper
            // générique clickRobust ferme les modales et pouvait rendre ce
            // test aléatoire sur 390×844.
            await birthDateSelector.scrollIntoViewIfNeeded();
            await birthDateSelector.click({force:true,timeout:5000});
            const validateBirthDate=page.getByLabel('Valider la date de naissance').last();
            await validateBirthDate.waitFor({state:'visible',timeout:15000});
            // React Native Web rend ce bouton dans un portail Modal : à 390×844
            // Playwright peut le déclarer "outside of the viewport" alors que
            // le contrôle est bien rendu/visible. HTMLElement.click() déclenche
            // le même onPress sans dépendre de la géométrie du portail.
            await validateBirthDate.evaluate((el) => el.click());
            await page.getByText('1990-01-01',{exact:true}).last().waitFor({state:'visible',timeout:15000});
            await page.screenshot({path:'artifacts/dual-viewport/04-profile-location-date.png',fullPage:true});

            const save=page.getByText('Enregistrer sur cet appareil',{exact:true}).last();
            await save.waitFor({state:'visible',timeout:15000});
            await clickRobust(page,save,'Save profile');
            await page.getByText('✓ Profil enregistré',{exact:true}).last().waitFor({state:'visible',timeout:15000});
            await clickRobust(page,page.getByLabel('Retour au profil').last(),'Back to profile');
            await page.getByLabel('Menu du profil').last().waitFor({state:'visible',timeout:15000});

            await openEdit(page);
            await assertProfileForm(page);
            await openPublicProfileSettings(page);
            const instagram=page.getByPlaceholder('Lien Instagram').last();
            await instagram.waitFor({state:'visible',timeout:15000});
            await instagram.fill(INSTAGRAM);
            await clickRobust(page,page.getByPlaceholder('Lien Instagram').last().locator('xpath=..').getByText('Enregistrer',{exact:true}),'Save Instagram');
            await page.getByText('Connecté au profil',{exact:true}).last().waitFor({state:'visible',timeout:15000});
            const backMenuAfterSocial=page.getByText('‹ Menu',{exact:true}).last();
            if (await backMenuAfterSocial.isVisible().catch(()=>false)) {
              await backMenuAfterSocial.click({force:true});
              await page.waitForTimeout(120);
            }
            const closeMenuAfterSocial=page.getByText('Fermer',{exact:true}).last();
            if (await closeMenuAfterSocial.isVisible().catch(()=>false)) {
              await closeMenuAfterSocial.click({force:true});
            }
            await openEdit(page);
            await clickRobust(page,page.getByText('← Revenir aux Playlists',{exact:true}).last(),'Return to Playlists');
            await page.getByText('Playlists',{exact:true}).last().waitFor({state:'visible',timeout:15000});

            await page.reload({waitUntil:'domcontentloaded',timeout:60000});
            const tryFree=page.getByText('ESSAYER GRATUITEMENT',{exact:true}).last();
            if(await tryFree.isVisible().catch(()=>false)) await clickRobust(page,tryFree,'Guest trial after reload');
            await openEdit(page);
            await assertProfileForm(page);
            await openPublicProfileSettings(page);
            const instagramReload=page.getByPlaceholder('Lien Instagram').last();
            await instagramReload.waitFor({state:'visible',timeout:15000});
            if(await instagramReload.inputValue()!==INSTAGRAM) throw new Error(`social not persisted: ${await instagramReload.inputValue()}`);
            const backMenuAfterReload=page.getByText('‹ Menu',{exact:true}).last();
            if (await backMenuAfterReload.isVisible().catch(()=>false)) {
              await backMenuAfterReload.click({force:true});
              await page.waitForTimeout(120);
            }
            const closeMenuAfterReload=page.getByText('Fermer',{exact:true}).last();
            if (await closeMenuAfterReload.isVisible().catch(()=>false)) {
              await closeMenuAfterReload.click({force:true});
            }
            await openEdit(page);
            await clickRobust(page,page.getByText('← Revenir aux Playlists',{exact:true}).last(),'Return to Playlists');
            await page.getByText('Playlists',{exact:true}).last().waitFor({state:'visible',timeout:15000});

            await assertNoOverflow(page,'mobile-390x844');
            if(pageErrors.length) throw new Error(`mobile page errors: ${pageErrors.join('\n')}`);
            await page.screenshot({path:'artifacts/dual-viewport/05-after-reload.png',fullPage:true});

            report.push('mobile-390x844: PASS — listen/stop, discoveries, playlists, full-screen Battle V3, FREE aligned with profile type, profile edit, GPS city+country, date, save, profile menu social settings, Instagram, playlists return, reload username+bio+website+city+country+date+social, no overflow');
            fs.writeFileSync('artifacts/dual-viewport/report.txt',report.join('\n'));
            await context.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node keep-critical-loop.cjs

      - name: Runtime log on failure
        if: failure()
        run: cat /tmp/keep-dual-runtime.log || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keep-dual-viewport-${{ github.run_id }}
          path: artifacts/dual-viewport
          if-no-files-found: ignore
          retention-days: 3
