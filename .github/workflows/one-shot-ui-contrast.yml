name: KEEP — One-shot UI contrast

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - '.github/workflows/one-shot-ui-contrast.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - name: Apply KEEP contrast rule
        run: python3 scripts/one-shot-ui-contrast.py
      - name: Commit final UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "style(mobile): enforce visible action contrast"
          git push origin HEAD:reconcile/claude-main-20260825
