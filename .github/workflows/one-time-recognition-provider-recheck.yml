name: KEEP — Fast Recognition Provider Activation

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - '.github/workflows/one-time-recognition-provider-recheck.yml'

permissions:
  contents: write

concurrency:
  group: keep-fast-recognition-provider-activation
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - run: git pull --ff-only origin reconcile/claude-main-20260825
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reduce provider configuration recheck delay
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/mobile/src/services/keepMusicCoreRecognition.ts')
          s = p.read_text(encoding='utf-8')
          old = 'const FALLBACK_RECHECK_MS = 5 * 60 * 1000;'
          new = 'const FALLBACK_RECHECK_MS = 30 * 1000;'
          if s.count(old) != 1:
              raise SystemExit(f'expected one old fallback delay, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - run: node scripts/verify-source-of-truth.cjs
      - run: npm --workspace packages/mobile run type-check
      - run: npm --workspace packages/mobile test -- --runInBand
      - name: Verify no-key and provider activation contracts
        run: |
          grep -q "FALLBACK_RECHECK_MS = 30 \* 1000" packages/mobile/src/services/keepMusicCoreRecognition.ts
          grep -q "keylessSourceRecognition" packages/mobile/src/services/keepMusicCoreRecognition.ts
          grep -q "return null;" packages/mobile/src/services/keepMusicCoreRecognition.ts
      - name: Commit verified source
        run: |
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          git add packages/mobile/src/services/keepMusicCoreRecognition.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(music): activate newly configured fallback faster"
            git pull --rebase origin reconcile/claude-main-20260825
            git push origin HEAD:reconcile/claude-main-20260825
          fi
