name: Loki EAS Push Credential Audit
# audit-trigger: 2026-10-04T04:45:00+02:00 testflight-push-environment

on:
  workflow_dispatch:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - '.github/workflows/eas-push-credential-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Audit Expo/EAS iOS push credential association
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.EXPO_TOKEN;
          if (!token) throw new Error('Missing EXPO_TOKEN');
          const appId = 'f9598ced-2480-4fa6-8d6e-885dd4e489e8';
          const query = `
            query LokiPushAudit($appId: String!) {
              app {
                byId(appId: $appId) {
                  id
                  fullName
                  ownerAccount { id name }
                  iosAppCredentials {
                    id
                    appleTeam { id appleTeamIdentifier appleTeamName }
                    appleAppIdentifier { id bundleIdentifier }
                    pushKey {
                      id
                      keyIdentifier
                      createdAt
                      appleTeam { id appleTeamIdentifier appleTeamName }
                    }
                  }
                }
              }
            }
          `;
          (async()=>{
            const res = await fetch('https://api.expo.dev/graphql', {
              method:'POST',
              headers:{authorization:'Bearer '+token,'content-type':'application/json'},
              body:JSON.stringify({query,variables:{appId}})
            });
            const body = await res.json();
            if(!res.ok || body.errors){
              console.error('GraphQL audit failed');
              console.error(JSON.stringify({status:res.status, errors:body.errors}, null, 2));
              process.exit(1);
            }
            const app = body?.data?.app?.byId;
            const creds = Array.isArray(app?.iosAppCredentials) ? app.iosAppCredentials : [];
            const sanitized = {
              app:{id:app?.id,fullName:app?.fullName,owner:app?.ownerAccount?.name},
              iosCredentialCount:creds.length,
              credentials:creds.map(c=>({
                id:c.id,
                bundleIdentifier:c.appleAppIdentifier?.bundleIdentifier||null,
                appleTeamIdentifier:c.appleTeam?.appleTeamIdentifier||null,
                pushKey:c.pushKey ? {
                  id:c.pushKey.id,
                  keyIdentifier:c.pushKey.keyIdentifier,
                  createdAt:c.pushKey.createdAt,
                  appleTeamIdentifier:c.pushKey.appleTeam?.appleTeamIdentifier||null
                } : null
              }))
            };
            console.log('=== LOKI EAS PUSH AUDIT ===');
            console.log(JSON.stringify(sanitized,null,2));
            console.log('=== END LOKI EAS PUSH AUDIT ===');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
