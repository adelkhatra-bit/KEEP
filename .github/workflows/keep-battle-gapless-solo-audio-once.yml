name: KEEP Battle gapless solo audio repair

on:
  push:
    paths:
      - 'scripts/patch_keep_battle_gapless_solo_audio.py'
      - '.github/workflows/keep-battle-gapless-solo-audio-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Sync branch
        run: git pull --ff-only origin reconcile/claude-main-20260825
      - name: Apply gapless Battle audio repair
        run: python3 scripts/patch_keep_battle_gapless_solo_audio.py
      - name: Install dependencies
        run: npm ci
      - name: Verify Battle audio
        run: |
          npm --workspace packages/mobile run type-check
          npm --workspace packages/mobile test -- --runInBand KeepBattleMobileGameV3.compact.test.ts
      - name: Commit fix
        run: |
          git config user.name "KEEP Guardian"
          git config user.email "actions@github.com"
          git add packages/mobile/src/services/audioPreviewService.ts packages/mobile/src/components/KeepBattleMobileGameV3.tsx packages/mobile/src/components/__tests__/KeepBattleMobileGameV3.compact.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(battle): preload next solo track for seamless audio"
          git push origin HEAD:reconcile/claude-main-20260825
