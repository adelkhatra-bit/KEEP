name: KEEP — One-time ACRCloud credential validation

on:
  push:
    branches: [reconcile/claude-main-20260825]
    paths:
      - 'scripts/one_time_acrcloud_validation_patch.py'
      - '.github/workflows/one-time-acrcloud-validation-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - name: Sync latest branch
        run: git pull --ff-only origin reconcile/claude-main-20260825
      - name: Apply ACRCloud validation patch
        run: python3 scripts/one_time_acrcloud_validation_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Super Admin
        run: npm --workspace packages/admin run type-check
      - name: Build Super Admin
        run: npm --workspace packages/admin run build
      - name: Verify recognition credential contracts
        run: |
          grep -q "validateAcrCloudCredentials" supabase/functions/keep-admin-control/index.ts
          grep -q "invalid_acrcloud_credentials" supabase/functions/keep-admin-control/index.ts
          grep -q "code === 1001" supabase/functions/keep-admin-control/index.ts
          grep -q "code === 3001" supabase/functions/keep-admin-control/index.ts
          grep -q "code === 3014" supabase/functions/keep-admin-control/index.ts
          grep -q "ACRCloud vérifié par le fournisseur" packages/admin/pages/integrations.tsx
          grep -q "runtimeByKey.get('ACRCLOUD')" packages/admin/pages/operations.tsx
      - name: Commit verified feature and clean temporary files
        run: |
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          rm -rf packages/admin/.next
          git checkout -- packages/admin/tsconfig.json || true
          git add supabase/functions/keep-admin-control/index.ts packages/admin/pages/integrations.tsx packages/admin/pages/operations.tsx
          git rm -f scripts/one_time_acrcloud_validation_patch.py .github/workflows/one-time-acrcloud-validation-patch.yml
          git diff --cached --check
          git commit -m "feat(admin): validate ACRCloud credentials before activation"
          git pull --rebase origin reconcile/claude-main-20260825
          git push origin HEAD:reconcile/claude-main-20260825
