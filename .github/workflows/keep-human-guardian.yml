name: KEEP — Human Guardian

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'packages/mobile/**'
      - '!packages/mobile/**/__tests__/**'
      - '!packages/mobile/**/*.test.ts'
      - '!packages/mobile/**/*.test.tsx'
      - '!packages/mobile/**/*.spec.ts'
      - '!packages/mobile/**/*.spec.tsx'
      - 'packages/music/**'
      - 'packages/admin/**'
      - 'supabase/functions/keep-admin-control/**'
      - 'scripts/verify-source-of-truth.cjs'
      - '.github/workflows/keep-human-guardian.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

# Mutual exclusion repository-wide for every browser job that talks to the
# production Supabase project. Authentication always keeps priority.
concurrency:
  group: keep-production-supabase-browser-audits
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  human-guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      EXPO_PUBLIC_SUPABASE_URL: https://rrhqsqzcplvmwxizqnla.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru
      EXPO_PUBLIC_DEMO_MODE: 'true'
      EXPO_PUBLIC_KEEP_PREVIEW: '0'
      EXPO_PUBLIC_KEEP_REAL_RECOGNITION: 'false'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3010
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Canonical source-of-truth
        run: node scripts/verify-source-of-truth.cjs
      - name: Typecheck all workspaces
        run: npm run type-check
      # Le Guardian humain valide le parcours navigateur réel. Les tests
      # Jest mobile exhaustifs restent la responsabilité de Mobile CI, afin
      # qu'un contrat textuel obsolète n'empêche jamais ce smoke visuel de
      # s'exécuter. On garde ici les tests des couches serveur/moteur.
      - name: Supporting backend + music tests
        run: |
          npm --workspace packages/backend test -- --runInBand
          npm --workspace packages/music test -- --runInBand
      - name: Build Super Admin
        run: npm --workspace packages/admin run build
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Start exact KEEP runtime
        working-directory: packages/mobile
        run: |
          node scripts/start-web.cjs --port 8081 --clear >/tmp/keep-guardian-runtime.log 2>&1 &
          echo $! >/tmp/keep-guardian-runtime.pid
          for i in {1..120}; do
            if grep -Fq '[KEEP WEB] READY http://localhost:8081' /tmp/keep-guardian-runtime.log 2>/dev/null && curl -fsS http://127.0.0.1:8081 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/keep-guardian-runtime.log
          exit 1
      - name: Human-style mobile loop 390x844
        run: |
          mkdir -p artifacts/human-guardian
          # Chromium's built-in fake microphone is silent. Loki correctly rejects
          # a silent capture, so feed a deterministic 440 Hz WAV instead.
          python3 - <<'PY'
          import math, struct, wave
          rate = 44100
          seconds = 30
          with wave.open('/tmp/keep-tone.wav', 'wb') as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(rate)
              frames = bytearray()
              for i in range(rate * seconds):
                  sample = int(0.35 * 32767 * math.sin(2 * math.pi * 440 * i / rate))
                  frames.extend(struct.pack('<h', sample))
              out.writeframes(frames)
          PY
          cat > keep-human-guardian.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({ headless:true, args:['--use-fake-ui-for-media-stream','--use-fake-device-for-media-stream','--use-file-for-fake-audio-capture=/tmp/keep-tone.wav'] });
            const context = await browser.newContext({
              viewport:{width:390,height:844},
              deviceScaleFactor:1,
              geolocation:{latitude:45.764,longitude:4.8357},
            });
            await context.grantPermissions(['geolocation','microphone'], { origin:'http://127.0.0.1:8081' });
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(`PAGE: ${String(e)}`));
            page.on('console',m=>{ if(m.type()==='error') errors.push(`CONSOLE: ${m.text()}`); });
            page.on('dialog',async d=>d.accept().catch(()=>{}));
            const t=(v,o={})=>page.getByText(v,o).last();
            // BottomTabBarButton n'expose pas toujours role="tab" sur RN Web.
            // Cible le contrôle pressable/lien contenant le libellé, dans la
            // barre basse, au lieu d'un Text enfant exact.
            const tab=(label)=>page.locator('[role="button"],[role="link"],a,button').filter({hasText:label}).last();
            const shot=async n=>page.screenshot({path:`artifacts/human-guardian/${n}.png`,fullPage:true});
            const inViewport=async(loc,label)=>{ await loc.waitFor({state:'visible',timeout:15000}); const b=await loc.boundingBox(); if(!b||b.y<0||b.y+b.height>844) throw new Error(`${label} outside viewport ${JSON.stringify(b)}`); };
            const clickRobust=async(loc,label)=>{ let last; for(let attempt=1;attempt<=5;attempt++){ try{ await loc.waitFor({state:'visible',timeout:10000}); await loc.scrollIntoViewIfNeeded().catch(()=>{}); await page.keyboard.press('Escape').catch(()=>{}); await loc.click({timeout:3000}); return; }catch(e){ last=e; await page.waitForTimeout(180*attempt); } } await loc.click({force:true,timeout:2000}).catch(()=>{ throw new Error(`${label}: ${String(last?.message||last||'click failed')}`); }); };
            await page.goto('http://127.0.0.1:8081',{waitUntil:'domcontentloaded',timeout:60000});
            const tryFree=t('ESSAYER GRATUITEMENT',{exact:true});
            if(await tryFree.isVisible().catch(()=>false)) await clickRobust(tryFree,'Guest trial');
            for(const x of ['Loki Music','Découvertes','Playlists','Soirées','Profil']) await tab(x).waitFor({state:'visible',timeout:15000});
            await shot('01-listen-idle');

            // Première installation : fermer le mini-tour comme le ferait un humain
            // avant d'exercer le bouton ÉCOUTER.
            const skipCoach=page.getByLabel('Passer le mini-tour').last();
            if(await skipCoach.isVisible().catch(()=>false)) {
              await skipCoach.click({force:true});
              await page.waitForTimeout(180);
            }

            const start=page.getByLabel(/Identifier un morceau|Activer le micro|Démarrer une écoute/).last();
            await inViewport(start,'Listen start');
            await clickRobust(start,'Listen start');
            await t(/MICRO · (?:ANALYSE|ACTIF)/i).waitFor({state:'visible',timeout:15000});
            const end=page.getByLabel('Couper le micro').last();
            await inViewport(end,'Listen stop');
            await shot('02-listen-active');
            await clickRobust(end,'Listen stop');
            await start.waitFor({state:'visible',timeout:15000});

            // Découvertes : aucun profil ne doit apparaître à l'ouverture.
            // L'utilisateur doit d'abord choisir sa distance puis appuyer sur
            // RECHERCHER. Cette assertion empêche le retour d'un profil par
            // défaut qui consommerait aussi une découverte Free sans action.
            await clickRobust(tab('Découvertes'),'Découvertes tab');
            await t('1 · DISTANCE',{exact:true}).waitFor({state:'visible',timeout:15000});
            await page.getByLabel('Rechercher des profils autour de moi').last().waitFor({state:'visible',timeout:15000});
            if(await page.getByLabel('Voir le profil').last().isVisible().catch(()=>false)) throw new Error('Discover displayed a default profile before search');
            await shot('03-discover-before-search-empty');

            // Vrai geste utilisateur : choisir le rayon, rechercher, attendre le
            // résultat, puis garantir que les actions restent utilisables.
            await page.getByLabel('Rayon 100 kilomètres').last().waitFor({state:'visible',timeout:15000});
            const world=page.getByLabel('Rayon Monde').last();
            await world.waitFor({state:'visible',timeout:15000});
            await clickRobust(world,'Discover world radius');
            // Le changement de distance doit lui aussi vider les anciens
            // résultats jusqu'au prochain clic sur RECHERCHER.
            if(await page.getByLabel('Voir le profil').last().isVisible().catch(()=>false)) throw new Error('Discover kept a stale profile after radius change');
            const search=page.getByLabel('Rechercher des profils autour de moi').last();
            await inViewport(search,'Discover search');
            await clickRobust(search,'Discover search');
            const seeProfile=page.getByLabel('Voir le profil').last();
            await seeProfile.waitFor({state:'visible',timeout:15000});
            await inViewport(seeProfile,'Discover profile');
            const discoverBody=await page.locator('body').innerText();
            if(!/MONDE/i.test(discoverBody)) throw new Error('Discover radius Monde not applied');
            await shot('04-discover-after-search');

            await clickRobust(tab('Playlists'),'Playlists tab');
            await page.waitForTimeout(300);
            await shot('05-playlists');

            await clickRobust(tab('Soirées'),'Soirées tab');
            await page.waitForTimeout(300);
            await page.getByLabel('Tout comprendre sur Soirées').last().waitFor({state:'visible',timeout:15000});
            await shot('06-parties');

            await clickRobust(tab('Profil'),'Profil tab');
            const profileMenu=page.getByLabel('Menu du profil').last();
            await profileMenu.waitFor({state:'visible',timeout:15000});
            if(await t('+ Suivre',{exact:true}).isVisible().catch(()=>false)) throw new Error('Own profile displays self-follow');
            await page.getByLabel(/Notifications/).last().waitFor({state:'visible',timeout:15000});
            await shot('07-profile');
            await clickRobust(profileMenu,'Profile menu');
            const cardShare=page.getByLabel('Carte').last();
            await cardShare.waitFor({state:'visible',timeout:15000});
            await clickRobust(cardShare,'Profile card & share');
            await page.getByLabel('Partager mon profil').last().waitFor({state:'visible',timeout:15000});
            await clickRobust(t('Fermer',{exact:true}),'Close profile menu');

            const dims=await page.evaluate(()=>({width:innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(dims.scrollWidth>dims.width+1) throw new Error(`Horizontal overflow ${JSON.stringify(dims)}`);
            const pageErrors=errors.filter(x=>x.startsWith('PAGE:'));
            if(pageErrors.length) throw new Error(pageErrors.join('\n'));
            fs.writeFileSync('artifacts/human-guardian/report.txt',[
              'KEEP HUMAN GUARDIAN: PASS',
              'Viewport 390x844: PASS',
              'Five tabs: PASS',
              'Listen start/stop + direct PASSER/GARDER controls contract: PASS',
              'Discover default profile before search: ABSENT',
              'Discover radius change clears stale result: PASS',
              'Discover distance then explicit search: PASS',
              'Discover GPS permission simulation: PASS',
              'Discover real profile loaded only after search: PASS',
              'Discover Voir profil without swipe-up: PASS',
              'Playlists reachable: PASS',
              'Parties entitlement UI reachable: PASS',
              'Own profile menu/share/no self-follow: PASS',
              'No horizontal overflow: PASS',
              `Console/page messages captured: ${errors.length}`
            ].join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node keep-human-guardian.cjs
      - name: Show runtime log on failure
        if: failure()
        run: cat /tmp/keep-guardian-runtime.log || true
      - name: Upload human audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keep-human-guardian-${{ github.run_id }}
          path: artifacts/human-guardian
          if-no-files-found: ignore
