name: Loki Solo Copy Hotfix

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - '.github/workflows/loki-solo-copy-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - name: Clarify Solo purchase wording
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('packages/mobile/src/components/KeepBattleMobileGameV3.tsx')
          s=p.read_text()
          reps={
            '<Text style={s.statsUsername}>Recharger mes Solos</Text>':'<Text style={s.statsUsername}>Acheter des Solos</Text>',
            'accessibilityLabel="Recharger mes Solos"':'accessibilityLabel="Acheter des Solos"',
            '<Text style={s.soloPackEntryText}>＋ RECHARGER MES SOLOS</Text>':'<Text style={s.soloPackEntryText}>＋ ACHETER DES SOLOS</Text>',
            '<Text style={s.quotaSub} numberOfLines={1}>prochaine recharge</Text>':'<Text style={s.quotaSub} numberOfLines={1}>prochain crédit de Free</Text>',
            "Alert.alert('Recharger mes Solos', 'Les packs de Solos arrivent très bientôt. Le Battle en ligne reste disponible avec tes Free.');":"Alert.alert('Acheter des Solos', 'Les packs de Solos arrivent très bientôt. Le Battle en ligne reste disponible avec tes Free.');",
            "Alert.alert('Recharger mes Solos', 'Impossible de charger les packs pour le moment. Réessaie dans un instant.');":"Alert.alert('Acheter des Solos', 'Impossible de charger les packs pour le moment. Réessaie dans un instant.');",
            "{ text: 'Recharger mes Solos', onPress: () => { void openSoloPacks(); } },":"{ text: 'Acheter des Solos', onPress: () => { void openSoloPacks(); } },",
          }
          for a,b in reps.items():
            s=s.replace(a,b)
          old="""<Text style={s.prefsPickerHint}>Choisis un pack : 10 ou 25 Solos sont crédités immédiatement après confirmation. Chaque Solo acheté reste sur ton compte jusqu’à utilisation. Un pack ne se recharge jamais automatiquement.{soloPacks?.bonusRemaining ? ` Il t’en reste ${soloPacks.bonusRemaining} achetés.` : ''}</Text>"""
          new="""<Text style={s.prefsPickerHint}>Deux packs au choix : +10 Solos ou +25 Solos. Le pack choisi est crédité immédiatement sur ton stock. Chaque partie consomme 1 Solo. Aucun pack ne se renouvelle automatiquement : quand ton stock acheté est épuisé, tu dois acheter un nouveau pack.{soloPacks?.bonusRemaining ? ` Stock acheté restant : ${soloPacks.bonusRemaining} Solo${soloPacks.bonusRemaining > 1 ? 's' : ''}.` : ''}</Text>"""
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Verify copy
        run: |
          grep -Fq "ACHETER DES SOLOS" packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          grep -Fq "prochain crédit de Free" packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          grep -Fq "Aucun pack ne se renouvelle automatiquement" packages/mobile/src/components/KeepBattleMobileGameV3.tsx
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Loki CI"
          git config user.email "actions@users.noreply.github.com"
          git add packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          git commit -m "fix(solo): replace recharge wording with explicit purchase copy"
          git push origin HEAD:reconcile/claude-main-20260825
