name: KEEP one-time profile share patch

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - .github/workflows/one-time-run-profile-share-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python3 scripts/one_time_profile_share_patch.py

      - name: Install
        run: npm ci

      - name: Source of truth
        run: node scripts/verify-source-of-truth.cjs

      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check

      - name: Mobile tests
        run: npm --workspace packages/mobile test -- --runInBand

      - name: Export web
        working-directory: packages/mobile
        run: npx expo export --platform web --output-dir dist-web

      - name: Commit validated patch
        run: |
          rm .github/workflows/one-time-run-profile-share-patch.yml
          rm -f .github/workflows/one-time-fix-profile-swipe-sharing.yml
          rm scripts/one_time_profile_share_patch.py
          git config user.name "KEEP Codex"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "fix(profile): harden shares and separate social counters"
          git push origin HEAD:reconcile/claude-main-20260825
