name: KEEP Profile real-browser tab repair

on:
  push:
    paths:
      - 'scripts/fix_profile_real_browser_tab_contract.py'
      - '.github/workflows/profile-real-browser-tab-contract-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - name: Sync branch
        run: git pull --ff-only origin reconcile/claude-main-20260825
      - name: Apply profile source repair
        run: python3 scripts/fix_profile_real_browser_tab_contract.py
      - name: Verify profile source patch
        run: grep -F 'accessibilityLabel={`Profil ${tab.label}`}' packages/mobile/src/screens/ProfilePublicScreen.tsx
      - name: Commit profile source only
        run: |
          git config user.name "KEEP Guardian"
          git config user.email "actions@github.com"
          git add packages/mobile/src/screens/ProfilePublicScreen.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(profile): expose tab state for real mobile QA"
          git push origin HEAD:reconcile/claude-main-20260825
