name: KEEP — One-time Lock Sync

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - .github/workflows/one-time-lock-sync.yml

permissions:
  contents: write

concurrency:
  group: keep-lock-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - run: git pull --ff-only origin reconcile/claude-main-20260825
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
          else
            git commit -m "chore(deps): synchronize package lock"
            git pull --rebase origin reconcile/claude-main-20260825
            git push origin HEAD:reconcile/claude-main-20260825
          fi
