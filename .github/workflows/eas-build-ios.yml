name: KEEP — Build iOS (EAS) + TestFlight

# Pipeline Apple :
# - vérifie toujours le contrat App Store sans credential externe ;
# - lance EAS dès que EXPO_TOKEN existe ;
# - ajoute --auto-submit uniquement lorsque les credentials App Store Connect
#   nécessaires sont réellement présents.
# Aucun identifiant Apple factice n'est conservé dans le repo.

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - "packages/mobile/**"
      - "packages/music/**"
      - "scripts/verify-app-store-readiness.cjs"
      - ".github/workflows/eas-build-ios.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS (development | preview | production)"
        required: false
        default: "production"
        type: choice
        options: [development, preview, production]
      auto_submit:
        description: "Soumettre automatiquement à TestFlight après le build"
        required: false
        default: true
        type: boolean

jobs:
  build-ios:
    name: Build iOS via EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Vérifier le contrat App Store contrôlé par le code
        working-directory: .
        run: node scripts/verify-app-store-readiness.cjs

      - name: Déterminer les accès externes disponibles
        id: gate
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          INPUT_PROFILE: ${{ github.event.inputs.profile }}
          INPUT_AUTO_SUBMIT: ${{ github.event.inputs.auto_submit }}
        shell: bash
        run: |
          set -euo pipefail
          profile="${INPUT_PROFILE:-production}"
          requested_auto_submit="${INPUT_AUTO_SUBMIT:-true}"
          build_ready=false
          submit_ready=false
          has_p8=false

          if [ -n "${EXPO_TOKEN:-}" ]; then build_ready=true; fi
          if [ -n "${ASC_API_KEY_P8_BASE64:-}" ]; then has_p8=true; fi
          if [ "$profile" = "production" ] && [ "$requested_auto_submit" != "false" ] \
             && [ -n "${EXPO_TOKEN:-}" ] \
             && [ -n "${ASC_API_KEY_P8_BASE64:-}" ] \
             && [ -n "${ASC_KEY_ID:-}" ] \
             && [ -n "${ASC_ISSUER_ID:-}" ] \
             && [ -n "${APPLE_TEAM_ID:-}" ] \
             && [ -n "${ASC_APP_ID:-}" ]; then
            submit_ready=true
          fi

          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "requested_auto_submit=$requested_auto_submit" >> "$GITHUB_OUTPUT"
          echo "build_ready=$build_ready" >> "$GITHUB_OUTPUT"
          echo "submit_ready=$submit_ready" >> "$GITHUB_OUTPUT"
          echo "has_p8=$has_p8" >> "$GITHUB_OUTPUT"

          if [ "$build_ready" != "true" ]; then
            echo "::warning::EXPO_TOKEN absent : build EAS non lancé. Le préflight code reste valide et le workflow s'activera automatiquement dès que le secret sera ajouté."
          fi
          if [ "$requested_auto_submit" != "false" ] && [ "$submit_ready" != "true" ]; then
            echo "::warning::Auto-soumission TestFlight non armée : il manque au moins un des secrets ASC_API_KEY_P8_BASE64, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID ou ASC_APP_ID."
          fi

      - name: Setup EAS CLI
        if: steps.gate.outputs.build_ready == 'true'
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies (workspace root)
        if: steps.gate.outputs.build_ready == 'true'
        working-directory: .
        run: npm ci

      - name: Écrire la clé API App Store Connect
        if: steps.gate.outputs.build_ready == 'true' && steps.gate.outputs.has_p8 == 'true'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$ASC_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc-api-key.p8"
          chmod 600 "$RUNNER_TEMP/asc-api-key.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc-api-key.p8" >> "$GITHUB_ENV"

      - name: Injecter les identifiants de soumission uniquement dans le runner
        if: steps.gate.outputs.submit_ready == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'eas.json';
          const eas = JSON.parse(fs.readFileSync(file, 'utf8'));
          eas.submit ||= {};
          eas.submit.production ||= {};
          eas.submit.production.ios ||= {};
          eas.submit.production.ios.appleTeamId = process.env.APPLE_TEAM_ID;
          eas.submit.production.ios.ascAppId = process.env.ASC_APP_ID;
          fs.writeFileSync(file, JSON.stringify(eas, null, 2) + '\n');
          console.log('EAS submit config injected in runner only.');
          NODE

      - name: Vérifier l'accès App Store Connect (lecture seule)
        id: apple_api
        if: steps.gate.outputs.submit_ready == 'true'
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const https = require('node:https');

          (async () => {
            const key = fs.readFileSync(process.env.EXPO_ASC_API_KEY_PATH);
            const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const payload = `${encode({ alg: 'ES256', kid: process.env.EXPO_ASC_KEY_ID, typ: 'JWT' })}.${encode({
              iss: process.env.EXPO_ASC_ISSUER_ID,
              iat: now - 30,
              exp: now + 300,
              aud: 'appstoreconnect-v1',
            })}`;
            const token = `${payload}.${crypto.sign('sha256', Buffer.from(payload), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url')}`;
            const status = await new Promise((resolve, reject) => {
              const req = https.request(
                `https://api.appstoreconnect.apple.com/v1/apps/${process.env.ASC_APP_ID}`,
                { method: 'GET', headers: { Authorization: 'Bearer ' + token } },
                (response) => {
                  response.resume();
                  resolve(response.statusCode || 0);
                }
              );
              req.setTimeout(30000, () => req.destroy(new Error('TRANSIENT:timeout')));
              req.on('error', reject);
              req.end();
            });
            if (status !== 200) {
              if ([401, 403].includes(status)) {
                throw new Error(`AUTH:${status}`);
              }
              if (status === 404) {
                throw new Error('CONFIG:404');
              }
              throw new Error(`TRANSIENT:${status}`);
            }
            console.log('Apple API access check passed.');
          })().catch((error) => {
            const message = String(error?.message || '');
            if (message.startsWith('AUTH:')) {
              console.error('Apple auth error ' + message.slice(5));
              process.exit(42);
            }
            if (message === 'CONFIG:404') {
              console.error('ASC_APP_ID cible une app introuvable (HTTP 404).');
              process.exit(2);
            }
            console.error('Apple transient error ' + (message.startsWith('TRANSIENT:') ? message.slice(10) : message));
            process.exit(1);
          });
          NODE
          then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            code="$?"
            if [ "$code" = "42" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "::warning::API App Store Connect inaccessible avec les secrets actuels ; build iOS ignoré (aucun artefact généré) pour éviter un échec non interactif."
            elif [ "$code" = "2" ]; then
              echo "::error::ASC_APP_ID ne correspond à aucune app App Store Connect (HTTP 404). Corriger la configuration avant relance."
              exit "$code"
            else
              echo "::error::Échec temporaire App Store Connect (hors auth). Relancer le workflow."
              exit "$code"
            fi
          fi

      - name: Calculer l'autorisation finale de build
        id: build_gate
        shell: bash
        run: |
          set -euo pipefail
          execute=false
          reason='missing_expo_token'
          if [ '${{ steps.gate.outputs.build_ready }}' = 'true' ]; then
            execute=true
            reason='ready'
            if [ '${{ steps.gate.outputs.submit_ready }}' = 'true' ] && [ '${{ steps.apple_api.outputs.ready || 'false' }}' != 'true' ]; then
              execute=false
              reason='apple_auth_invalid'
            fi
          fi
          echo "execute=$execute" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Build iOS EAS
        id: ios_build
        if: steps.build_gate.outputs.execute == 'true'
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          profile='${{ steps.gate.outputs.profile }}'
          args=(build --platform ios --profile "$profile" --non-interactive --no-wait)
          if [ '${{ steps.gate.outputs.submit_ready }}' = 'true' ]; then
            args+=(--auto-submit-with-profile production)
            echo 'Build + auto-submit TestFlight armé.'
          else
            echo 'Build EAS armé sans auto-submit TestFlight.'
          fi
          set +e
          build_output="$(eas "${args[@]}" 2>&1)"
          build_code="$?"
          set -e
          printf '%s\n' "$build_output"
          if [ "$build_code" -ne 0 ]; then
            if grep -q 'Credentials are not set up. Run this command again in interactive mode.' <<<"$build_output"; then
              echo "credential_gap=true" >> "$GITHUB_OUTPUT"
              echo "effective_result=skipped_credentials" >> "$GITHUB_OUTPUT"
              echo "::warning::Credentials iOS distants incomplets sur EAS (mode non interactif). Build ignoré jusqu'à configuration."
              exit 0
            fi
            exit "$build_code"
          fi
          echo "credential_gap=false" >> "$GITHUB_OUTPUT"
          echo "effective_result=success" >> "$GITHUB_OUTPUT"

      - name: Résumé pipeline Apple
        if: always()
        shell: bash
        run: |
          {
            echo '### KEEP — pipeline iOS'
            echo
            echo "- Profil : ${{ steps.gate.outputs.profile || 'production' }}"
            echo "- Build EAS armé : ${{ steps.gate.outputs.build_ready || 'false' }}"
            echo "- Build iOS autorisé : ${{ steps.build_gate.outputs.execute || 'false' }}"
            echo "- Résultat build iOS : ${{ steps.ios_build.outcome || 'skipped' }}"
            if [ '${{ steps.ios_build.outputs.effective_result }}' = 'skipped_credentials' ]; then
              echo "- Build iOS effectif : ignoré (credentials iOS distants incomplets)"
            fi
            echo "- Auto-submit TestFlight armé : ${{ steps.gate.outputs.submit_ready || 'false' }}"
            if [ '${{ steps.gate.outputs.submit_ready }}' = 'true' ]; then
              echo "- API App Store Connect accessible : ${{ steps.apple_api.outputs.ready || 'false' }}"
            fi
            if [ '${{ steps.gate.outputs.build_ready }}' != 'true' ]; then
              echo '- Blocage externe actuel : ajouter le secret GitHub `EXPO_TOKEN`.'
            fi
            if [ '${{ steps.gate.outputs.submit_ready }}' != 'true' ]; then
              echo '- Pour TestFlight automatique : ajouter `ASC_API_KEY_P8_BASE64`, `ASC_KEY_ID`, `ASC_ISSUER_ID`, `APPLE_TEAM_ID`, `ASC_APP_ID`.'
            elif [ '${{ steps.build_gate.outputs.reason }}' = 'apple_auth_invalid' ]; then
              echo '- Build iOS ignoré (pas seulement la soumission) : les credentials App Store Connect sont invalides/expirés ou insuffisants (HTTP 401/403).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nettoyage clé API
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-api-key.p8"
