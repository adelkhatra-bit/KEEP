name: KEEP — Build iOS (EAS) + TestFlight

# Pipeline Apple :
# - vérifie toujours le contrat App Store sans credential externe ;
# - lance EAS dès que EXPO_TOKEN existe ;
# - ajoute --auto-submit uniquement lorsque les credentials App Store Connect
#   nécessaires sont réellement présents.
# Aucun identifiant Apple factice n'est conservé dans le repo.

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - "packages/mobile/**"
      - "packages/music/**"
      - "scripts/verify-app-store-readiness.cjs"
      - ".github/workflows/eas-build-ios.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS (development | preview | production)"
        required: false
        default: "production"
        type: choice
        options: [development, preview, production]
      auto_submit:
        description: "Soumettre automatiquement à TestFlight après le build"
        required: false
        default: true
        type: boolean

jobs:
  build-ios:
    name: Build iOS via EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Vérifier le contrat App Store contrôlé par le code
        working-directory: .
        run: node scripts/verify-app-store-readiness.cjs

      - name: Déterminer les accès externes disponibles
        id: gate
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          INPUT_PROFILE: ${{ github.event.inputs.profile }}
          INPUT_AUTO_SUBMIT: ${{ github.event.inputs.auto_submit }}
        shell: bash
        run: |
          set -euo pipefail
          profile="${INPUT_PROFILE:-production}"
          requested_auto_submit="${INPUT_AUTO_SUBMIT:-true}"
          build_ready=false
          submit_ready=false
          has_p8=false

          if [ -n "${EXPO_TOKEN:-}" ]; then build_ready=true; fi
          if [ -n "${ASC_API_KEY_P8_BASE64:-}" ]; then has_p8=true; fi
          if [ "$profile" = "production" ] && [ "$requested_auto_submit" != "false" ] \
             && [ -n "${EXPO_TOKEN:-}" ] \
             && [ -n "${ASC_API_KEY_P8_BASE64:-}" ] \
             && [ -n "${ASC_KEY_ID:-}" ] \
             && [ -n "${ASC_ISSUER_ID:-}" ] \
             && [ -n "${APPLE_TEAM_ID:-}" ] \
             && [ -n "${ASC_APP_ID:-}" ]; then
            submit_ready=true
          fi

          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "requested_auto_submit=$requested_auto_submit" >> "$GITHUB_OUTPUT"
          echo "build_ready=$build_ready" >> "$GITHUB_OUTPUT"
          echo "submit_ready=$submit_ready" >> "$GITHUB_OUTPUT"
          echo "has_p8=$has_p8" >> "$GITHUB_OUTPUT"

          if [ "$build_ready" != "true" ]; then
            echo "::warning::EXPO_TOKEN absent : build EAS non lancé. Le préflight code reste valide et le workflow s'activera automatiquement dès que le secret sera ajouté."
          fi
          if [ "$requested_auto_submit" != "false" ] && [ "$submit_ready" != "true" ]; then
            echo "::warning::Auto-soumission TestFlight non armée : il manque au moins un des secrets ASC_API_KEY_P8_BASE64, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID ou ASC_APP_ID."
          fi

      - name: Setup EAS CLI
        if: steps.gate.outputs.build_ready == 'true'
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.6.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies (workspace root)
        if: steps.gate.outputs.build_ready == 'true'
        working-directory: .
        run: npm ci

      - name: Écrire la clé API App Store Connect
        if: steps.gate.outputs.build_ready == 'true' && steps.gate.outputs.has_p8 == 'true'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const value = (name) => {
            const raw = process.env[name];
            if (!raw?.trim()) throw new Error(`Missing GitHub secret: ${name}`);
            const trimmed = raw.trim();
            if (/[\r\n]/.test(trimmed)) throw new Error(`Invalid multiline secret: ${name}`);
            return trimmed;
          };
          const keyPath = path.join(process.env.RUNNER_TEMP, 'asc-api-key.p8');
          const key = Buffer.from(value('ASC_API_KEY_P8_BASE64'), 'base64');
          try {
            const parsed = crypto.createPrivateKey(key);
            if (parsed.asymmetricKeyType !== 'ec' || parsed.asymmetricKeyDetails?.namedCurve !== 'prime256v1') {
              throw new Error('invalid key type');
            }
          } catch {
            throw new Error('ASC_API_KEY_P8_BASE64 must encode a valid Apple P-256 private key.');
          }
          fs.writeFileSync(keyPath, key, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `EXPO_ASC_API_KEY_PATH=${keyPath}`,
            `EXPO_ASC_KEY_ID=${value('ASC_KEY_ID')}`,
            `EXPO_ASC_ISSUER_ID=${value('ASC_ISSUER_ID')}`,
            `EXPO_APPLE_TEAM_ID=${value('APPLE_TEAM_ID')}`,
            `KEEP_ASC_APP_ID=${value('ASC_APP_ID')}`,
            ''
          ].join('\n'));
          console.log('Apple API key and identifiers normalized in runner only.');
          NODE

      - name: Injecter les identifiants de soumission uniquement dans le runner
        if: steps.gate.outputs.submit_ready == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'eas.json';
          const eas = JSON.parse(fs.readFileSync(file, 'utf8'));
          const appleTeamId = (process.env.EXPO_APPLE_TEAM_ID || process.env.APPLE_TEAM_ID || '').trim();
          const ascAppId = (process.env.KEEP_ASC_APP_ID || process.env.ASC_APP_ID || '').trim();
          if (!appleTeamId || !ascAppId) {
            throw new Error('Missing normalized Apple submit identifiers in runner.');
          }
          eas.submit ||= {};
          eas.submit.production ||= {};
          eas.submit.production.ios ||= {};
          eas.submit.production.ios.appleTeamId = appleTeamId;
          eas.submit.production.ios.ascAppId = ascAppId;
          fs.writeFileSync(file, JSON.stringify(eas, null, 2) + '\n');
          console.log('EAS submit config injected in runner only.');
          NODE

      - name: Vérifier les prérequis Apple en lecture seule
        if: steps.gate.outputs.build_ready == 'true' && steps.gate.outputs.has_p8 == 'true'
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          (async () => {
            const key = fs.readFileSync(process.env.EXPO_ASC_API_KEY_PATH);
            const enc = (obj) => Buffer.from(JSON.stringify(obj)).toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const body = enc({ alg: 'ES256', kid: process.env.EXPO_ASC_KEY_ID, typ: 'JWT' }) + '.' +
              enc({ iss: process.env.EXPO_ASC_ISSUER_ID, iat: now - 30, exp: now + 300, aud: 'appstoreconnect-v1' });
            const token = body + '.' + crypto.sign('sha256', Buffer.from(body), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url');
            async function get(route, label) {
              const response = await fetch('https://api.appstoreconnect.apple.com/v1/' + route, {
                headers: { Authorization: 'Bearer ' + token },
                signal: AbortSignal.timeout(30000)
              });
              if (!response.ok) {
                throw new Error(`${label}: Apple HTTP ${response.status}`);
              }
              return response.json();
            }
            const app = await get(`apps/${process.env.KEEP_ASC_APP_ID}`, 'App access');
            if (app.data?.attributes?.bundleId !== 'com.adelkhatra.keep') {
              throw new Error('Apple app bundle mismatch for ascAppId.');
            }
            const exactBundle = async (identifier, label) => {
              const result = await get(`bundleIds?filter[identifier]=${encodeURIComponent(identifier)}&limit=50`, label);
              const matches = (result.data || []).filter((bundle) => bundle.attributes?.identifier === identifier);
              if (matches.length !== 1) {
                throw new Error(`Apple bundle identifier missing or ambiguous: ${identifier}`);
              }
              return matches[0];
            };
            const mainBundle = await exactBundle('com.adelkhatra.keep', 'Main bundle access');
            const shareBundle = await exactBundle('com.adelkhatra.keep.share-extension', 'Share extension bundle access');
            const certificates = await get('certificates?filter[certificateType]=DISTRIBUTION&limit=1', 'Distribution certificate access');
            if (!(certificates.data || []).length) {
              throw new Error('Apple distribution certificate missing for the current App Store Connect account.');
            }
            const exactProfiles = async (bundle, label) => {
              const result = await get(`profiles?filter[profileType]=IOS_APP_STORE&filter[bundleId]=${encodeURIComponent(bundle.id)}&limit=50`, label);
              if (!(result.data || []).length) {
                throw new Error(`Apple App Store provisioning profile missing for ${bundle.attributes?.identifier || label}.`);
              }
            };
            await exactProfiles(mainBundle, 'Main provisioning profile access');
            await exactProfiles(shareBundle, 'Share extension provisioning profile access');
            console.log('Read-only Apple preflight passed for KEEP main app + share extension.');
          })().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Build iOS EAS
        if: steps.gate.outputs.build_ready == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          profile='${{ steps.gate.outputs.profile }}'
          args=(build --platform ios --profile "$profile" --non-interactive --no-wait)
          if [ '${{ steps.gate.outputs.submit_ready }}' = 'true' ]; then
            args+=(--auto-submit-with-profile production)
            echo 'Build + auto-submit TestFlight armé.'
          else
            echo 'Build EAS armé sans auto-submit TestFlight.'
          fi
          eas "${args[@]}"

      - name: Résumé pipeline Apple
        if: always()
        shell: bash
        run: |
          {
            echo '### KEEP — pipeline iOS'
            echo
            echo "- Profil : ${{ steps.gate.outputs.profile || 'production' }}"
            echo "- Build EAS armé : ${{ steps.gate.outputs.build_ready || 'false' }}"
            echo "- Auto-submit TestFlight armé : ${{ steps.gate.outputs.submit_ready || 'false' }}"
            if [ '${{ steps.gate.outputs.build_ready }}' != 'true' ]; then
              echo '- Blocage externe actuel : ajouter le secret GitHub `EXPO_TOKEN`.'
            fi
            if [ '${{ steps.gate.outputs.submit_ready }}' != 'true' ]; then
              echo '- Pour TestFlight automatique : ajouter `ASC_API_KEY_P8_BASE64`, `ASC_KEY_ID`, `ASC_ISSUER_ID`, `APPLE_TEAM_ID`, `ASC_APP_ID`.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nettoyage clé API
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-api-key.p8"
