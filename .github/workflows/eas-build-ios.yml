name: KEEP — Build iOS (EAS) + TestFlight

# Pipeline Apple :
# - vérifie toujours le contrat App Store sans credential externe ;
# - lance EAS dès que EXPO_TOKEN existe ;
# - ajoute --auto-submit uniquement lorsque les credentials App Store Connect
#   nécessaires sont réellement présents.
# Aucun identifiant Apple factice n'est conservé dans le repo.

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - "packages/mobile/**"
      - "packages/music/**"
      - "scripts/verify-app-store-readiness.cjs"
      - ".github/workflows/eas-build-ios.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS (development | preview | production)"
        required: false
        default: "production"
        type: choice
        options: [development, preview, production]
      auto_submit:
        description: "Soumettre automatiquement à TestFlight après le build"
        required: false
        default: true
        type: boolean

jobs:
  build-ios:
    name: Build iOS via EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Vérifier le contrat App Store contrôlé par le code
        working-directory: .
        run: node scripts/verify-app-store-readiness.cjs

      - name: Déterminer les accès externes disponibles
        id: gate
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          INPUT_PROFILE: ${{ github.event.inputs.profile }}
          INPUT_AUTO_SUBMIT: ${{ github.event.inputs.auto_submit }}
        shell: bash
        run: |
          set -euo pipefail
          profile="${INPUT_PROFILE:-production}"
          requested_auto_submit="${INPUT_AUTO_SUBMIT:-true}"
          build_ready=false
          submit_ready=false
          bootstrap_ready=false
          has_p8=false

          if [ -n "${EXPO_TOKEN:-}" ]; then build_ready=true; fi
          if [ -n "${ASC_API_KEY_P8_BASE64:-}" ]; then has_p8=true; fi
          if [ "$profile" = "production" ] && [ "$requested_auto_submit" != "false" ] \
             && [ -n "${EXPO_TOKEN:-}" ] \
             && [ -n "${ASC_API_KEY_P8_BASE64:-}" ] \
             && [ -n "${ASC_KEY_ID:-}" ] \
             && [ -n "${ASC_ISSUER_ID:-}" ] \
             && [ -n "${APPLE_TEAM_ID:-}" ] \
             && [ -n "${ASC_APP_ID:-}" ]; then
            submit_ready=true
          fi
          if [ "$profile" = "production" ] \
             && [ -n "${EXPO_TOKEN:-}" ] \
             && [ -n "${ASC_API_KEY_P8_BASE64:-}" ] \
             && [ -n "${ASC_KEY_ID:-}" ] \
             && [ -n "${ASC_ISSUER_ID:-}" ] \
             && [ -n "${APPLE_TEAM_ID:-}" ] \
             && [ -n "${ASC_APP_ID:-}" ]; then
            bootstrap_ready=true
          fi

          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "requested_auto_submit=$requested_auto_submit" >> "$GITHUB_OUTPUT"
          echo "build_ready=$build_ready" >> "$GITHUB_OUTPUT"
          echo "submit_ready=$submit_ready" >> "$GITHUB_OUTPUT"
          echo "bootstrap_ready=$bootstrap_ready" >> "$GITHUB_OUTPUT"
          echo "has_p8=$has_p8" >> "$GITHUB_OUTPUT"

          if [ "$build_ready" != "true" ]; then
            echo "::warning::EXPO_TOKEN absent : build EAS non lancé. Le préflight code reste valide et le workflow s'activera automatiquement dès que le secret sera ajouté."
          fi
          if [ "$requested_auto_submit" != "false" ] && [ "$submit_ready" != "true" ]; then
            echo "::warning::Auto-soumission TestFlight non armée : il manque au moins un des secrets ASC_API_KEY_P8_BASE64, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID ou ASC_APP_ID."
          fi

      - name: Setup EAS CLI
        if: steps.gate.outputs.build_ready == 'true'
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies (workspace root)
        if: steps.gate.outputs.build_ready == 'true'
        working-directory: .
        run: npm ci

      - name: Écrire la clé API App Store Connect
        if: steps.gate.outputs.build_ready == 'true' && steps.gate.outputs.has_p8 == 'true'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$ASC_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc-api-key.p8"
          chmod 600 "$RUNNER_TEMP/asc-api-key.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc-api-key.p8" >> "$GITHUB_ENV"

      - name: Injecter les identifiants de soumission uniquement dans le runner
        if: steps.gate.outputs.submit_ready == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'eas.json';
          const eas = JSON.parse(fs.readFileSync(file, 'utf8'));
          eas.submit ||= {};
          eas.submit.production ||= {};
          eas.submit.production.ios ||= {};
          eas.submit.production.ios.appleTeamId = process.env.APPLE_TEAM_ID;
          eas.submit.production.ios.ascAppId = process.env.ASC_APP_ID;
          fs.writeFileSync(file, JSON.stringify(eas, null, 2) + '\n');
          console.log('EAS submit config injected in runner only.');
          NODE

      - name: Bootstrap credentials iOS App Store dans EAS (non-interactif)
        if: steps.gate.outputs.bootstrap_ready == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        shell: bash
        run: |
          export NODE_PATH="$(npm root -g)"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const { createGraphqlClient } = require('eas-cli/build/commandUtils/context/contextUtils/createGraphqlClient');
          const { AppQuery } = require('eas-cli/build/graphql/queries/AppQuery');
          const ios = require('eas-cli/build/credentials/ios/api/GraphqlClient');
          const { assignBuildCredentialsAsync } = require('eas-cli/build/credentials/ios/actions/BuildCredentialsUtils');
          const { parse } = require('eas-cli/build/credentials/ios/utils/provisioningProfile');
          class SigningError extends Error {}
          const check = (value, message) => { if (!value) throw new SigningError(message); };
          const teamId = String(process.env.EXPO_APPLE_TEAM_ID || '').trim();
          const ascAppId = String(process.env.ASC_APP_ID || '').trim();
          let phase = 'initialisation';
          let temporaryDirectory;
          async function main() {
            check(process.env.EXPO_TOKEN, 'Missing Expo token');
            check(process.env.EXPO_ASC_KEY_ID, 'Missing ASC key id');
            check(process.env.EXPO_ASC_ISSUER_ID, 'Missing ASC issuer id');
            check(teamId, 'Missing Apple Team ID');
            check(ascAppId, 'Missing ASC app ID');
            const config = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
            const projectId = String(config?.extra?.eas?.projectId || '').trim();
            const mainBundleId = String(config?.ios?.bundleIdentifier || '').trim();
            check(projectId, 'Missing Expo projectId in app.json');
            check(mainBundleId, 'Missing iOS bundle identifier');
            const extensionBundleId = `${mainBundleId}.share-extension`;
            const keyPath = process.env.EXPO_ASC_API_KEY_PATH;
            check(keyPath && fs.existsSync(keyPath), 'Missing decoded ASC key file');
            const key = fs.readFileSync(keyPath);
            async function apple(route, method = 'GET', data) {
              const enc = value => Buffer.from(JSON.stringify(value)).toString('base64url');
              const now = Math.floor(Date.now() / 1000);
              const body = enc({ alg: 'ES256', kid: process.env.EXPO_ASC_KEY_ID, typ: 'JWT' }) + '.' +
                enc({ iss: process.env.EXPO_ASC_ISSUER_ID, iat: now - 30, exp: now + 300, aud: 'appstoreconnect-v1' });
              const token = body + '.' + crypto.sign('sha256', Buffer.from(body), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url');
              const response = await fetch(`https://api.appstoreconnect.apple.com/v1/${route}`, {
                method,
                headers: { Authorization: 'Be' + 'arer ' + token, 'Content-Type': 'application/json' },
                body: data ? JSON.stringify({ data }) : undefined,
                signal: AbortSignal.timeout(30000),
              });
              if (!response.ok) {
                const payload = await response.json().catch(() => ({}));
                const codes = (payload.errors || []).map(error => String(error.code || '').replace(/[^A-Z0-9_.-]/g, '')).join(',');
                throw new SigningError(`Apple HTTP ${response.status}${codes ? ` ${codes}` : ''}`);
              }
              return response.json();
            }
            phase = 'Expo project';
            const graphqlClient = createGraphqlClient({ accessToken: process.env.EXPO_TOKEN });
            const project = await AppQuery.byIdAsync(graphqlClient, projectId);
            const base = { account: project.ownerAccount, projectName: config.slug };
            const ctx = { graphqlClient, ios, nonInteractive: true };
            phase = 'Apple app';
            const app = await apple(`apps/${ascAppId}`);
            check(app?.data?.attributes?.bundleId === mainBundleId, 'ASC app id does not match bundle id');
            const mainBundleData = app?.data?.relationships?.bundleId?.data;
            check(mainBundleData?.id, 'Unable to resolve main bundle identifier from ASC app');
            const bundles = [
              { type: 'bundleIds', id: mainBundleData.id, attributes: { identifier: mainBundleId } },
            ];
            phase = 'Share extension bundle';
            const extensionResult = await apple(`bundleIds?filter[identifier]=${encodeURIComponent(extensionBundleId)}&limit=2`);
            check((extensionResult?.data || []).length <= 1, 'Ambiguous share extension bundle identifier');
            let extensionBundle = extensionResult?.data?.[0];
            if (!extensionBundle) {
              extensionBundle = (await apple('bundleIds', 'POST', {
                type: 'bundleIds',
                attributes: { identifier: extensionBundleId, name: 'Loki Share Extension', platform: 'IOS' },
              })).data;
            }
            bundles.push(extensionBundle);
            phase = 'Distribution certificate';
            const portal = await apple('certificates?filter[certificateType]=DISTRIBUTION,IOS_DISTRIBUTION&limit=200');
            const active = (portal?.data || []).filter(cert => new Date(cert.attributes.expirationDate).getTime() > Date.now() + 7 * 86400000);
            const normalize = serial => String(serial || '').replace(/^0+/, '').toUpperCase();
            const existing = await ios.getDistributionCertificatesForAccountAsync(graphqlClient, base.account);
            let cert = existing.find(item =>
              item.appleTeam?.appleTeamIdentifier === teamId &&
              item.certificateP12 &&
              active.some(portalCert => normalize(portalCert.attributes.serialNumber) === normalize(item.serialNumber)),
            );
            let portalCert = cert ? active.find(portalItem => normalize(portalItem.attributes.serialNumber) === normalize(cert.serialNumber)) : undefined;
            if (!cert) {
              phase = 'Create certificate';
              temporaryDirectory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'keep-signing-'));
              fs.chmodSync(temporaryDirectory, 0o700);
              const keyFile = path.join(temporaryDirectory, 'signing.key');
              const csrFile = path.join(temporaryDirectory, 'signing.csr');
              const certFile = path.join(temporaryDirectory, 'signing.der');
              const pemFile = path.join(temporaryDirectory, 'signing.pem');
              const p12File = path.join(temporaryDirectory, 'signing.p12');
              const password = crypto.randomBytes(32).toString('hex');
              const run = args => execFileSync('openssl', args, { stdio: 'ignore', env: { ...process.env, KEEP_P12_PASSWORD: password } });
              run(['req', '-new', '-newkey', 'rsa:2048', '-nodes', '-keyout', keyFile, '-out', csrFile, '-subj', '/CN=KEEP EAS Signing']);
              portalCert = (await apple('certificates', 'POST', {
                type: 'certificates',
                attributes: { certificateType: 'DISTRIBUTION', csrContent: fs.readFileSync(csrFile, 'utf8') },
              })).data;
              fs.writeFileSync(certFile, Buffer.from(portalCert.attributes.certificateContent, 'base64'), { mode: 0o600 });
              const parsed = new crypto.X509Certificate(fs.readFileSync(certFile));
              check(parsed.subject.split('\n').some(line => line === `OU=${teamId}`), 'Created cert team mismatch');
              run(['x509', '-inform', 'DER', '-in', certFile, '-out', pemFile]);
              run(['pkcs12', '-export', '-inkey', keyFile, '-in', pemFile, '-out', p12File, '-passout', 'env:KEEP_P12_PASSWORD']);
              cert = await ios.createDistributionCertificateAsync(graphqlClient, base.account, {
                certId: portalCert.id,
                certP12: fs.readFileSync(p12File).toString('base64'),
                certPassword: password,
                teamId,
              });
            }
            check(cert, 'No valid distribution certificate available');
            const appleTeam = await ios.createOrGetExistingAppleTeamAndUpdateNameIfChangedAsync(
              graphqlClient,
              base.account.id,
              { appleTeamIdentifier: teamId },
            );
            const targets = [mainBundleId, extensionBundleId];
            for (let i = 0; i < targets.length; i += 1) {
              const bundleIdentifier = targets[i];
              phase = `Profile ${bundleIdentifier}`;
              const appCtx = { ...base, bundleIdentifier, ...(i ? { parentBundleIdentifier: mainBundleId } : {}) };
              const current = await ios.getIosAppCredentialsWithBuildCredentialsAsync(
                graphqlClient,
                appCtx,
                { iosDistributionType: 'APP_STORE' },
              );
              const prior = current?.iosAppBuildCredentialsList?.[0];
              if (prior?.distributionCertificate?.id === cert.id && prior.provisioningProfile?.developerPortalIdentifier) {
                const profileCheck = await apple(`profiles/${prior.provisioningProfile.developerPortalIdentifier}`);
                if (
                  profileCheck?.data?.attributes?.profileState === 'ACTIVE' &&
                  new Date(profileCheck.data.attributes.expirationDate).getTime() > Date.now() + 7 * 86400000
                ) {
                  continue;
                }
              }
              const profile = (await apple('profiles', 'POST', {
                type: 'profiles',
                attributes: { name: `KEEP EAS ${i ? 'Share' : 'App'} ${Date.now()}`, profileType: 'IOS_APP_STORE' },
                relationships: {
                  bundleId: { data: { type: 'bundleIds', id: bundles[i].id } },
                  certificates: { data: [{ type: 'certificates', id: portalCert.id }] },
                },
              })).data;
              const plist = parse(profile.attributes.profileContent);
              check(plist.TeamIdentifier?.[0] === teamId, `Profile team mismatch for ${bundleIdentifier}`);
              check(plist.Entitlements?.['application-identifier'] === `${teamId}.${bundleIdentifier}`, `Profile bundle mismatch for ${bundleIdentifier}`);
              check(!plist.Entitlements?.['get-task-allow'], `Non AppStore profile for ${bundleIdentifier}`);
              const identifier = await ios.createOrGetExistingAppleAppIdentifierAsync(graphqlClient, appCtx, appleTeam);
              const stored = await ios.createProvisioningProfileAsync(graphqlClient, appCtx, identifier, {
                appleProvisioningProfile: profile.attributes.profileContent,
              });
              await assignBuildCredentialsAsync(ctx, appCtx, 'APP_STORE', cert, stored, appleTeam);
            }
            console.log('iOS signing bootstrap completed.');
          }
          main().catch(error => {
            console.error(`Signing bootstrap stopped during: ${phase}`);
            console.error(error instanceof SigningError ? error.message : 'Unexpected EAS signing bootstrap error');
            process.exitCode = 1;
          }).finally(() => {
            if (temporaryDirectory) fs.rmSync(temporaryDirectory, { recursive: true, force: true });
          });
          NODE

      - name: Build iOS EAS
        if: steps.gate.outputs.build_ready == 'true'
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          profile='${{ steps.gate.outputs.profile }}'
          args=(build --platform ios --profile "$profile" --non-interactive --no-wait)
          if [ "$profile" = "production" ] && [ '${{ steps.gate.outputs.bootstrap_ready }}' = 'true' ]; then
            args+=(--freeze-credentials)
          fi
          if [ '${{ steps.gate.outputs.submit_ready }}' = 'true' ]; then
            args+=(--auto-submit-with-profile production)
            echo 'Build + auto-submit TestFlight armé.'
          else
            echo 'Build EAS armé sans auto-submit TestFlight.'
          fi
          eas "${args[@]}"

      - name: Résumé pipeline Apple
        if: always()
        shell: bash
        run: |
          {
            echo '### KEEP — pipeline iOS'
            echo
            echo "- Profil : ${{ steps.gate.outputs.profile || 'production' }}"
            echo "- Build EAS armé : ${{ steps.gate.outputs.build_ready || 'false' }}"
            echo "- Auto-submit TestFlight armé : ${{ steps.gate.outputs.submit_ready || 'false' }}"
            if [ '${{ steps.gate.outputs.build_ready }}' != 'true' ]; then
              echo '- Blocage externe actuel : ajouter le secret GitHub `EXPO_TOKEN`.'
            fi
            if [ '${{ steps.gate.outputs.submit_ready }}' != 'true' ]; then
              echo '- Pour TestFlight automatique : ajouter `ASC_API_KEY_P8_BASE64`, `ASC_KEY_ID`, `ASC_ISSUER_ID`, `APPLE_TEAM_ID`, `ASC_APP_ID`.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nettoyage clé API
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-api-key.p8"
