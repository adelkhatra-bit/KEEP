name: KEEP — Web Preview Public (gratuit)

on:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/music/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-web-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check

      - name: Export KEEP web
        working-directory: packages/mobile
        env:
          EXPO_PUBLIC_KEEP_PREVIEW: '1'
        run: npx expo export --platform web --output-dir dist-web

      - name: Make exported asset paths portable
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/mobile/dist-web/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('src="/_expo/', 'src="./_expo/')
          s = s.replace('href="/_expo/', 'href="./_expo/')
          s = s.replace('href="/favicon.ico"', 'href="./favicon.ico"')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Publish web-preview branch
        run: |
          rm -rf /tmp/keep-web-preview
          mkdir -p /tmp/keep-web-preview
          cp -R packages/mobile/dist-web/. /tmp/keep-web-preview/
          cd /tmp/keep-web-preview
          git init
          git checkout -b web-preview
          git config user.name "KEEP Preview Bot"
          git config user.email "actions@github.com"
          git add .
          git commit -m "publish: KEEP web preview $GITHUB_SHA"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin web-preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
