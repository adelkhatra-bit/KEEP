name: KEEP Battle same-arena group invite UI

on:
  push:
    paths:
      - 'scripts/patch_keep_battle_group_invite_ui.py'
      - '.github/workflows/keep-battle-group-invite-ui-once.yml'
      - 'supabase/migrations/20260829232500_keep_battle_group_invites_up_to_ten.sql'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Sync branch
        run: git pull --ff-only origin reconcile/claude-main-20260825
      - name: Apply same-arena group invitation UI
        run: python3 scripts/patch_keep_battle_group_invite_ui.py
      - name: Install dependencies
        run: npm ci
      - name: Verify Battle group flow
        run: |
          npm --workspace packages/mobile run type-check
          npm --workspace packages/mobile test -- --runInBand KeepBattleMobileGameV3.compact.test.ts BattleNotificationActions.contract.test.ts
          npm --workspace packages/backend run build
      - name: Commit fix
        run: |
          git config user.name "KEEP Guardian"
          git config user.email "actions@github.com"
          git add packages/mobile/src/components/KeepBattleMobileGameV3.tsx packages/mobile/src/services/keepBattleLiveService.ts packages/mobile/src/components/__tests__/KeepBattleMobileGameV3.compact.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(battle): add players to the same group up to ten"
          git push origin HEAD:reconcile/claude-main-20260825
