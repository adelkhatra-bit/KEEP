name: KEEP — One-time App Store legal links

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - '.github/workflows/one-time-app-store-legal-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - name: Sync latest branch head
        run: git pull --rebase origin reconcile/claude-main-20260825
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply in-app legal links
        run: python scripts/one_time_app_store_legal_links.py
      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check
      - name: Verify App Store markers
        run: |
          grep -q 'Politique de confidentialité' packages/mobile/src/screens/AdvancedProfileSettingsScreen.tsx
          grep -q 'Choix de confidentialité' packages/mobile/src/screens/AdvancedProfileSettingsScreen.tsx
          grep -q 'Support KEEP' packages/mobile/src/screens/AdvancedProfileSettingsScreen.tsx
          grep -q 'Supprimer définitivement mon compte' packages/mobile/src/screens/AdvancedProfileSettingsScreen.tsx
      - name: Commit patch and clean temporary files
        run: |
          set -euo pipefail
          git config user.name 'KEEP QA Bot'
          git config user.email 'keep-qa-bot@users.noreply.github.com'
          git add packages/mobile/src/screens/AdvancedProfileSettingsScreen.tsx
          git rm .github/workflows/one-time-app-store-legal-links.yml scripts/one_time_app_store_legal_links.py
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'feat(appstore): expose privacy terms and support in app'
          git pull --rebase origin reconcile/claude-main-20260825
          git push origin HEAD:reconcile/claude-main-20260825
