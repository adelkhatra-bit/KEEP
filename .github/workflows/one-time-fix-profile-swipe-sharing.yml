name: One-time profile swipe dedupe + share patch

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - '.github/workflows/one-time-fix-profile-swipe-sharing.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-patch-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch duplicate filtering and profile share
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          public = Path('packages/mobile/src/screens/PublicUserProfileScreen.tsx')
          text = public.read_text(encoding='utf-8')

          old = "import { loadPublicProfileKeeps, loadPublicProfileSnapshot, ProfileCertificationTier, PublicProfileSnapshot } from '../services/publicProfileStateService';"
          new = "import { loadOwnProfileKeeps, loadPublicProfileKeeps, loadPublicProfileSnapshot, ProfileCertificationTier, PublicProfileSnapshot } from '../services/publicProfileStateService';"
          assert old in text, 'public profile state import changed unexpectedly'
          text = text.replace(old, new, 1)

          old = "import { shareProfile, shareProfileTrack } from '../services/sharingService';"
          new = "import { shareProfile, shareProfileTrack } from '../services/sharingService';\nimport { buildKeepTrackIdentityIndex, filterTracksNotAlreadyKept, trackExistsInKeepIndex } from '../services/keepTrackIdentity';"
          assert old in text, 'sharing import changed unexpectedly'
          text = text.replace(old, new, 1)

          marker = "function chunks<T>(items: T[], size = QUERY_CHUNK_SIZE): T[][] {\n  const out: T[][] = [];\n  for (let i = 0; i < items.length; i += size) out.push(items.slice(i, i + size));\n  return out;\n}\n"
          helper = marker + "\nfunction publicKeepToCanonical(track: PublicKeepTrack): CanonicalTrack {\n  return {\n    id: track.trackId,\n    isrc: track.isrc,\n    title: track.title,\n    artist: track.artist,\n    album: track.album || undefined,\n    durationSec: track.durationSec,\n    artworkUrl: track.artworkUrl || undefined,\n    previewUrl: track.previewUrl,\n    availableOn: track.availableOn,\n    externalUrls: track.externalUrls,\n    genres: track.genres,\n    providerIds: track.providerIds || {},\n  };\n}\n"
          assert marker in text, 'chunks helper changed unexpectedly'
          text = text.replace(marker, helper, 1)

          old = "  const [viewerKeepTrackIds, setViewerKeepTrackIds] = useState<Set<string>>(new Set());"
          new = "  const [viewerOwnKeepTracks, setViewerOwnKeepTracks] = useState<CanonicalTrack[]>([]);"
          assert old in text, 'viewer keep id state changed unexpectedly'
          text = text.replace(old, new, 1)

          old = "      setViewerKeepTrackIds(new Set());"
          new = "      setViewerOwnKeepTracks([]);"
          assert old in text, 'viewer keep reset changed unexpectedly'
          text = text.replace(old, new, 1)

          old = "        const counts: Record<string, number> = {};\n        const mine = new Set<string>();\n        const alreadyKept = new Set<string>();"
          new = "        const counts: Record<string, number> = {};\n        const mine = new Set<string>();\n        let ownKeepTracks: CanonicalTrack[] = [];\n\n        if (viewer?.id && viewer.id !== result.id && !isLocalGuest && !isDemoMode) {\n          const ownKeeps = await loadOwnProfileKeeps();\n          ownKeepTracks = ownKeeps.map((entry) => entry.track);\n        }"
          assert old in text, 'alreadyKept initialization changed unexpectedly'
          text = text.replace(old, new, 1)

          old = "\n          if (viewer?.id && viewer.id !== result.id && !isLocalGuest && !isDemoMode) {\n            const { data: ownKeeps } = await supabase\n              .from('keep_decisions')\n              .select('track_id')\n              .eq('profile_id', viewer.id)\n              .eq('decision', 'KEPT')\n              .in('track_id', idChunk);\n            for (const row of ownKeeps ?? []) if (row.track_id) alreadyKept.add(String(row.track_id));\n          }"
          assert old in text, 'legacy exact-id own keep query changed unexpectedly'
          text = text.replace(old, '', 1)

          old = "          setLikeCounts(counts);\n          setLikedTrackIds(mine);\n          setViewerKeepTrackIds(alreadyKept);"
          new = "          setLikeCounts(counts);\n          setLikedTrackIds(mine);\n          setViewerOwnKeepTracks(ownKeepTracks);"
          assert old in text, 'viewer keep result assignment changed unexpectedly'
          text = text.replace(old, new, 1)

          old = "  const albums = useMemo(() => Array.from(new Set(tracks.map((track) => track.album).filter(Boolean) as string[])), [tracks]);\n  const swipeTracks = useMemo<CanonicalTrack[]>(() => tracks.map((track) => ({\n    id: track.trackId,\n    isrc: track.isrc,\n    title: track.title,\n    artist: track.artist,\n    album: track.album || undefined,\n    durationSec: track.durationSec,\n    artworkUrl: track.artworkUrl || undefined,\n    previewUrl: track.previewUrl,\n    availableOn: track.availableOn,\n    externalUrls: track.externalUrls,\n    genres: track.genres,\n    providerIds: track.providerIds || {},\n  })), [tracks]);"
          new = "  const albums = useMemo(() => Array.from(new Set(tracks.map((track) => track.album).filter(Boolean) as string[])), [tracks]);\n  const viewerKeepIndex = useMemo(() => buildKeepTrackIdentityIndex(viewerOwnKeepTracks), [viewerOwnKeepTracks]);\n  const swipeTracks = useMemo<CanonicalTrack[]>(() => {\n    const candidates = tracks.map(publicKeepToCanonical);\n    if (!viewer?.id || viewer.id === profile?.id || isLocalGuest || isDemoMode) return candidates;\n    return filterTracksNotAlreadyKept(candidates, viewerKeepIndex);\n  }, [tracks, viewer?.id, profile?.id, isLocalGuest, isDemoMode, viewerKeepIndex]);"
          assert old in text, 'swipeTracks block changed unexpectedly'
          text = text.replace(old, new, 1)

          old = "  const alreadyInMyKeep = (trackId: string) => viewerKeepTrackIds.has(trackId);"
          new = "  const alreadyInMyKeep = (track: CanonicalTrack) => trackExistsInKeepIndex(viewerKeepIndex, track);"
          assert old in text, 'alreadyInMyKeep helper changed unexpectedly'
          text = text.replace(old, new, 1)

          text = text.replace("if (alreadyInMyKeep(canonical.id)) {", "if (alreadyInMyKeep(canonical)) {", 1)
          text = text.replace("setViewerKeepTrackIds((current) => new Set(current).add(canonical.id));", "setViewerOwnKeepTracks((current) => [...current, canonical]);", 1)

          old = "    if (alreadyInMyKeep(track.trackId)) {\n      showAlreadyKept(track.title);\n      return;\n    }\n    if (addingTrackIds.has(track.trackId)) return;\n    const canonical: CanonicalTrack = {\n      id: track.trackId,\n      isrc: track.isrc,\n      title: track.title,\n      artist: track.artist,\n      album: track.album || undefined,\n      durationSec: track.durationSec,\n      artworkUrl: track.artworkUrl || undefined,\n      previewUrl: track.previewUrl,\n      availableOn: track.availableOn,\n      externalUrls: track.externalUrls,\n      genres: track.genres,\n      providerIds: track.providerIds || {},\n    };"
          new = "    const canonical = publicKeepToCanonical(track);\n    if (alreadyInMyKeep(canonical)) {\n      showAlreadyKept(track.title);\n      return;\n    }\n    if (addingTrackIds.has(track.trackId)) return;"
          assert old in text, 'individual keep canonical block changed unexpectedly'
          text = text.replace(old, new, 1)

          text = text.replace("setViewerKeepTrackIds((current) => new Set(current).add(track.trackId));", "setViewerOwnKeepTracks((current) => [...current, canonical]);", 1)

          old = "              const alreadyKept = alreadyInMyKeep(track.trackId);"
          new = "              const alreadyKept = alreadyInMyKeep(publicKeepToCanonical(track));"
          assert old in text, 'track row already kept check changed unexpectedly'
          text = text.replace(old, new, 1)

          old = "        subtitle=\"Les extraits démarrent automatiquement. Si un morceau est déjà dans ton KEEP, aucun doublon n’est créé.\""
          new = "        subtitle=\"Les extraits démarrent automatiquement. Les morceaux déjà présents dans ton KEEP sont retirés avant le Swipe.\""
          assert old in text, 'swipe subtitle changed unexpectedly'
          text = text.replace(old, new, 1)

          public.write_text(text, encoding='utf-8')

          owner = Path('packages/mobile/src/screens/ProfilePublicScreen.tsx')
          text = owner.read_text(encoding='utf-8')
          old = "import { buildPublicProfileLink, sharePlaylist, shareProfile, shareProfileByEmail, shareProfileTrack } from '../services/sharingService';"
          new = "import { buildPublicProfileLink, copyProfileShareText, sharePlaylist, shareProfile, shareProfileByEmail, shareProfileTrack } from '../services/sharingService';"
          assert old in text, 'owner sharing import changed unexpectedly'
          text = text.replace(old, new, 1)

          old = "  const showQr = () => {\n    if (accountRequired) return openAccount('create');\n    setShareOpen(false);\n    setQrOpen(true);\n  };"
          new = "  const copyProfileLink = async () => {\n    if (accountRequired) return openAccount('create');\n    try {\n      const copied = await copyProfileShareText(user.username);\n      if (copied) Alert.alert('Lien KEEP copié', `Le profil @${user.username}, le slogan KEEP et le lien public sont prêts à coller.`);\n    } catch {\n      Alert.alert('Copie', 'Impossible de copier le lien pour le moment.');\n    }\n  };\n\n  const showQr = () => {\n    if (accountRequired) return openAccount('create');\n    setShareOpen(false);\n    setQrOpen(true);\n  };"
          assert old in text, 'showQr block changed unexpectedly'
          text = text.replace(old, new, 1)

          old = "          <TouchableOpacity style={s.shareAction} onPress={showQr}><Text style={s.shareActionText}>▦  Mon QR KEEP</Text><Text style={s.shareActionHint}>Carte d’identité musicale prête pour une story</Text></TouchableOpacity>\n          <TouchableOpacity style={s.cancelShare}"
          new = "          <TouchableOpacity style={s.shareAction} onPress={showQr}><Text style={s.shareActionText}>▦  Mon QR KEEP</Text><Text style={s.shareActionHint}>Carte d’identité musicale prête pour une story</Text></TouchableOpacity>\n          <TouchableOpacity style={s.shareAction} onPress={() => void copyProfileLink()}><Text style={s.shareActionText}>⧉  Copier mon lien KEEP</Text><Text style={s.shareActionHint}>Pseudo, slogan KEEP et lien public prêts à coller</Text></TouchableOpacity>\n          <TouchableOpacity style={s.cancelShare}"
          assert old in text, 'share modal insertion point changed unexpectedly'
          text = text.replace(old, new, 1)
          owner.write_text(text, encoding='utf-8')

          migration = Path('supabase/migrations/20260828190500_own_keep_identity_includes_private.sql')
          migration.write_text(r'''-- KEEP — identité anti-doublon pour le Swipe social.
-- Le RPC propriétaire reste authentifié uniquement. Il doit renvoyer les KEEP
-- PUBLIC et PRIVATE afin qu'un morceau privé déjà possédé ne soit jamais reproposé
-- dans le Swipe d'un autre profil. L'écran propriétaire filtre lui-même PUBLIC
-- pour l'affichage ; aucune donnée privée n'est exposée au profil public.

create or replace function public.keep_own_profile_tracks(
  p_limit integer default 250,
  p_offset integer default 0
)
returns table(
  decision_id uuid,
  kept_at timestamptz,
  visibility text,
  track_id uuid,
  isrc text,
  title text,
  artist text,
  album text,
  duration_sec integer,
  artwork_url text,
  genres text[],
  provider_ids jsonb,
  preview_url text,
  external_urls jsonb,
  available_on text[],
  context jsonb,
  source_user_id uuid,
  source_type text
)
language sql
stable
security definer
set search_path = public, auth
as $$
  with latest as (
    select distinct on (kd.track_id)
      kd.id as decision_id,
      kd.created_at as kept_at,
      kd.visibility::text as visibility,
      kd.track_id,
      t.isrc,
      t.title,
      t.artist,
      t.album,
      t.duration_sec,
      t.artwork_url,
      t.genres,
      t.provider_ids,
      t.preview_url,
      t.external_urls,
      t.available_on,
      kd.context,
      kd.source_user_id,
      kd.source_type::text as source_type
    from public.keep_decisions kd
    join public.tracks t on t.id = kd.track_id
    where kd.profile_id = auth.uid()
      and kd.decision = 'KEPT'
    order by kd.track_id, kd.created_at desc, kd.id desc
  )
  select
    decision_id,
    kept_at,
    visibility,
    track_id,
    isrc,
    title,
    artist,
    album,
    duration_sec,
    artwork_url,
    genres,
    provider_ids,
    preview_url,
    external_urls,
    available_on,
    context,
    source_user_id,
    source_type
  from latest
  order by kept_at desc, decision_id desc
  limit least(greatest(coalesce(p_limit, 250), 1), 500)
  offset greatest(coalesce(p_offset, 0), 0);
$$;

revoke all on function public.keep_own_profile_tracks(integer, integer) from public;
revoke all on function public.keep_own_profile_tracks(integer, integer) from anon;
revoke all on function public.keep_own_profile_tracks(integer, integer) from authenticated;
grant execute on function public.keep_own_profile_tracks(integer, integer) to authenticated;
''', encoding='utf-8')

          msg = Path('AGENT_MESSAGES.md')
          stamp = datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          with msg.open('a', encoding='utf-8') as f:
            f.write(f"\n\n## [{stamp}] codex\n\nAUDIT SWIPE DOUBLONS + PARTAGE PROFIL : cause trouvée = PublicUserProfileScreen ne comparait que track_id, alors que KEEP possède déjà un index canonique robuste (id + ISRC + providerIds + titre/artiste normalisés). Correction en cours : Swipe filtré AVANT affichage contre tous les KEEP du visiteur, y compris privés ; ajout direct ‘Copier mon lien KEEP’ au partage propriétaire. Aucun changement App.tsx / Navigation.tsx / barre 5 onglets / design.\n")
          PY

      - name: Install
        run: npm ci

      - name: Source of truth
        run: node scripts/verify-source-of-truth.cjs

      - name: Profile integrity
        run: node scripts/verify-profile-data-integrity.cjs

      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check

      - name: Mobile tests
        run: npm --workspace packages/mobile test -- --runInBand

      - name: Verify migrations
        shell: bash
        run: bash supabase/scripts/verify-migrations.sh

      - name: Export web
        working-directory: packages/mobile
        run: npx expo export --platform web --output-dir dist-web

      - name: Commit validated patch
        shell: bash
        run: |
          rm .github/workflows/one-time-fix-profile-swipe-sharing.yml
          git config user.name "KEEP Codex"
          git config user.email "actions@github.com"
          git add packages/mobile/src/screens/PublicUserProfileScreen.tsx packages/mobile/src/screens/ProfilePublicScreen.tsx supabase/migrations/20260828190500_own_keep_identity_includes_private.sql AGENT_MESSAGES.md .github/workflows/one-time-fix-profile-swipe-sharing.yml
          git commit -m "fix(profile): robust swipe dedupe and copy share link [agent-patch-done]"
          git push origin HEAD:reconcile/claude-main-20260825
