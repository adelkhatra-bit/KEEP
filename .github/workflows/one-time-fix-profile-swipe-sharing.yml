name: One-time profile counter design patch

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - '.github/workflows/one-time-fix-profile-swipe-sharing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply profile design on owner and visitor views
        run: |
          python3 - <<'PY'
          from pathlib import Path

          owner=Path('packages/mobile/src/screens/ProfilePublicScreen.tsx')
          t=owner.read_text(encoding='utf-8')
          old='''        {!accountRequired ? <CommunityConnectionsPanel userId={user.id} navigation={navigation} /> : null}\n        <View style={s.stats}>\n          <Stat value={profileTotalKeepCount} label="KEEP total"/>\n          <Stat value={profileUserKeepCount} label="KEEP utilisateurs"/>\n          <Stat value={profileFollowerCount} label="Abonnés"/>\n          <Stat value={profileFollowingCount} label="Abonnements"/>\n        </View>'''
          new='''        <View style={s.connectionStats}>\n          <Stat value={profileFollowerCount} label="Abonnés"/>\n          <Stat value={profileFollowingCount} label="Abonnements"/>\n        </View>\n        {!accountRequired ? <CommunityConnectionsPanel userId={user.id} navigation={navigation} /> : null}\n        <View style={s.stats}>\n          <Stat value={profileTotalKeepCount} label="KEEP total"/>\n          <Stat value={profileUserKeepCount} label="KEEP utilisateurs"/>\n        </View>'''
          assert old in t, 'owner profile counter block changed'
          t=t.replace(old,new,1)
          old="stats:{marginTop:16,flexDirection:'row',backgroundColor:colors.backgroundCard,borderRadius:radius.lg,borderWidth:1,borderColor:colors.border},stat:{flex:1,alignItems:'center',paddingVertical:10,paddingHorizontal:2},statValue:{color:colors.textPrimary,fontSize:18,fontWeight:'800'},statLabel:{color:colors.textMuted,fontSize:8,marginTop:3,textAlign:'center'},"
          new="connectionStats:{marginTop:8,flexDirection:'row',backgroundColor:colors.backgroundCard,borderRadius:radius.lg,borderWidth:1,borderColor:colors.border},stats:{marginTop:10,flexDirection:'row',backgroundColor:colors.backgroundCard,borderRadius:radius.lg,borderWidth:1,borderColor:colors.border},stat:{flex:1,alignItems:'center',paddingVertical:10,paddingHorizontal:2},statValue:{color:colors.textPrimary,fontSize:18,fontWeight:'800'},statLabel:{color:'#FFFFFF',fontSize:10,marginTop:3,textAlign:'center',fontWeight:'700'},"
          assert old in t, 'owner stat styles changed'
          t=t.replace(old,new,1)
          t=t.replace("bio:{color:colors.textSecondary,fontSize:13,lineHeight:18,marginTop:9}","bio:{color:'#FFFFFF',fontSize:14,lineHeight:20,marginTop:9}",1)
          t=t.replace("muted:{color:colors.textMuted,fontSize:12,lineHeight:17}","muted:{color:'#FFFFFF',fontSize:13,lineHeight:18}",1)
          owner.write_text(t,encoding='utf-8')

          visitor=Path('packages/mobile/src/screens/PublicUserProfileScreen.tsx')
          t=visitor.read_text(encoding='utf-8')
          old='''          {!!profile.bio && <Text style={styles.bio}>{profile.bio}</Text>}\n          <View style={styles.statsRow}>\n            <Stat value={directKeepCount} label="KEEP" />\n            <Stat value={socialKeepCount} label="KEEP utilisateurs" />\n            <Stat value={followerCount} label="Abonnés" />\n            <Stat value={followingCount} label="Abonnements" />\n          </View>'''
          new='''          {!!profile.bio && <Text style={styles.bio}>{profile.bio}</Text>}\n          <View style={styles.connectionStatsRow}>\n            <Stat value={followerCount} label="Abonnés" />\n            <Stat value={followingCount} label="Abonnements" />\n          </View>\n          <View style={styles.statsRow}>\n            <Stat value={directKeepCount} label="KEEP" />\n            <Stat value={socialKeepCount} label="KEEP utilisateurs" />\n          </View>'''
          assert old in t, 'visitor profile counter block changed'
          t=t.replace(old,new,1)
          old="statsRow:{width:'100%',flexDirection:'row',marginTop:16,borderRadius:radius.lg,backgroundColor:colors.backgroundCard,borderWidth:1,borderColor:colors.border},stat:{flex:1,alignItems:'center',paddingVertical:10,paddingHorizontal:2},statValue:{color:colors.textPrimary,fontSize:18,fontWeight:'800'},statLabel:{color:colors.textMuted,fontSize:8,marginTop:3,textAlign:'center'},"
          new="connectionStatsRow:{width:'100%',flexDirection:'row',marginTop:10,borderRadius:radius.lg,backgroundColor:colors.backgroundCard,borderWidth:1,borderColor:colors.border},statsRow:{width:'100%',flexDirection:'row',marginTop:8,borderRadius:radius.lg,backgroundColor:colors.backgroundCard,borderWidth:1,borderColor:colors.border},stat:{flex:1,alignItems:'center',paddingVertical:10,paddingHorizontal:2},statValue:{color:colors.textPrimary,fontSize:18,fontWeight:'800'},statLabel:{color:'#FFFFFF',fontSize:10,marginTop:3,textAlign:'center',fontWeight:'700'},"
          assert old in t, 'visitor stat styles changed'
          t=t.replace(old,new,1)
          t=t.replace("bio:{color:colors.textSecondary,fontSize:14,lineHeight:20,marginTop:12}","bio:{color:'#FFFFFF',fontSize:15,lineHeight:21,marginTop:12}",1)
          t=t.replace("mutedSmall:{color:colors.textMuted,fontSize:11,lineHeight:16,marginTop:8}","mutedSmall:{color:'#FFFFFF',fontSize:12,lineHeight:17,marginTop:8}",1)
          visitor.write_text(t,encoding='utf-8')

          panel=Path('packages/mobile/src/components/CommunityConnectionsPanel.tsx')
          t=panel.read_text(encoding='utf-8')
          t=t.replace("hint:{color:colors.textMuted,fontSize:10,lineHeight:14,marginTop:2}","hint:{color:'#FFFFFF',fontSize:11,lineHeight:15,marginTop:2}",1)
          t=t.replace("kind:{color:colors.textMuted,fontSize:8,marginTop:2}","kind:{color:'#FFFFFF',fontSize:9,marginTop:2}",1)
          t=t.replace("empty:{color:colors.textMuted,fontSize:10,textAlign:'center',paddingVertical:12}","empty:{color:'#FFFFFF',fontSize:11,textAlign:'center',paddingVertical:12}",1)
          panel.write_text(t,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm --workspace packages/mobile run type-check
      - run: npm --workspace packages/mobile test -- --runInBand
      - name: Export web
        working-directory: packages/mobile
        run: npx expo export --platform web --output-dir dist-web
      - name: Commit validated design
        run: |
          rm .github/workflows/one-time-fix-profile-swipe-sharing.yml
          git config user.name "KEEP Codex"
          git config user.email "actions@github.com"
          git add packages/mobile/src/screens/ProfilePublicScreen.tsx packages/mobile/src/screens/PublicUserProfileScreen.tsx packages/mobile/src/components/CommunityConnectionsPanel.tsx .github/workflows/one-time-fix-profile-swipe-sharing.yml
          git commit -m "fix(profile): separate social counters on owner and visitor views"
          git push origin HEAD:reconcile/claude-main-20260825
