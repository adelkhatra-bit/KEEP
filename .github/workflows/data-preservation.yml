name: KEEP — Data preservation contract

on:
  push:
    branches: ['reconcile/claude-main-20260825']
  pull_request:
    branches: ['reconcile/claude-main-20260825']

permissions:
  contents: read

jobs:
  preserve-user-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Self-test data guard
        run: node scripts/verify-data-preservation.cjs --self-test

      - name: Protect existing user data
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-data-preservation.cjs

      - name: Verify Public API developer tool
        run: |
          node --check scripts/public-api-search.mjs
          node scripts/public-api-search.mjs --help
