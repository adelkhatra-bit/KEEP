name: Loki EAS Push Key Mutation Audit

on:
  workflow_dispatch:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - '.github/workflows/eas-push-key-mutation-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Expo GraphQL push-key mutation API
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node <<'NODE'
          const token=process.env.EXPO_TOKEN;
          if(!token) throw new Error('EXPO_TOKEN missing');
          async function gql(query,variables={}){
            const r=await fetch('https://api.expo.dev/graphql',{
              method:'POST',
              headers:{'content-type':'application/json',authorization:'Bearer '+token},
              body:JSON.stringify({query,variables})
            });
            const j=await r.json();
            if(!r.ok||j.errors?.length) throw new Error(JSON.stringify(j.errors||j).slice(0,5000));
            return j.data;
          }
          (async()=>{
            const data=await gql(`
              query PushMutationSchema {
                __schema {
                  mutationType {
                    fields {
                      name
                      args {
                        name
                        type {
                          kind name
                          ofType { kind name ofType { kind name } }
                        }
                      }
                      type { kind name ofType { kind name } }
                    }
                  }
                }
              }
            `);
            const fields=(data.__schema?.mutationType?.fields||[])
              .filter(f=>/push|apple|credential|ios/i.test(f.name));
            console.log('EAS_PUSH_MUTATION_FIELDS='+JSON.stringify(fields,null,2));
            const detail=await gql(`
              query PushMutationDetail {
                applePushKey: __type(name:"ApplePushKeyMutation") {
                  fields {
                    name
                    args {
                      name
                      type { kind name ofType { kind name ofType { kind name } } }
                    }
                    type { kind name ofType { kind name } }
                  }
                }
                iosCredentials: __type(name:"IosAppCredentialsMutation") {
                  fields {
                    name
                    args {
                      name
                      type { kind name ofType { kind name ofType { kind name } } }
                    }
                    type { kind name ofType { kind name } }
                  }
                }
              }
            `);
            console.log('APPLE_PUSH_KEY_MUTATION_DETAIL='+JSON.stringify(detail.applePushKey?.fields||[],null,2));
            console.log('IOS_APP_CREDENTIALS_MUTATION_DETAIL='+JSON.stringify(detail.iosCredentials?.fields||[],null,2));
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
