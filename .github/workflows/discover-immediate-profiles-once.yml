name: KEEP Discover immediate profiles repair

on:
  push:
    paths:
      - 'scripts/patch_discover_immediate_profiles_and_username_search.py'
      - '.github/workflows/discover-immediate-profiles-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync branch
        run: git pull --ff-only origin reconcile/claude-main-20260825
      - name: Apply Discover repair
        run: python3 scripts/patch_discover_immediate_profiles_and_username_search.py
      - name: Install dependencies
        run: npm ci
      - name: Verify Discover mobile
        run: |
          npm --workspace packages/mobile run type-check
          npm --workspace packages/mobile test -- --runInBand DiscoverImmediateProfiles.contract.test.ts
      - name: Commit fix
        run: |
          git config user.name "KEEP Guardian"
          git config user.email "actions@github.com"
          git add packages/mobile/src/screens/DiscoverScreen.tsx packages/mobile/src/screens/__tests__/DiscoverImmediateProfiles.contract.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(discover): show public profiles immediately and add username search"
          git push origin HEAD:reconcile/claude-main-20260825
