name: KEEP — Audit boucle mobile

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/mobile-full-loop-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      EXPO_PUBLIC_DEMO_MODE: 'true'
      EXPO_PUBLIC_KEEP_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run type-check
      - name: Export web mobile
        working-directory: packages/mobile
        run: |
          npx expo export --platform web --output-dir dist-mobile-loop
          node scripts/fix-web-export.cjs dist-mobile-loop
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Start server
        run: |
          cd packages/mobile/dist-mobile-loop
          python3 -m http.server 4173 >/tmp/keep-mobile-loop.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/keep-mobile-loop.log
          exit 1
      - name: Audit complete mobile 390x844
        run: |
          mkdir -p artifacts/mobile-loop
          cat > mobile-loop.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const errors = [];
            page.on('pageerror', e => errors.push(`PAGE: ${e.message}`));
            page.on('console', m => { if (m.type() === 'error') errors.push(`CONSOLE: ${m.text()}`); });
            const shot = async (name) => page.screenshot({ path: `artifacts/mobile-loop/${name}.png`, fullPage: true });

            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(1200);

            // Si l'app arrive sur une porte d'entrée déconnectée, entrer en démo.
            const demo = page.getByText('ENTRER EN MODE DÉMO', { exact: true });
            if (await demo.count()) { await demo.first().click(); await page.waitForTimeout(800); }

            for (const label of ['Écouter','Découvertes','Playlists','Soirées','Profil']) {
              await page.getByText(label, { exact: true }).last().waitFor({ timeout: 15000 });
            }
            await shot('01-listen-idle');

            // L'écran Écouter doit avoir ses actions principales dans le viewport mobile.
            const start = page.getByText(/START A SESSION|DÉMARRER|COMMENCER/i).first();
            if (await start.count()) {
              const box = await start.boundingBox();
              if (!box || box.y + box.height > 784) throw new Error('Bouton démarrer sous la barre mobile');
            }

            await page.getByText('Profil', { exact: true }).last().click();
            await page.waitForTimeout(600);
            await shot('02-profile');
            await page.getByLabel('Modifier le profil').click();
            await page.getByText('Modifier le profil', { exact: true }).waitFor();
            await shot('03-profile-edit');

            const pseudo = page.getByPlaceholder('tonpseudo');
            await pseudo.fill('keepmobiletest');
            const dob = page.getByPlaceholder('AAAA-MM-JJ');
            await dob.fill('1990-05-12');
            await page.getByText('Enregistrer les modifications', { exact: true }).click();
            await page.waitForTimeout(600);
            await page.getByText('@keepmobiletest', { exact: true }).waitFor({ timeout: 10000 });
            await shot('04-profile-saved');

            await page.getByLabel('Modifier le profil').click();
            await page.getByText('← Revenir aux Playlists', { exact: true }).click();
            await page.waitForTimeout(700);
            await page.getByText('Playlists', { exact: true }).last().waitFor({ timeout: 10000 });
            await shot('05-back-to-playlists');

            fs.writeFileSync('artifacts/mobile-loop/report.txt', [
              'KEEP MOBILE LOOP AUDIT: PASS',
              'Viewport: 390x844',
              'Pseudo edit: PASS',
              'Birth date edit: PASS',
              'Profile -> Playlists loop: PASS',
              `Errors: ${errors.length}`,
              ...errors
            ].join('\n'));
            if (errors.some(e => e.startsWith('PAGE:'))) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node mobile-loop.cjs
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KEEP-Mobile-Full-Loop-Audit
          path: artifacts/mobile-loop
          retention-days: 14
          if-no-files-found: warn
