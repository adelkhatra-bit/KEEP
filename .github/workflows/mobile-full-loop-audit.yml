name: KEEP — Audit boucle mobile

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/mobile-full-loop-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      EXPO_PUBLIC_SUPABASE_URL: https://rrhqsqzcplvmwxizqnla.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru
      EXPO_PUBLIC_DEMO_MODE: 'true'
      EXPO_PUBLIC_KEEP_PREVIEW: '1'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run type-check
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Start exact KEEP runtime
        working-directory: packages/mobile
        run: |
          node scripts/start-web.cjs --port 8081 --clear >/tmp/keep-mobile-loop.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:8081 >/dev/null && exit 0; sleep 1; done
          cat /tmp/keep-mobile-loop.log
          exit 1
      - name: Audit complete mobile 390x844
        run: |
          mkdir -p artifacts/mobile-loop
          cat > mobile-loop.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(`PAGE: ${e.message}`));
            page.on('console', m => { if (m.type() === 'error') errors.push(`CONSOLE: ${m.text()}`); });
            const shot = async (name) => page.screenshot({ path: `artifacts/mobile-loop/${name}.png`, fullPage: true });
            const assertInViewport = async (locator, label) => {
              const box = await locator.boundingBox();
              if (!box) throw new Error(`${label}: élément invisible`);
              if (box.y < 0 || box.y + box.height > 784) throw new Error(`${label}: nécessite un swipe (${JSON.stringify(box)})`);
            };

            await page.goto('http://127.0.0.1:8081', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(1200);
            const demo = page.getByText('ENTRER EN MODE DÉMO', { exact: true });
            if (await demo.count()) { await demo.first().click(); await page.waitForTimeout(700); }

            for (const label of ['Écouter','Découvertes','Playlists','Soirées','Profil']) await page.getByText(label, { exact: true }).last().waitFor({ timeout: 15000 });
            await shot('01-listen-idle');

            const start = page.getByText(/START A SESSION|DÉMARRER|COMMENCER/i).first();
            await start.waitFor({ timeout: 10000 });
            await assertInViewport(start, 'Démarrer session');
            await start.click();
            await page.waitForTimeout(1200);
            const listening = page.getByText('EN ÉCOUTE', { exact: true });
            await listening.waitFor({ timeout: 10000 });
            await assertInViewport(listening, 'Radar écoute');
            const share = page.getByText('↗ Partager', { exact: true });
            await share.waitFor();
            await assertInViewport(share, 'Partager');
            const end = page.getByText(/terminer|arrêter|end session/i).last();
            if (await end.count()) await assertInViewport(end, 'Arrêter session');
            await shot('02-listen-active-no-swipe');

            await page.getByText('Profil', { exact: true }).last().click();
            await page.waitForTimeout(500);
            await page.getByLabel('Notifications').waitFor();
            for (const network of ['Instagram','TikTok','Snapchat','YouTube','X','Facebook']) await page.getByLabel(network).waitFor();
            await shot('03-profile-social-icons');

            await page.getByLabel('Modifier le profil').click();
            await page.getByText('Modifier le profil', { exact: true }).waitFor();
            await page.getByPlaceholder('tonpseudo').fill('keepmobiletest');
            await page.getByText('Choisir une date', { exact: true }).click();
            const validateDate = page.getByText('Valider la date', { exact: true });
            await validateDate.waitFor();
            await assertInViewport(validateDate, 'Valider date');
            await validateDate.click();
            await shot('04-profile-edit-selectors');

            await page.getByText('Réglages avancés du profil', { exact: true }).click();
            await page.getByText('Réglages avancés', { exact: true }).waitFor();
            const advancedBack = page.getByLabel('Retour au profil');
            await advancedBack.waitFor();
            await page.getByText('Playlists', { exact: true }).first().waitFor();
            await shot('05-advanced-settings-return');
            await advancedBack.click();
            await page.getByText('Modifier le profil', { exact: true }).waitFor();

            await page.getByText('Réglages avancés du profil', { exact: true }).click();
            await page.getByText('Playlists', { exact: true }).first().click();
            await page.waitForTimeout(600);
            await page.getByText('Playlists', { exact: true }).last().waitFor({ timeout: 10000 });
            await shot('06-advanced-to-playlists');

            if (errors.length) throw new Error(`Erreurs navigateur:\n${errors.join('\n')}`);
            fs.writeFileSync('artifacts/mobile-loop/report.txt', [
              'KEEP MOBILE LOOP AUDIT: PASS',
              'Viewport: 390x844',
              'Listen active state: PASS',
              'Listen essential actions without swipe: PASS',
              'Notification bell: PASS',
              'Social icons: PASS',
              'Pseudo field: PASS',
              'Birth date selector visible without swipe: PASS',
              'Advanced settings back: PASS',
              'Advanced settings -> Playlists: PASS',
              'Console/page errors: 0'
            ].join('\n'));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node mobile-loop.cjs
      - name: Show runtime log on failure
        if: failure()
        run: cat /tmp/keep-mobile-loop.log || true
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KEEP-Mobile-Full-Loop-${{ github.sha }}
          path: artifacts/mobile-loop
          retention-days: 14
          if-no-files-found: warn
