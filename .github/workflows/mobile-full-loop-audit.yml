name: KEEP — Audit boucle mobile

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/mobile-full-loop-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      EXPO_PUBLIC_SUPABASE_URL: https://rrhqsqzcplvmwxizqnla.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru
      EXPO_PUBLIC_DEMO_MODE: 'true'
      EXPO_PUBLIC_KEEP_PREVIEW: '0'
      EXPO_PUBLIC_KEEP_REAL_RECOGNITION: 'false'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run type-check
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Start exact KEEP runtime
        working-directory: packages/mobile
        run: |
          node scripts/start-web.cjs --port 8081 --clear >/tmp/keep-mobile-loop.log 2>&1 &
          echo $! >/tmp/keep-mobile-loop.pid
          for i in {1..120}; do
            if grep -Fq '[KEEP WEB] READY http://localhost:8081' /tmp/keep-mobile-loop.log 2>/dev/null && curl -fsS http://127.0.0.1:8081 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/keep-mobile-loop.log
          exit 1
      - name: Audit complet mobile 390x844 + persistance + fenêtre réduite
        run: |
          mkdir -p artifacts/mobile-loop
          cat > mobile-loop.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const errors = [];
            page.on('pageerror', e => errors.push(`PAGE: ${e.message}`));
            page.on('console', m => { if (m.type() === 'error') errors.push(`CONSOLE: ${m.text()}`); });
            page.on('dialog', async d => { await d.accept().catch(() => {}); });

            const shot = async (name) => page.screenshot({ path: `artifacts/mobile-loop/${name}.png`, fullPage: true });
            const assertInViewport = async (locator, label, viewportBottom = 784) => {
              await locator.waitFor({ state: 'visible', timeout: 15000 });
              const box = await locator.boundingBox();
              if (!box) throw new Error(`${label}: élément invisible`);
              if (box.y < 0 || box.y + box.height > viewportBottom) throw new Error(`${label}: nécessite un swipe (${JSON.stringify(box)})`);
            };
            const textLast = (value, options = {}) => page.getByText(value, options).last();
            const waitFiveTabs = async () => {
              for (const label of ['Écouter','Découvertes','Playlists','Soirées','Profil']) {
                await textLast(label, { exact: true }).waitFor({ state: 'visible', timeout: 15000 });
              }
            };

            await page.goto('http://127.0.0.1:8081', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(1000);

            // Le test complet utilise un vrai essai local éditable. Le mode
            // démo est volontairement lecture seule et ne valide pas la
            // persistance d'un profil utilisateur.
            const trial = textLast('ESSAYER GRATUITEMENT', { exact: true });
            await trial.waitFor({ state: 'visible', timeout: 15000 });
            await trial.click();
            await page.waitForTimeout(600);

            await waitFiveTabs();
            await shot('01-listen-idle');

            const start = textLast(/START A SESSION|DÉMARRER|COMMENCER/i);
            await assertInViewport(start, 'Démarrer session');
            await start.click();

            const listening = textLast(/Micro actif · analyse en cours|Session active/i);
            await assertInViewport(listening, 'Radar écoute');
            const share = textLast(/Partager/i);
            await assertInViewport(share, 'Partager');
            const end = textLast(/Terminer la session|Arrêter|End session/i);
            await assertInViewport(end, 'Arrêter session');
            // Ce workflow valide l'ergonomie sans swipe avec le provider de
            // reconnaissance démo déterministe. La reconnaissance réelle AudD
            // est vérifiée séparément par keep-music-core + le runtime browser.
            await textLast(/PASS|PASSER/i).waitFor({ state: 'visible', timeout: 15000 });
            await textLast(/KEEP|GARDER/i).waitFor({ state: 'visible', timeout: 15000 });
            await shot('02-listen-active-no-swipe');

            await end.click();
            await start.waitFor({ state: 'visible', timeout: 10000 });
            if (await listening.isVisible().catch(() => false)) throw new Error('Arrêt session: état actif encore visible après clic');
            await shot('03-listen-stopped');

            for (const [label, file] of [['Découvertes','04-discover'],['Playlists','05-playlists'],['Soirées','06-parties'],['Profil','07-profile']]) {
              await textLast(label, { exact: true }).click();
              await page.waitForTimeout(350);
              await shot(file);
            }

            await page.getByLabel('Notifications').last().waitFor({ state: 'visible', timeout: 10000 });
            for (const network of ['Instagram','TikTok','Snapchat','YouTube','X','Facebook']) {
              await page.getByLabel(network).last().waitFor({ state: 'visible', timeout: 10000 });
            }

            // Prépare un profil d'essai complet et enregistre-le réellement
            // dans le stockage local de l'appareil avant tout compte Supabase.
            await page.getByLabel('Modifier le profil').last().click();
            await textLast('Modifier le profil', { exact: true }).waitFor({ state: 'visible', timeout: 10000 });
            const pseudo = page.getByPlaceholder('tonpseudo').last();
            if (!(await pseudo.isEditable())) throw new Error('Pseudo: le profil d’essai doit être éditable');
            await pseudo.fill('keepmobiletest');
            const city = page.getByPlaceholder('Commence à saisir une ville').last();
            await city.fill('Paris');
            await textLast('⌖ Utiliser ma position', { exact: true }).waitFor({ state: 'visible', timeout: 10000 });
            await textLast('Rechercher et préremplir', { exact: true }).waitFor({ state: 'visible', timeout: 10000 });
            await textLast('Choisir un pays', { exact: true }).click();
            await textLast('France', { exact: true }).click();
            await textLast('Choisir une date', { exact: true }).click();
            const validateDate = textLast('Valider la date', { exact: true });
            await validateDate.waitFor({ state: 'attached', timeout: 10000 });
            await validateDate.scrollIntoViewIfNeeded();
            await validateDate.waitFor({ state: 'visible', timeout: 10000 });
            await validateDate.click();
            await shot('08-profile-edit-location-date');

            const saveGuest = textLast('Enregistrer sur cet appareil', { exact: true });
            await saveGuest.scrollIntoViewIfNeeded();
            await saveGuest.click();
            await page.waitForTimeout(500);
            await textLast('Profil', { exact: true }).waitFor({ state: 'visible', timeout: 10000 });

            // Relit immédiatement le brouillon local avant reload.
            await page.getByLabel('Modifier le profil').last().click();
            await textLast('Modifier le profil', { exact: true }).waitFor({ state: 'visible', timeout: 10000 });
            if ((await page.getByPlaceholder('tonpseudo').last().inputValue()) !== 'keepmobiletest') throw new Error('Pseudo local non relu après enregistrement');
            if ((await page.getByPlaceholder('Commence à saisir une ville').last().inputValue()) !== 'Paris') throw new Error('Ville locale non relue après enregistrement');
            await textLast('France', { exact: true }).waitFor({ state: 'visible', timeout: 10000 });
            await textLast('1990-01-01', { exact: true }).waitFor({ state: 'visible', timeout: 10000 });

            const advanced = textLast('Réglages avancés du profil', { exact: true });
            await advanced.scrollIntoViewIfNeeded();
            await advanced.click();
            await textLast('Réglages avancés', { exact: true }).waitFor({ state: 'visible', timeout: 10000 });
            await page.getByLabel('Retour au profil').last().waitFor({ state: 'visible', timeout: 10000 });
            for (const network of ['Instagram','TikTok','Snapchat','YouTube','X','Facebook']) {
              const item = textLast(network, { exact: true });
              await item.scrollIntoViewIfNeeded();
              await item.waitFor({ state: 'visible', timeout: 10000 });
            }

            // Enregistre un réseau en essai : le champ et l'état connecté
            // doivent survivre au reload complet eux aussi.
            const instagram = page.getByPlaceholder('Lien Instagram').last();
            await instagram.scrollIntoViewIfNeeded();
            await instagram.fill('https://instagram.com/keepmobiletest');
            const firstSave = page.getByText('Enregistrer', { exact: true }).first();
            await firstSave.scrollIntoViewIfNeeded();
            await firstSave.click();
            await page.waitForTimeout(300);
            await textLast('Connecté au profil', { exact: true }).first().waitFor({ state: 'visible', timeout: 10000 });
            await shot('09-advanced-settings-social-saved');

            // Reload complet : pas seulement retour écran. Le même profil
            // d'essai doit être restauré automatiquement depuis AsyncStorage.
            await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(800);
            await waitFiveTabs();
            await textLast('Profil', { exact: true }).click();
            await page.getByLabel('Modifier le profil').last().click();
            await textLast('Modifier le profil', { exact: true }).waitFor({ state: 'visible', timeout: 10000 });
            if ((await page.getByPlaceholder('tonpseudo').last().inputValue()) !== 'keepmobiletest') throw new Error('Pseudo perdu après reload complet');
            if ((await page.getByPlaceholder('Commence à saisir une ville').last().inputValue()) !== 'Paris') throw new Error('Ville perdue après reload complet');
            await textLast('France', { exact: true }).waitFor({ state: 'visible', timeout: 10000 });
            await textLast('1990-01-01', { exact: true }).waitFor({ state: 'visible', timeout: 10000 });
            await shot('10-profile-persisted-after-reload');

            const advancedAfterReload = textLast('Réglages avancés du profil', { exact: true });
            await advancedAfterReload.scrollIntoViewIfNeeded();
            await advancedAfterReload.click();
            const instagramAfterReload = page.getByPlaceholder('Lien Instagram').last();
            await instagramAfterReload.waitFor({ state: 'visible', timeout: 10000 });
            if ((await instagramAfterReload.inputValue()) !== 'https://instagram.com/keepmobiletest') throw new Error('Instagram perdu après reload complet');
            await textLast('Connecté au profil', { exact: true }).first().waitFor({ state: 'visible', timeout: 10000 });
            const backPlaylists = page.getByLabel('Revenir aux Playlists').last();
            await backPlaylists.scrollIntoViewIfNeeded();
            await backPlaylists.waitFor({ state: 'visible', timeout: 10000 });
            await shot('11-advanced-persisted-after-reload');
            await backPlaylists.click();
            await textLast('Playlists', { exact: true }).waitFor({ state: 'visible', timeout: 10000 });
            await shot('12-advanced-to-playlists');

            await page.setViewportSize({ width: 900, height: 700 });
            await textLast('Écouter', { exact: true }).click();
            await page.waitForTimeout(350);
            for (const label of ['Écouter','Découvertes','Playlists','Soirées','Profil']) {
              const tab = textLast(label, { exact: true });
              await assertInViewport(tab, `Onglet ${label}`, 700);
            }
            const dimensions = await page.evaluate(() => ({ width: window.innerWidth, scrollWidth: document.documentElement.scrollWidth }));
            if (dimensions.scrollWidth > dimensions.width + 1) throw new Error(`Débordement horizontal fenêtre réduite: ${JSON.stringify(dimensions)}`);
            await shot('13-windowed-900x700');

            const pageErrors = errors.filter(x => x.startsWith('PAGE:'));
            if (pageErrors.length) throw new Error(`Erreurs page:\n${pageErrors.join('\n')}`);
            fs.writeFileSync('artifacts/mobile-loop/report.txt', [
              'KEEP MOBILE LOOP AUDIT: PASS',
              'Viewport mobile: 390x844',
              'Viewport fenêtre réduite: 900x700',
              '5 tabs navigation: PASS',
              'Listen start: PASS',
              'Listen stop returns to idle: PASS',
              'Essential listen actions without swipe: PASS',
              'Profile form scroll/navigation: PASS',
              'Guest pseudo/city/country/date saved: PASS',
              'Guest profile survives full reload: PASS',
              'Guest Instagram survives full reload: PASS',
              'Reduced desktop window/no horizontal overflow: PASS',
              'Notification bell: PASS',
              'Social icons: PASS',
              'Location helpers: PASS',
              'Advanced settings -> Playlists: PASS',
              `Console/page errors captured: ${errors.length}`
            ].join('\n'));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node mobile-loop.cjs
      - name: Show runtime log on failure
        if: failure()
        run: cat /tmp/keep-mobile-loop.log || true
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KEEP-Mobile-Full-Loop-${{ github.sha }}
          path: artifacts/mobile-loop
          retention-days: 14
          if-no-files-found: warn
