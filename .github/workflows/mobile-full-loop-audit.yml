name: KEEP — Audit boucle mobile

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/mobile-full-loop-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      EXPO_PUBLIC_SUPABASE_URL: https://rrhqsqzcplvmwxizqnla.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru
      EXPO_PUBLIC_DEMO_MODE: 'true'
      EXPO_PUBLIC_KEEP_PREVIEW: '1'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run type-check
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Start exact KEEP runtime
        working-directory: packages/mobile
        run: |
          node scripts/start-web.cjs --port 8081 --clear >/tmp/keep-mobile-loop.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:8081 >/dev/null && exit 0; sleep 1; done
          cat /tmp/keep-mobile-loop.log
          exit 1
      - name: Audit complete mobile 390x844 + fenêtre réduite
        run: |
          mkdir -p artifacts/mobile-loop
          cat > mobile-loop.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(`PAGE: ${e.message}`));
            page.on('console', m => { if (m.type() === 'error') errors.push(`CONSOLE: ${m.text()}`); });
            page.on('dialog', async d => { await d.accept().catch(() => {}); });
            const shot = async (name) => page.screenshot({ path: `artifacts/mobile-loop/${name}.png`, fullPage: true });
            const visible = locator => locator.filter({ visible: true });
            const assertInViewport = async (locator, label, viewportBottom = 784) => {
              const box = await visible(locator).first().boundingBox();
              if (!box) throw new Error(`${label}: élément invisible`);
              if (box.y < 0 || box.y + box.height > viewportBottom) throw new Error(`${label}: nécessite un swipe (${JSON.stringify(box)})`);
            };

            await page.goto('http://127.0.0.1:8081', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(1000);
            const demo = visible(page.getByText('ENTRER EN MODE DÉMO', { exact: true }));
            if (await demo.count()) { await demo.first().click(); await page.waitForTimeout(600); }

            for (const label of ['Écouter','Découvertes','Playlists','Soirées','Profil']) {
              await visible(page.getByText(label, { exact: true })).last().waitFor({ timeout: 15000 });
            }
            await shot('01-listen-idle');

            const start = visible(page.getByText(/START A SESSION|DÉMARRER|COMMENCER/i)).first();
            await start.waitFor({ timeout: 10000 });
            await assertInViewport(start, 'Démarrer session');
            await start.click();
            const listening = visible(page.getByText('EN ÉCOUTE', { exact: true }));
            await listening.waitFor({ timeout: 10000 });
            await assertInViewport(listening, 'Radar écoute');
            const share = visible(page.getByText('↗ Partager', { exact: true }));
            await share.waitFor();
            await assertInViewport(share, 'Partager');
            const end = visible(page.getByText(/terminer|arrêter|end session/i)).last();
            await end.waitFor({ timeout: 10000 });
            await assertInViewport(end, 'Arrêter session');
            await shot('02-listen-active-no-swipe');
            await end.click();
            await start.waitFor({ timeout: 10000 });
            if (await visible(page.getByText('EN ÉCOUTE', { exact: true })).count()) throw new Error('Arrêt session: EN ÉCOUTE encore visible après clic');
            await shot('03-listen-stopped');

            for (const [label, file] of [['Découvertes','04-discover'],['Playlists','05-playlists'],['Soirées','06-parties'],['Profil','07-profile']]) {
              await visible(page.getByText(label, { exact: true })).last().click();
              await page.waitForTimeout(350);
              await shot(file);
            }

            await page.getByLabel('Notifications').waitFor();
            for (const network of ['Instagram','TikTok','Snapchat','YouTube','X','Facebook']) await page.getByLabel(network).waitFor();

            await page.getByLabel('Modifier le profil').click();
            await visible(page.getByText('Modifier le profil', { exact: true })).waitFor();
            await page.getByPlaceholder('tonpseudo').fill('keepmobiletest');
            await visible(page.getByText('⌖ Utiliser ma position', { exact: true })).waitFor();
            await visible(page.getByText('Rechercher et préremplir', { exact: true })).waitFor();
            await visible(page.getByText('Choisir une date', { exact: true })).click();
            const validateDate = visible(page.getByText('Valider la date', { exact: true }));
            await validateDate.waitFor();
            await assertInViewport(validateDate, 'Valider date');
            await validateDate.click();
            await shot('08-profile-edit-location-date');

            await visible(page.getByText('Réglages avancés du profil', { exact: true })).click();
            await visible(page.getByText('Réglages avancés', { exact: true })).waitFor();
            await page.getByLabel('Retour au profil').waitFor();
            await page.getByLabel('Revenir aux Playlists').waitFor();
            for (const network of ['Instagram','TikTok','Snapchat','YouTube','X','Facebook']) await visible(page.getByText(network, { exact: true })).waitFor();
            await shot('09-advanced-settings');
            await page.getByLabel('Revenir aux Playlists').click();
            await visible(page.getByText('Playlists', { exact: true })).last().waitFor({ timeout: 10000 });
            await shot('10-advanced-to-playlists');

            // Reproduit le cas réel vu sur le PC : fenêtre navigateur réduite,
            // sans plein écran. Les 5 onglets doivent rester accessibles et le
            // document ne doit jamais déborder horizontalement.
            await page.setViewportSize({ width: 900, height: 700 });
            await visible(page.getByText('Écouter', { exact: true })).last().click();
            await page.waitForTimeout(350);
            for (const label of ['Écouter','Découvertes','Playlists','Soirées','Profil']) {
              const tab = visible(page.getByText(label, { exact: true })).last();
              await tab.waitFor({ timeout: 10000 });
              await assertInViewport(tab, `Onglet ${label}`, 700);
            }
            const dimensions = await page.evaluate(() => ({ width: window.innerWidth, scrollWidth: document.documentElement.scrollWidth }));
            if (dimensions.scrollWidth > dimensions.width + 1) throw new Error(`Débordement horizontal fenêtre réduite: ${JSON.stringify(dimensions)}`);
            await shot('11-windowed-900x700');

            if (errors.length) throw new Error(`Erreurs navigateur:\n${errors.join('\n')}`);
            fs.writeFileSync('artifacts/mobile-loop/report.txt', [
              'KEEP MOBILE LOOP AUDIT: PASS',
              'Viewport mobile: 390x844',
              'Viewport fenêtre réduite: 900x700',
              '5 tabs navigation: PASS',
              'Listen start: PASS',
              'Listen stop returns to idle: PASS',
              'Essential listen actions without swipe: PASS',
              'Reduced desktop window/no horizontal overflow: PASS',
              'Notification bell: PASS',
              'Social icons: PASS',
              'Pseudo field: PASS',
              'Location helpers: PASS',
              'Birth date selector: PASS',
              'Advanced settings back/profile controls: PASS',
              'Advanced settings -> Playlists: PASS',
              'Console/page errors: 0'
            ].join('\n'));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node mobile-loop.cjs
      - name: Show runtime log on failure
        if: failure()
        run: cat /tmp/keep-mobile-loop.log || true
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KEEP-Mobile-Full-Loop-${{ github.sha }}
          path: artifacts/mobile-loop
          retention-days: 14
          if-no-files-found: warn
