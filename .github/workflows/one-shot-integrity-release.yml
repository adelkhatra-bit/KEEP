name: KEEP — One-shot integrity release

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - .github/workflows/one-shot-integrity-release.yml

permissions:
  contents: write

concurrency:
  group: keep-one-shot-integrity-release
  cancel-in-progress: true

jobs:
  apply-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout canonical KEEP branch
        uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - name: Sync latest branch head
        run: git pull --ff-only origin reconcile/claude-main-20260825

      - name: Apply user-data-safe profile/discovery correction
        run: python3 scripts/one_shot_integrity_release.py

      - name: Remove one-shot files before release commit
        run: rm -f scripts/one_shot_integrity_release.py .github/workflows/one-shot-integrity-release.yml

      - name: Static product integrity assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'profileTotalKeepCount' packages/mobile/src/screens/ProfilePublicScreen.tsx
          grep -q 'label="KEEP total"' packages/mobile/src/screens/ProfilePublicScreen.tsx
          grep -q '⌖ RECHERCHER' packages/mobile/src/screens/DiscoverScreen.tsx
          grep -q 'DISCOVERY_RADII' packages/mobile/src/screens/DiscoverScreen.tsx
          grep -q 'Menu du profil' packages/mobile/src/screens/ProfilePublicScreen.tsx
          grep -q 'PARTAGER' packages/mobile/src/screens/ProfilePublicScreen.tsx
          grep -q 'Discover search + radius visible 390x844: PASS' .github/workflows/mobile-full-loop-audit.yml
          if grep -q '<Text style={s.followPreviewText}>+ Suivre</Text>' packages/mobile/src/screens/ProfilePublicScreen.tsx; then
            echo 'Own profile still contains self-follow preview'; exit 1;
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck all workspaces
        run: npm run type-check

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Commit only after integrity gate passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fix(profile): protect total KEEP count and visual release gates"
            git pull --rebase origin reconcile/claude-main-20260825
            git push origin HEAD:reconcile/claude-main-20260825
          fi
