name: KEEP — One-shot discovery finish

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - .github/workflows/one-shot-discovery-finish.yml

permissions:
  contents: write

concurrency:
  group: keep-one-shot-discovery-finish
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - name: Sync latest branch head
        run: git pull --ff-only origin reconcile/claude-main-20260825

      - name: Apply discovery finish
        shell: bash
        run: |
          set +e
          python3 scripts/one_shot_discovery_finish.py
          script_code=$?
          set -e
          echo "patch script exit=$script_code"
          grep -q "RECHERCHER" packages/mobile/src/screens/DiscoverScreen.tsx
          grep -q "DISCOVERY_RADII" packages/mobile/src/screens/DiscoverScreen.tsx
          grep -q "approx_lat" packages/mobile/src/screens/DiscoverScreen.tsx
          grep -q "backgroundColor:'#0E0A14'" packages/mobile/src/screens/ProfilePublicScreen.tsx
          grep -q "NATIVE_VISUAL_NOISE_FLOOR_DB = -52" packages/mobile/src/services/micCapture.ts

      - name: Remove one-shot files
        run: rm -f scripts/one_shot_discovery_finish.py .github/workflows/one-shot-discovery-finish.yml scripts/one_shot_mobile_polish.py .github/workflows/one-shot-mobile-polish.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck mobile
        run: npm run type-check --workspace=packages/mobile

      - name: Typecheck music
        run: npm run type-check --workspace=packages/music

      - name: Typecheck admin
        run: npm run type-check --workspace=packages/admin

      - name: Commit finished flow
        run: |
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat(mobile): finish compact discovery search and KEEP sharing"
            git pull --rebase origin reconcile/claude-main-20260825
            git push origin HEAD:reconcile/claude-main-20260825
          fi
