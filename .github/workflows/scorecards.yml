name: KEEP — OpenSSF Scorecards

on:
  push:
    branches: ['reconcile/claude-main-20260825']
  schedule:
    - cron: '11 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecards
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: results.sarif
      - name: Upload Scorecards artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ossf-scorecards-${{ github.run_id }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 7
