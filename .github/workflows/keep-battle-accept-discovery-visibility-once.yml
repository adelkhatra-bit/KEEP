name: KEEP Battle accept + discovery visibility repair
on:
  push:
    branches: [reconcile/claude-main-20260825]
    paths:
      - scripts/patch_keep_battle_accept_and_discovery_visibility.py
      - .github/workflows/keep-battle-accept-discovery-visibility-once.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: reconcile/claude-main-20260825, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: git pull --ff-only origin reconcile/claude-main-20260825
      - name: Apply repairs
        run: python scripts/patch_keep_battle_accept_and_discovery_visibility.py
      - run: npm ci
      - name: Verify mobile
        run: |
          npx tsc -p packages/mobile/tsconfig.json --noEmit
          npx jest --config packages/mobile/jest.config.js --runInBand packages/mobile/src/components/__tests__/KeepBattleMobileGameV3.compact.test.ts packages/mobile/src/screens/__tests__/BattleNotificationActions.contract.test.ts
      - name: Contract checks
        run: |
          grep -q "const loadedArena = await loadArenaAfterAccept(response.arenaId)" packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          grep -q "minHeight: 142" packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          grep -q "created_at')" packages/mobile/src/screens/DiscoverScreen.tsx
          grep -q "radiusKm >= 20000" packages/mobile/src/screens/DiscoverScreen.tsx
      - name: Commit repair
        run: |
          git config user.name "KEEP Guardian"
          git config user.email "actions@github.com"
          git add packages/mobile/src/components/KeepBattleMobileGameV3.tsx packages/mobile/src/screens/DiscoverScreen.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(battle): authoritative accept and discover new users"
          git push origin HEAD:reconcile/claude-main-20260825
