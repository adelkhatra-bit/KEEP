name: KEEP — Web public depuis reconcile

# Main ne contient ici que le contrôleur de déploiement. La source applicative publiée reste reconcile/claude-main-20260825.
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/web-public-from-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: keep-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EXPO_PUBLIC_SUPABASE_URL: 'https://rrhqsqzcplvmwxizqnla.supabase.co'
      EXPO_PUBLIC_SUPABASE_ANON_KEY: 'sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru'
      NEXT_PUBLIC_SUPABASE_URL: 'https://rrhqsqzcplvmwxizqnla.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru'
      KEEP_ADMIN_BASE_PATH: /KEEP/admin-preview

    steps:
      - name: Checkout source unique reconcile
        uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 1

      - name: Verify deployed source
        run: |
          test "$(git branch --show-current)" = "reconcile/claude-main-20260825"
          test -f packages/mobile/App.tsx
          test -f packages/mobile/src/navigation/Navigation.tsx
          echo "KEEP_SOURCE_BRANCH=$(git branch --show-current)"
          echo "KEEP_SOURCE_SHA=$(git rev-parse HEAD)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check

      - name: Typecheck admin
        run: npm --workspace packages/admin run type-check

      - name: Export KEEP web
        working-directory: packages/mobile
        run: npx expo export --platform web --output-dir dist-web

      - name: Apply verified browser bootstrap + Pages paths
        working-directory: packages/mobile
        run: |
          node scripts/fix-web-export.cjs dist-web
          python - <<'PY'
          from pathlib import Path
          p = Path('dist-web/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('src="/_expo/', 'src="./_expo/')
          s = s.replace('href="/_expo/', 'href="./_expo/')
          s = s.replace('href="/favicon.ico"', 'href="./favicon.ico"')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build Super Admin
        run: npm --workspace packages/admin run build

      - name: Assemble public site
        run: |
          rm -rf _site
          mkdir -p _site/admin-preview _site/superadmin _site/admin
          cp -R packages/mobile/dist-web/. _site/
          cp -R packages/admin/out/. _site/admin-preview/
          cp _site/index.html _site/404.html
          cat > _site/superadmin/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEEP Super Admin</title><meta http-equiv="refresh" content="0; url=/KEEP/admin-preview/"></head><body><script>location.replace('/KEEP/admin-preview/');</script><a href="/KEEP/admin-preview/">Ouvrir KEEP Super Admin</a></body></html>
          HTML
          cp _site/superadmin/index.html _site/admin/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install cross-browser test runner
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser public smoke
        env:
          KEEP_PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node <<'NODE'
          const { chromium, firefox, webkit } = require('playwright');
          const engines = { chromium, firefox, webkit };
          const appUrl = process.env.KEEP_PUBLIC_URL;
          const adminUrl = appUrl + 'admin-preview/';
          const shortAdminUrl = appUrl + 'superadmin/';
          (async () => {
            for (const [name, engine] of Object.entries(engines)) {
              const browser = await engine.launch({ headless: true });
              const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
              await page.goto(appUrl, { waitUntil: 'networkidle', timeout: 60000 });
              await page.getByText('KEEP', { exact: true }).first().waitFor({ timeout: 30000 });
              await page.goto(adminUrl, { waitUntil: 'networkidle', timeout: 60000 });
              await page.getByText('E-mail Super Admin', { exact: true }).waitFor({ timeout: 30000 });
              const misconfigured = await page.getByText(/Supabase n.est pas configuré/i).count();
              if (misconfigured) throw new Error(`${name}: Super Admin Supabase non configuré`);
              await page.goto(shortAdminUrl, { waitUntil: 'networkidle', timeout: 60000 });
              await page.getByText('E-mail Super Admin', { exact: true }).waitFor({ timeout: 30000 });
              console.log(`${name}: KEEP + Super Admin direct + alias OK`);
              await browser.close();
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Show public URLs
        run: |
          echo "KEEP APP: ${{ steps.deployment.outputs.page_url }}"
          echo "KEEP ADMIN: ${{ steps.deployment.outputs.page_url }}admin-preview/"
          echo "KEEP ADMIN SHORT: ${{ steps.deployment.outputs.page_url }}superadmin/"
