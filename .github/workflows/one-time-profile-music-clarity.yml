name: KEEP — One-time profile music clarity

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - scripts/one_time_profile_music_clarity.py
      - .github/workflows/one-time-profile-music-clarity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - name: Sync latest branch head
        run: git pull --rebase origin reconcile/claude-main-20260825

      - name: Apply profile music clarity patch
        run: python3 scripts/one_time_profile_music_clarity.py

      - name: Apply readability and session Free patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly once, got {count}')
              return text.replace(old, new, 1)

          offers_path = Path('packages/mobile/src/screens/OffersScreen.tsx')
          offers = offers_path.read_text()
          offers = replace_once(
              offers,
              'Partage tes KEEP, tes Vibes et ton univers musical. Tu peux construire une vraie communauté et devenir influent sans avoir besoin de montrer ton visage.',
              'Partage tes KEEP, tes Vibes et ton univers musical. Ta communauté se construit autour de tes goûts, de tes découvertes et des morceaux que tu choisis de partager.',
              'community wording',
          )
          offers = replace_once(
              offers,
              "  communityOpportunityText: { color: '#FFFFFF', fontSize: 10, lineHeight: 16, fontWeight: '700', marginTop: 6 },",
              "  communityOpportunityText: { ...typography.caption, color: '#FFFFFF', lineHeight: 18, fontWeight: '700', marginTop: 6 },",
              'community text typography',
          )
          offers = replace_once(
              offers,
              "  communityOpportunityNote: { color: '#FFFFFF', fontSize: 9, lineHeight: 14, fontWeight: '800', marginTop: 8, paddingTop: 8, borderTopWidth: 1, borderTopColor: '#493369' },",
              "  communityOpportunityNote: { ...typography.caption, color: '#FFFFFF', lineHeight: 18, fontWeight: '800', marginTop: 8, paddingTop: 8, borderTopWidth: 1, borderTopColor: '#493369' },",
              'community note typography',
          )
          offers = replace_once(
              offers,
              "  creditRule: { color:'#FFFFFF', fontSize: 10, lineHeight: 15, marginTop: 7, fontWeight: '700' },",
              "  creditRule: { ...typography.caption, color:'#FFFFFF', lineHeight: 18, marginTop: 7, fontWeight: '700' },",
              'credit rule typography',
          )
          offers = replace_once(
              offers,
              "  benefit: { color: '#F8F6FC', fontSize: 11, lineHeight: 17, fontWeight: '700' },",
              "  benefit: { ...typography.caption, color: '#F8F6FC', lineHeight: 18, fontWeight: '700' },",
              'benefit typography',
          )
          offers = replace_once(
              offers,
              "  subscriptionText: { color: '#F8F6FC', fontSize: 10, lineHeight: 16, marginTop: 5, fontWeight: '700' },",
              "  subscriptionText: { ...typography.caption, color: '#F8F6FC', lineHeight: 18, marginTop: 5, fontWeight: '700' },",
              'subscription typography',
          )
          offers_path.write_text(offers)

          home_path = Path('packages/mobile/src/screens/HomeScreenCompact.tsx')
          home = home_path.read_text()
          home = replace_once(
              home,
              "import { getDownloadCreditStatus } from '../services/creditService';",
              "import { getDownloadCreditStatus } from '../services/creditService';\nimport { typography } from '../theme/spacing';",
              'home typography import',
          )
          home = replace_once(
              home,
              """function TopBar({ navigation }: any) {
  return <View style={s.topBar}>
    <TouchableOpacity style={s.round} onPress={() => navigation.navigate('SessionHistory')}><Text style={s.roundText}>☰</Text></TouchableOpacity>
    <Text style={s.brand}>KEEP</Text>
    <View style={s.topBarSpacer} />
  </View>;
}""",
              """function TopBar({ navigation, planCode, creditRemaining, creditUnlimited }: { navigation: any; planCode: string; creditRemaining: number | null; creditUnlimited: boolean }) {
  const freeLabel = creditUnlimited ? 'Free : ∞' : creditRemaining == null ? 'Free : …' : `Free : ${Math.max(0, creditRemaining)}`;
  const exhausted = !creditUnlimited && creditRemaining != null && creditRemaining <= 0;
  const paid = creditUnlimited && planCode !== 'FREE' && planCode !== 'GUEST';
  return <View style={s.topBar}>
    <TouchableOpacity style={s.round} onPress={() => navigation.navigate('SessionHistory')}><Text style={s.roundText}>☰</Text></TouchableOpacity>
    <Text style={s.brand}>KEEP</Text>
    <View style={[s.premium, paid ? s.planPaid : exhausted ? s.planExhausted : s.planFree]}>
      <Text style={[s.premiumText, exhausted ? s.planExhaustedText : paid ? undefined : s.planFreeText]}>{freeLabel}</Text>
    </View>
  </View>;
}""",
              'session TopBar Free badge',
          )
          home = replace_once(
              home,
              """        </ListenEnergyAura>

        {error ? <View style={s.errorBanner}><Text style={s.errorBannerText}>{error}</Text></View> : null}""",
              """        </ListenEnergyAura>
        <View style={s.freeStatusRow}>
          <Text style={s.freeStatusText}>{creditUnlimited ? 'Free : ∞ · Écouter/PASSER = 0 · GARDER = 1' : `Free : ${creditRemaining == null ? '…' : Math.max(0, creditRemaining)} · Écouter/PASSER = 0 · GARDER = 1`}</Text>
        </View>

        {error ? <View style={s.errorBanner}><Text style={s.errorBannerText}>{error}</Text></View> : null}""",
              'session Free rule row',
          )
          home = replace_once(
              home,
              "  premiumText: { color: C.purpleLight, fontSize: 10, fontWeight: '800' },",
              "  premiumText: { ...typography.caption, color: C.purpleLight, fontWeight: '800' },",
              'session badge typography',
          )
          home = replace_once(
              home,
              "  miniLabel: { color: C.muted, fontSize: 9, marginTop: 1 },",
              "  miniLabel: { color: C.muted, fontSize: 9, marginTop: 1 },\n  freeStatusRow: { minHeight: 30, alignItems: 'center', justifyContent: 'center', paddingHorizontal: 8, marginTop: 5 },\n  freeStatusText: { ...typography.caption, color: C.text, lineHeight: 18, fontWeight: '800', textAlign: 'center' },",
              'session Free styles',
          )
          home_path.write_text(home)

          recap_path = Path('packages/mobile/src/screens/SessionRecapScreen.tsx')
          recap = recap_path.read_text()
          recap = replace_once(
              recap,
              "import { spacing, radius, typography } from '../theme/spacing';",
              "import { spacing, radius, typography } from '../theme/spacing';\nimport { getDownloadCreditStatus } from '../services/creditService';",
              'recap credit import',
          )
          recap = replace_once(
              recap,
              """  const [swipeOpen, setSwipeOpen] = useState(false);
  const [swipeTracks, setSwipeTracks] = useState<CanonicalTrack[]>([]);

  useEffect(() => {
    void refreshCreditLocks().catch(() => {});
    const unsubscribe = navigation?.addListener?.('focus', () => {
      void refreshCreditLocks().catch(() => {});
    });""",
              """  const [swipeOpen, setSwipeOpen] = useState(false);
  const [swipeTracks, setSwipeTracks] = useState<CanonicalTrack[]>([]);
  const [creditRemaining, setCreditRemaining] = useState<number | null>(null);
  const [creditUnlimited, setCreditUnlimited] = useState(false);

  const refreshFreeStatus = async () => {
    try {
      const status = await getDownloadCreditStatus();
      setCreditRemaining(status.remaining);
      setCreditUnlimited(status.unlimited);
    } catch {
      setCreditRemaining(null);
      setCreditUnlimited(false);
    }
  };

  useEffect(() => {
    void refreshCreditLocks().catch(() => {});
    void refreshFreeStatus();
    const unsubscribe = navigation?.addListener?.('focus', () => {
      void refreshCreditLocks().catch(() => {});
      void refreshFreeStatus();
    });""",
              'recap Free state',
          )
          recap = replace_once(
              recap,
              """      await refreshCreditLocks().catch(() => {});
      await keepAllPendingInSession(sessionId, visibility);
    } finally {""",
              """      await refreshCreditLocks().catch(() => {});
      await keepAllPendingInSession(sessionId, visibility);
      await refreshFreeStatus();
    } finally {""",
              'recap keep all Free refresh',
          )
          recap = replace_once(
              recap,
              """    await refreshCreditLocks().catch(() => {});
    await keepTrackInSession(sessionId, entry.id, undefined, visibility);
    const refreshed = useSessionHistoryStore.getState().sessions.find""",
              """    await refreshCreditLocks().catch(() => {});
    await keepTrackInSession(sessionId, entry.id, undefined, visibility);
    await refreshFreeStatus();
    const refreshed = useSessionHistoryStore.getState().sessions.find""",
              'recap swipe Free refresh',
          )
          recap = replace_once(
              recap,
              """      </View>

      {lockedCount > 0 ? (
        <TouchableOpacity style={styles.lockedBanner}""",
              """      </View>

      <View style={styles.freeCard}>
        <View style={styles.freeCardTop}>
          <Text style={styles.freeCardTitle}>SOLDE FREE</Text>
          <Text style={styles.freeCardValue}>{creditUnlimited ? '∞ Free' : `${creditRemaining == null ? '…' : Math.max(0, creditRemaining)} Free`}</Text>
        </View>
        <Text style={styles.freeCardText}>Écouter / reconnaître / PASSER = 0 Free · GARDER un morceau découvert avec Écouter = 1 Free · morceau pris sur le profil d’un autre membre = 0 Free.</Text>
      </View>

      {lockedCount > 0 ? (
        <TouchableOpacity style={styles.lockedBanner}""",
              'recap Free card',
          )
          recap = replace_once(
              recap,
              "KEEP vérifie d’abord ton solde. S’il reste des crédits, le cadenas disparaît automatiquement ; sinon appuie ici pour voir Premium.",
              "KEEP vérifie d’abord ton solde Free. S’il en reste, le cadenas disparaît automatiquement ; sinon appuie ici pour voir Premium.",
              'recap locked wording',
          )
          recap = replace_once(
              recap,
              "  statsDot: { color: colors.textMuted },",
              "  statsDot: { color: colors.textMuted },\n  freeCard: { marginHorizontal: spacing.xl, marginTop: spacing.md, paddingHorizontal: spacing.md, paddingVertical: 10, borderRadius: radius.md, backgroundColor: colors.backgroundCard, borderWidth: 1, borderColor: colors.border },\n  freeCardTop: { flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', gap: spacing.sm },\n  freeCardTitle: { ...typography.caption, color: colors.primaryLight, fontWeight: '900', letterSpacing: .5 },\n  freeCardValue: { ...typography.caption, color: colors.keep, fontWeight: '900' },\n  freeCardText: { ...typography.caption, color: colors.textSecondary, lineHeight: 18, marginTop: 5, fontWeight: '600' },",
              'recap Free styles',
          )
          recap_path.write_text(recap)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm run type-check --workspace=packages/mobile

      - name: Verify clarity, readability and Free contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          own = Path('packages/mobile/src/screens/ProfilePublicScreen.tsx').read_text()
          public = Path('packages/mobile/src/screens/PublicUserProfileScreen.tsx').read_text()
          state = Path('packages/mobile/src/services/publicProfileStateService.ts').read_text()
          offers = Path('packages/mobile/src/screens/OffersScreen.tsx').read_text()
          home = Path('packages/mobile/src/screens/HomeScreenCompact.tsx').read_text()
          recap = Path('packages/mobile/src/screens/SessionRecapScreen.tsx').read_text()
          required = [
            (own, 'Vibes (ambiances & styles)'),
            (own, 'Ce ne sont ni des albums ni des événements.'),
            (own, 'Artistes (interprètes)'),
            (own, 'Albums (un artiste + un album)'),
            (own, 'const albumGroups = useMemo'),
            (own, 'const displayPlaylists = useMemo<ProviderPlaylist[]>(() => smartAlbums.map(smartAlbumAsProviderPlaylist), [smartAlbums]);'),
            (own, 'Tes morceaux ajoutés avec Écouter sont tes découvertes.'),
            (own, 'Découvert en Écoute par'),
            (own, 'via @'),
            (public, 'Une musique trouvée directement avec Écouter par cette personne est sa découverte.'),
            (public, 'Découvert en Écoute par'),
            (public, 'via @'),
            (public, "navigation.navigate('PublicProfile', { username: sourceUsername.replace(/^@+/, '') })"),
            (state, 'originUserId?: string;'),
            (state, 'originUsername?: string;'),
            (state, 'contextSourceProfileId'),
            (offers, 'Chaque morceau que tu ajoutes grâce à Écouter peut porter ton @ comme découvreur d’origine.'),
            (offers, 'Ta communauté se construit autour de tes goûts, de tes découvertes et des morceaux que tu choisis de partager.'),
            (offers, 'communityOpportunityText: { ...typography.caption'),
            (offers, 'communityOpportunityNote: { ...typography.caption'),
            (home, "const freeLabel = creditUnlimited ? 'Free : ∞'"),
            (home, 'Écouter/PASSER = 0 · GARDER = 1'),
            (home, 'freeStatusText: { ...typography.caption'),
            (recap, 'SOLDE FREE'),
            (recap, 'morceau pris sur le profil d’un autre membre = 0 Free.'),
            (recap, 'freeCardText: { ...typography.caption'),
          ]
          missing = [needle for haystack, needle in required if needle not in haystack]
          if missing:
            raise SystemExit('Missing contract: ' + repr(missing))
          if 'result.push(...providerPlaylists)' in own:
            raise SystemExit('Provider playlists must not be mixed into Vibes')
          if 'sourceUsername.slice(0, 4)' in own:
            raise SystemExit('Source username must never be truncated')
          if 'montrer ton visage' in offers.lower():
            raise SystemExit('Old face wording must not remain')
          PY

      - name: Commit verified source patch and clean temporary files
        run: |
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          git add packages/mobile/src/services/publicProfileStateService.ts packages/mobile/src/screens/ProfilePublicScreen.tsx packages/mobile/src/screens/PublicUserProfileScreen.tsx packages/mobile/src/screens/OffersScreen.tsx packages/mobile/src/screens/HomeScreenCompact.tsx packages/mobile/src/screens/SessionRecapScreen.tsx
          git rm .github/workflows/one-time-profile-music-clarity.yml scripts/one_time_profile_music_clarity.py
          git commit -m "fix(mobile): improve readability and show Free in sessions"
          git pull --rebase origin reconcile/claude-main-20260825
          git push origin HEAD:reconcile/claude-main-20260825
