name: KEEP — One-time profile music clarity

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - scripts/one_time_profile_music_clarity.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - name: Sync latest branch head
        run: git pull --rebase origin reconcile/claude-main-20260825

      - name: Apply profile music clarity patch
        run: python3 scripts/one_time_profile_music_clarity.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm run typecheck --workspace @keep/mobile

      - name: Verify clarity and provenance contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          own = Path('packages/mobile/src/screens/ProfilePublicScreen.tsx').read_text()
          public = Path('packages/mobile/src/screens/PublicUserProfileScreen.tsx').read_text()
          state = Path('packages/mobile/src/services/publicProfileStateService.ts').read_text()
          offers = Path('packages/mobile/src/screens/OffersScreen.tsx').read_text()
          required = [
            (own, 'Vibes (ambiances & styles)'),
            (own, 'Ce ne sont ni des albums ni des événements.'),
            (own, 'Artistes (interprètes)'),
            (own, 'Albums (un artiste + un album)'),
            (own, 'const albumGroups = useMemo'),
            (own, 'const displayPlaylists = useMemo<ProviderPlaylist[]>(() => smartAlbums.map(smartAlbumAsProviderPlaylist), [smartAlbums]);'),
            (own, 'Tes morceaux ajoutés avec Écouter sont tes découvertes.'),
            (own, 'Découvert en Écoute par'),
            (own, 'via @'),
            (public, 'Une musique trouvée directement avec Écouter par cette personne est sa découverte.'),
            (public, 'Découvert en Écoute par'),
            (public, 'via @'),
            (public, "navigation.navigate('PublicProfile', { username: sourceUsername.replace(/^@+/, '') })"),
            (state, 'originUserId?: string;'),
            (state, 'originUsername?: string;'),
            (state, 'contextSourceProfileId'),
            (offers, 'Chaque morceau que tu ajoutes grâce à Écouter peut porter ton @ comme découvreur d’origine.'),
          ]
          missing = [needle for haystack, needle in required if needle not in haystack]
          if missing:
            raise SystemExit('Missing music/provenance contract: ' + repr(missing))
          if 'result.push(...providerPlaylists)' in own:
            raise SystemExit('Provider playlists must not be mixed into Vibes')
          if 'sourceUsername.slice(0, 4)' in own:
            raise SystemExit('Source username must never be truncated')
          PY

      - name: Commit verified source patch
        run: |
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          git add packages/mobile/src/services/publicProfileStateService.ts packages/mobile/src/screens/ProfilePublicScreen.tsx packages/mobile/src/screens/PublicUserProfileScreen.tsx packages/mobile/src/screens/OffersScreen.tsx
          if git diff --cached --quiet; then
            echo "No source change required"
            exit 0
          fi
          git commit -m "fix(profile): clarify collections and discovery provenance"
          git pull --rebase origin reconcile/claude-main-20260825
          git push origin HEAD:reconcile/claude-main-20260825
