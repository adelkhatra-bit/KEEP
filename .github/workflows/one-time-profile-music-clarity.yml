name: KEEP — One-time profile music clarity

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - scripts/one_time_profile_music_clarity.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - name: Sync latest branch head
        run: |
          git pull --rebase origin reconcile/claude-main-20260825

      - name: Apply profile music clarity patch
        run: python3 scripts/one_time_profile_music_clarity.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm run typecheck --workspace @keep/mobile

      - name: Verify clarity contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          own = Path('packages/mobile/src/screens/ProfilePublicScreen.tsx').read_text()
          public = Path('packages/mobile/src/screens/PublicUserProfileScreen.tsx').read_text()
          required_own = [
            'Vibes (ambiances & styles)',
            'Ce ne sont ni des albums ni des événements.',
            'Artistes (interprètes)',
            'Albums (un artiste + un album)',
            'const albumGroups = useMemo',
            'const displayPlaylists = useMemo<ProviderPlaylist[]>(() => smartAlbums.map(smartAlbumAsProviderPlaylist), [smartAlbums]);',
            'Tes écoutes et tes partages de liens = tes propres découvertes.',
            'Découvert via',
            '@{sourceUsername}',
          ]
          required_public = [
            'sourceUsername?: string;',
            'sourceUsername: entry.sourceUsername',
            'Découvert via',
            'Une musique trouvée par cette personne lui appartient comme découverte.',
            "navigation.navigate('PublicProfile', { username: sourceUsername.replace(/^@+/, '') })",
          ]
          missing = [x for x in required_own if x not in own] + [x for x in required_public if x not in public]
          if missing:
            raise SystemExit('Missing profile music/provenance clarity contract: ' + repr(missing))
          if 'result.push(...providerPlaylists)' in own:
            raise SystemExit('Provider playlists must not be mixed into Vibes')
          if 'sourceUsername.slice(0, 4)' in own:
            raise SystemExit('Source username must never be truncated')
          PY

      - name: Commit source patch
        run: |
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          git add packages/mobile/src/screens/ProfilePublicScreen.tsx packages/mobile/src/screens/PublicUserProfileScreen.tsx
          if git diff --cached --quiet; then
            echo "No source change required"
            exit 0
          fi
          git commit -m "fix(profile): clarify music collections and provenance"
          git pull --rebase origin reconcile/claude-main-20260825
          git push origin HEAD:reconcile/claude-main-20260825
