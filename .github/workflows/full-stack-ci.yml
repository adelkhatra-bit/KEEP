name: KEEP — CI complète

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'config/**'
      - 'supabase/**'
      - 'render.yaml'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/codeql.yml'
      - '.github/dependabot.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'START_KEEP_LIVE_CLEAN.bat'
      - 'START_KEEP_PRO.ps1'
      - 'START_KEEP_PRO.bat'
      - 'START_KEEP_LATEST.bat'
      - 'FORCE_START_LATEST_KEEP.bat'
      - '.github/workflows/full-stack-ci.yml'
      - '.github/workflows/mobile-ci.yml'
      - 'APP_STORE_CHECKLIST.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Verify KEEP capability inventory
        run: node scripts/verify-capability-inventory.cjs
      - name: Verify KEEP source of truth
        run: node scripts/verify-source-of-truth.cjs
      - name: Verify App Store readiness contract
        run: node scripts/verify-app-store-readiness.cjs
      - name: Verify Super Admin to user contract
        run: node scripts/verify-admin-user-loop.cjs
      - name: Verify Super Admin integrations single source
        run: node scripts/verify-admin-integrations-single-source.cjs
      - name: Verify direct Supabase push architecture
        run: node scripts/verify-push-direct-supabase.cjs
      - name: Install
        run: npm ci
      - name: Typecheck all workspaces
        run: npm run type-check
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Super Admin keys contract and file import
        run: node --test scripts/admin-integration-keys.test.cjs
      - name: Catalog tokens and Super Admin provider checks — isolated fixtures
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/keep-edge-tools" --no-save --package-lock=false jose@5.9.6
          KEEP_JOSE_TEST_MODULE="$RUNNER_TEMP/keep-edge-tools/node_modules/jose" \
            node --test supabase/functions/_shared/musicProviders.test.cjs scripts/admin-integrations-runtime.test.cjs
      - name: Live keyless recognition smoke — text + shared YouTube URL, no private API key
        env:
          KEEP_SUPABASE_URL: 'https://rrhqsqzcplvmwxizqnla.supabase.co'
          KEEP_SUPABASE_ANON_KEY: 'sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru'
        shell: bash
        run: |
          set -euo pipefail
          common_headers=(
            -H "apikey: $KEEP_SUPABASE_ANON_KEY"
            -H "Authorization: Bearer $KEEP_SUPABASE_ANON_KEY"
            -H 'Content-Type: application/json'
          )

          curl --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 -fsS \
            -X POST "$KEEP_SUPABASE_URL/functions/v1/keep-music-keyless-source" \
            "${common_headers[@]}" \
            -H 'x-keep-device-id: github-ci-keyless-text-smoke' \
            --data '{"rawText":"Rick Astley - Never Gonna Give You Up","title":"Rick Astley - Never Gonna Give You Up","platform":"WEB"}' \
            -o /tmp/keep-keyless-text.json

          curl --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 -fsS \
            -X POST "$KEEP_SUPABASE_URL/functions/v1/keep-music-keyless-source" \
            "${common_headers[@]}" \
            -H 'x-keep-device-id: github-ci-keyless-youtube-smoke' \
            --data '{"url":"https://www.youtube.com/watch?v=dQw4w9WgXcQ","platform":"YOUTUBE"}' \
            -o /tmp/keep-keyless-youtube.json

          node - <<'NODE'
          const fs = require('fs');
          function assertRick(path, label) {
            const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
            const r = payload && payload.recognition;
            if (!payload || payload.provider !== 'KEYLESS_SOURCE') throw new Error(`${label}: unexpected provider ${JSON.stringify(payload)}`);
            if (!r || !r.title || !r.artist) throw new Error(`${label}: no keyless recognition ${JSON.stringify(payload)}`);
            const title = String(r.title).toLowerCase();
            const artist = String(r.artist).toLowerCase();
            if (!title.includes('never gonna give you up') || !artist.includes('rick astley')) {
              throw new Error(`${label}: wrong keyless match ${r.artist} — ${r.title}`);
            }
            console.log(`${label} OK: ${r.artist} — ${r.title} (${payload.strategy || 'unknown'})`);
          }
          assertRick('/tmp/keep-keyless-text.json', 'KEYLESS TEXT LIVE');
          assertRick('/tmp/keep-keyless-youtube.json', 'KEYLESS YOUTUBE LIVE');
          NODE
      - name: Build backend
        run: npm --workspace packages/backend run build
      - name: Build Super Admin
        env:
          KEEP_ADMIN_BASE_PATH: /KEEP/admin-preview
          NEXT_PUBLIC_SUPABASE_URL: https://fixture.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-public
        run: npm --workspace packages/admin run build
      - name: Super Admin keys — real browser, isolated fixtures
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/keep-browser-tools" --no-save --package-lock=false playwright@1.55.1
          "$RUNNER_TEMP/keep-browser-tools/node_modules/.bin/playwright" install chromium --with-deps
          mkdir -p "$RUNNER_TEMP/keep-admin-site/KEEP"
          ln -s "$GITHUB_WORKSPACE/packages/admin/out" "$RUNNER_TEMP/keep-admin-site/KEEP/admin-preview"
          python3 -m http.server 3090 --bind 127.0.0.1 --directory "$RUNNER_TEMP/keep-admin-site" >"$RUNNER_TEMP/admin-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3090/KEEP/admin-preview/integrations/ >/dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/keep-browser-tools/node_modules" \
          KEEP_ADMIN_SCREENSHOTS="$RUNNER_TEMP/keep-admin-keys-captures" \
            node scripts/admin-integration-keys-browser.cjs
      - name: Super Admin keys screenshots 390/1440
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-keys-390-1440
          path: ${{ runner.temp }}/keep-admin-keys-captures/*.png
          if-no-files-found: warn
      - name: Export web preview
        env:
          EXPO_PUBLIC_DEMO_MODE: 'true'
          EXPO_PUBLIC_KEEP_PREVIEW: '1'
        working-directory: packages/mobile
        run: npx expo export --platform web --output-dir dist-ci
      - name: Assert web build
        run: test -f packages/mobile/dist-ci/index.html
