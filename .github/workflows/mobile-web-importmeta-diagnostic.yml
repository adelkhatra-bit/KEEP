name: KEEP — Real Browser Web Runtime Audit

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/mobile-web-importmeta-diagnostic.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  real-browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      EXPO_PUBLIC_SUPABASE_URL: https://rrhqsqzcplvmwxizqnla.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru
      EXPO_PUBLIC_DEMO_MODE: 'true'
      EXPO_PUBLIC_KEEP_PREVIEW: '1'
      EXPO_PUBLIC_KEEP_CHAT_VISUAL_TEST: '1'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3010

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install KEEP dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install chromium --with-deps

      - name: Start exact KEEP web runtime
        working-directory: packages/mobile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-web
          node scripts/start-web.cjs --port 8081 --clear > /tmp/keep-real-runtime.log 2>&1 &
          echo $! > /tmp/keep-real-runtime.pid
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8081 >/dev/null; then
              echo "KEEP runtime ready on 8081"
              exit 0
            fi
            sleep 1
          done
          echo "KEEP runtime failed to start"
          cat /tmp/keep-real-runtime.log
          exit 1

      - name: Real Chromium visual/runtime audit
        shell: bash
        run: |
          mkdir -p artifacts/real-browser
          cat > real-browser-audit.cjs <<'JS'
          const { chromium } = require('@playwright/test');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const errors = [];
            const httpFailures = [];

            page.on('pageerror', error => errors.push(`PAGE ERROR: ${error.message}`));
            page.on('console', msg => {
              if (msg.type() === 'error') {
                const loc = msg.location();
                const suffix = loc?.url ? ` @ ${loc.url}:${loc.lineNumber ?? 0}:${loc.columnNumber ?? 0}` : '';
                errors.push(`CONSOLE ERROR: ${msg.text()}${suffix}`);
              }
            });
            page.on('response', response => {
              if (response.status() >= 400) httpFailures.push(`HTTP ${response.status()} ${response.request().method()} ${response.url()}`);
            });
            page.on('requestfailed', request => {
              httpFailures.push(`REQUEST FAILED ${request.method()} ${request.url()} :: ${request.failure()?.errorText || 'unknown'}`);
            });
            page.on('dialog', async dialog => {
              if (dialog.type() === 'confirm') await dialog.accept();
              else await dialog.dismiss();
            });

            async function clickRobust(locator, label) {
              let lastError;
              for (let attempt = 1; attempt <= 6; attempt++) {
                try {
                  await locator.waitFor({ state: 'visible', timeout: 10000 });
                  await locator.scrollIntoViewIfNeeded().catch(() => {});
                  await page.keyboard.press('Escape').catch(() => {});
                  await page.waitForTimeout(120 * attempt);
                  await locator.click({ timeout: 4000 });
                  return;
                } catch (error) {
                  lastError = error;
                  const message = String(error && error.message ? error.message : error || '');
                  if (attempt === 6 && /intercepts pointer events/i.test(message)) {
                    await locator.click({ force: true, timeout: 2000 });
                    return;
                  }
                  await page.waitForTimeout(200 * attempt);
                }
              }
              throw new Error(`${label}: ${lastError && lastError.message ? lastError.message : lastError}`);
            }

            const response = await page.goto('http://127.0.0.1:8081', { waitUntil: 'domcontentloaded', timeout: 60000 });
            if (!response || !response.ok()) throw new Error(`HTTP runtime failed: ${response ? response.status() : 'no response'}`);
            await page.waitForTimeout(1500);

            const bodyText = (await page.locator('body').innerText()).trim();
            const bodyBox = await page.locator('body').boundingBox();
            const rootHtml = await page.locator('#root').innerHTML().catch(() => '');
            await page.screenshot({ path: 'artifacts/real-browser/keep-mobile-runtime.png', fullPage: true });

            if (!bodyText || bodyText.length < 10) throw new Error('Visual audit failed: document.body.innerText is empty or effectively blank');
            if (!rootHtml || rootHtml.trim().length < 20) throw new Error('Visual audit failed: #root is empty or effectively blank');
            if (!bodyBox || bodyBox.width < 200 || bodyBox.height < 200) throw new Error(`Visual audit failed: invalid body dimensions ${JSON.stringify(bodyBox)}`);

            // Le nouveau tchat doit être réellement visible sous forme de languette
            // repliée sur le bord, même dans la preview. Ce repère est stable et
            // indépendant du texte marketing.
            const chatDrawer = page.getByTestId('loki-global-chat-drawer');
            await chatDrawer.waitFor({ state: 'visible', timeout: 15000 });
            const chatDrawerBox = await chatDrawer.boundingBox();
            if (!chatDrawerBox || chatDrawerBox.width < 20 || chatDrawerBox.height < 20) {
              throw new Error(`Chat drawer not visibly rendered: ${JSON.stringify(chatDrawerBox)}`);
            }
            const chatVisibleWidth = Math.max(0, Math.min(390, chatDrawerBox.x + chatDrawerBox.width) - Math.max(0, chatDrawerBox.x));
            const chatVisibleHeight = Math.max(0, Math.min(844, chatDrawerBox.y + chatDrawerBox.height) - Math.max(0, chatDrawerBox.y));
            if (chatVisibleWidth < 24 || chatVisibleHeight < 40) {
              throw new Error(`Chat drawer exists but is effectively outside viewport: ${JSON.stringify({ chatDrawerBox, chatVisibleWidth, chatVisibleHeight })}`);
            }

            // Preuve visuelle réelle du design validé : ouvrir le même composant
            // plein écran que la production, sans backend actif dans ce fixture.
            await clickRobust(chatDrawer, 'Open full-screen messenger');
            const fullChat = page.getByTestId('loki-chat-fullscreen-modal');
            await fullChat.waitFor({ state: 'visible', timeout: 10000 });
            const fullChatBox = await fullChat.boundingBox();
            if (!fullChatBox || fullChatBox.width < 380 || fullChatBox.height < 820 || fullChatBox.x > 1 || fullChatBox.y > 1) {
              throw new Error(`Full-screen chat does not cover the mobile viewport from origin: ${JSON.stringify(fullChatBox)}`);
            }
            await page.getByPlaceholder('Rechercher une conversation…').waitFor({ state: 'visible', timeout: 10000 });
            await page.screenshot({ path: 'artifacts/real-browser/keep-chat-fullscreen-390x844.png', fullPage: true });

            // Vérifie aussi le comportement visuel réel du fil : à l'ouverture
            // d'une conversation, on doit voir le message le plus récent, jamais
            // atterrir au milieu de l'historique.
            await clickRobust(page.getByText('La Place', { exact: true }).last(), 'Open public chat composer');
            const threadScroll = page.getByTestId('loki-chat-thread-scroll').last();
            await threadScroll.waitFor({ state: 'visible', timeout: 10000 });
            await page.waitForTimeout(900);
            const openedScroll = await threadScroll.evaluate(el => ({
              scrollTop: el.scrollTop,
              scrollHeight: el.scrollHeight,
              clientHeight: el.clientHeight,
              distance: el.scrollHeight - el.clientHeight - el.scrollTop,
            }));
            if (openedScroll.distance > 12) {
              throw new Error(`Chat opened away from latest message: ${JSON.stringify(openedScroll)}`);
            }

            // Pendant la saisie, le clavier/compositeur peut changer de hauteur.
            // Le fil doit suivre visuellement le bas sans swipe manuel.
            const composerInput = page.getByPlaceholder('Écris un message…').last();
            await composerInput.waitFor({ state: 'visible', timeout: 10000 });
            await composerInput.fill('Test visuel du suivi du chat sur plusieurs mots pour faire grandir le compositeur et vérifier que le dernier message reste visible.');
            await page.waitForTimeout(700);
            const typedScroll = await threadScroll.evaluate(el => ({
              scrollTop: el.scrollTop,
              scrollHeight: el.scrollHeight,
              clientHeight: el.clientHeight,
              distance: el.scrollHeight - el.clientHeight - el.scrollTop,
            }));
            if (typedScroll.distance > 12) {
              throw new Error(`Chat stopped following bottom while typing: ${JSON.stringify(typedScroll)}`);
            }
            await page.screenshot({ path: 'artifacts/real-browser/keep-chat-latest-message-follow-390x844.png', fullPage: true });
            await composerInput.fill('');

            await page.getByLabel('Ouvrir les actions du message').waitFor({ state: 'visible', timeout: 10000 });
            await clickRobust(page.getByLabel('Ouvrir les actions du message').last(), 'Open composer actions');
            await page.getByText('RÉACTIONS', { exact: true }).last().waitFor({ state: 'visible', timeout: 10000 });
            await page.getByText('MORCEAU', { exact: true }).last().waitFor({ state: 'visible', timeout: 10000 });
            await page.getByText('QR PAYPAL', { exact: true }).last().waitFor({ state: 'visible', timeout: 10000 });
            await page.screenshot({ path: 'artifacts/real-browser/keep-chat-actions-390x844.png', fullPage: true });
            await clickRobust(page.getByLabel('Fermer la messagerie').last(), 'Close full-screen messenger');
            await fullChat.waitFor({ state: 'hidden', timeout: 10000 });

            // Samsung/Chrome Android : un swipe vertical ne doit jamais faire sortir
            // la barre des 5 onglets du viewport visible.
            const bottomProfileTab = page.getByText('Profil', { exact: true }).last();
            if (await bottomProfileTab.count() === 0) throw new Error('Profile bottom tab not found');
            const bottomBefore = await bottomProfileTab.boundingBox();
            await page.mouse.wheel(0, 1400);
            await page.waitForTimeout(300);
            const bottomAfter = await bottomProfileTab.boundingBox();
            if (!bottomBefore || !bottomAfter) throw new Error('Bottom tab lost during vertical swipe');
            if (bottomAfter.y < 0 || bottomAfter.y + bottomAfter.height > 844) {
              throw new Error(`Samsung bottom navigation left viewport after swipe: ${JSON.stringify(bottomAfter)}`);
            }
            if (Math.abs(bottomAfter.y - bottomBefore.y) > 4) {
              throw new Error(`Samsung bottom navigation moved with page scroll: ${bottomBefore.y} -> ${bottomAfter.y}`);
            }

            await clickRobust(bottomProfileTab, 'Profile bottom tab');
            await page.waitForTimeout(700);

            // La cloche doit rester inline : ouverture du panneau latéral, onglets
            // séparés Messages / Activité / Réglages, sans quitter le profil.
            const profileBell = page.getByLabel(/^Notifications(?:, .* non lues)?$/).last();
            await profileBell.waitFor({ state: 'visible', timeout: 15000 });
            const profileUrlBeforeBell = page.url();
            await clickRobust(profileBell, 'Profile notification bell');
            await page.getByText('MESSAGES', { exact: true }).last().waitFor({ state: 'visible', timeout: 15000 });
            await page.getByText('ACTIVITÉ', { exact: true }).last().waitFor({ state: 'visible', timeout: 15000 });
            await page.getByText('RÉGLAGES', { exact: true }).last().waitFor({ state: 'visible', timeout: 15000 });
            if (page.url() !== profileUrlBeforeBell) throw new Error('Bell navigation changed URL instead of staying inline');
            await page.screenshot({ path: 'artifacts/real-browser/keep-chat-bell-390x844.png', fullPage: true });
            // Ferme par le backdrop visible à gauche du tiroir. Le bouton ×
            // existe bien dans le produit, mais React Native Web ne l'expose pas
            // toujours comme locator accessible stable dans Chromium headless.
            await page.mouse.click(8, 120);
            await page.getByText('MESSAGES', { exact: true }).last().waitFor({ state: 'hidden', timeout: 10000 });

            // Cible les vrais onglets ACTUELS du profil propriétaire. La refonte
            // v3 a volontairement supprimé Albums et renommé KEEP en Musiques :
            // le test doit suivre le contrat produit réel, pas un ancien layout.
            const musicTab = page.getByLabel('Profil Styles');
            const vibesTab = page.getByLabel('Profil Playlists');
            const artistsTab = page.getByLabel('Profil Artistes');
            if (await musicTab.count() === 0 || await vibesTab.count() === 0 || await artistsTab.count() === 0) throw new Error('Profile music tabs not found');

            const vibesBefore = await vibesTab.innerHTML();
            await clickRobust(vibesTab, 'Profile Playlists tab');
            await page.waitForTimeout(250);
            const vibesAfter = await vibesTab.innerHTML();
            if (vibesAfter === vibesBefore) throw new Error('Playlists tab did not visibly change state after click');

            const artistsBefore = await artistsTab.innerHTML();
            await clickRobust(artistsTab, 'Profile Artists tab');
            await page.waitForTimeout(250);
            const artistsAfter = await artistsTab.innerHTML();
            if (artistsAfter === artistsBefore) throw new Error('Artists tab did not visibly change state after click');

            const musicBefore = await musicTab.innerHTML();
            await clickRobust(musicTab, 'Profile Styles tab');
            await page.waitForTimeout(250);
            const musicAfter = await musicTab.innerHTML();
            if (musicAfter === musicBefore) throw new Error('Styles tab did not remount immediately; browser refresh would still be required');

            await page.screenshot({ path: 'artifacts/real-browser/keep-profile-tabs-390x844.png', fullPage: true });

            // Ce workflow vérifie le runtime global et la navigation Playlists.
            // La boucle destructive Écouter -> Garder -> Supprimer -> Profil -> reload
            // est couverte séparément par delete-track-e2e.yml avec son propre fixture,
            // afin que ce smoke runtime ne dépende jamais d'un morceau préexistant.
            const playlistsBottomTab = page.getByText('Playlists', { exact: true }).last();
            if (await playlistsBottomTab.count() === 0) throw new Error('Playlists bottom tab not found');
            await clickRobust(playlistsBottomTab, 'Playlists bottom tab');
            await page.waitForTimeout(500);
            const myTracksEntry = page.getByText(/^Écouter mes morceaux · \d+$/).last();
            if (await myTracksEntry.count() === 0) throw new Error('Écouter mes morceaux entry not found');
            await clickRobust(myTracksEntry, 'Écouter mes morceaux entry');
            await page.waitForTimeout(300);
            await page.getByText('Mes morceaux', { exact: true }).last().waitFor({ state: 'visible', timeout: 10000 });
            await page.screenshot({ path: 'artifacts/real-browser/keep-playlists-390x844.png', fullPage: true });

            const report = [
              `URL: ${page.url()}`,
              `TITLE: ${await page.title()}`,
              `BODY_LENGTH: ${bodyText.length}`,
              `ROOT_HTML_LENGTH: ${rootHtml.length}`,
              `BODY_BOX: ${JSON.stringify(bodyBox)}`,
              'CHAT_DRAWER_VISIBLE: PASS',
              'CHAT_FULLSCREEN_390x844: PASS',
              'CHAT_OPENS_ON_LATEST_MESSAGE: PASS',
              'CHAT_FOLLOWS_BOTTOM_WHILE_TYPING: PASS',
              'BELL_INLINE_TABS_VISIBLE: PASS',
              'SAMSUNG_BOTTOM_NAV_STABLE_AFTER_SWIPE: PASS',
              'PROFILE_TAB_SWITCH_NO_REFRESH: PASS',
              'PLAYLISTS_TAB_RUNTIME: PASS',
              'DELETE_E2E: delegated to KEEP — Suppression morceau E2E 390x844',
              `ERROR_COUNT: ${errors.length}`,
              `HTTP_FAILURE_COUNT: ${httpFailures.length}`,
              '',
              'VISIBLE_TEXT:',
              bodyText.slice(0, 12000),
              '',
              'HTTP FAILURES:',
              ...httpFailures,
              '',
              'ERRORS:',
              ...errors,
            ].join('\n');
            fs.writeFileSync('artifacts/real-browser/report.txt', report);

            if (errors.length > 0 || httpFailures.length > 0) throw new Error(`Browser runtime issues detected:\n${[...httpFailures, ...errors].join('\n')}`);

            const desktopPage = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            const desktopResponse = await desktopPage.goto('http://127.0.0.1:8081', { waitUntil: 'domcontentloaded', timeout: 60000 });
            if (!desktopResponse || !desktopResponse.ok()) throw new Error(`Desktop runtime failed: ${desktopResponse ? desktopResponse.status() : 'no response'}`);
            const manualUpdate = desktopPage.getByTestId('keep-manual-update-control');
            if (await manualUpdate.count() !== 0) throw new Error('Manual update control must never be user-visible');
            if (await desktopPage.getByText('Actualiser Loki Music', { exact: true }).count() !== 0) throw new Error('Actualiser Loki Music must never be user-visible');
            if (await desktopPage.getByText('METTRE À JOUR', { exact: true }).count() !== 0) throw new Error('METTRE À JOUR must never be user-visible');
            if (await desktopPage.getByText(/Nouvelle version de Loki Music disponible/i).count() !== 0) throw new Error('Version update banner must never be user-visible');
            await desktopPage.screenshot({ path: 'artifacts/real-browser/keep-desktop-silent-update-1440x900.png', fullPage: true });
            fs.appendFileSync('artifacts/real-browser/report.txt', '\nSILENT_UPDATE_UI_ABSENT: PASS\n');
            await desktopPage.close();

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          JS
          node real-browser-audit.cjs

      - name: Show runtime log on failure
        if: failure()
        run: cat /tmp/keep-real-runtime.log || true

      - name: Upload real browser screenshot and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KEEP-Real-Browser-${{ github.sha }}
          path: artifacts/real-browser
          retention-days: 14
          if-no-files-found: warn