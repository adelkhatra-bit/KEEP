name: Loki App Store Subscription Audit

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - '.github/workflows/app-store-subscription-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit subscription metadata
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          node <<'NODE'
          const crypto=require('node:crypto');
          const key=Buffer.from(process.env.ASC_API_KEY_P8_BASE64.trim(),'base64');
          const enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
          const now=Math.floor(Date.now()/1000);
          const unsigned=enc({alg:'ES256',kid:process.env.ASC_KEY_ID.trim(),typ:'JWT'})+'.'+
            enc({iss:process.env.ASC_ISSUER_ID.trim(),iat:now-30,exp:now+600,aud:'appstoreconnect-v1'});
          const token=unsigned+'.'+crypto.sign('sha256',Buffer.from(unsigned),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');

          async function req(p){
            const res=await fetch('https://api.appstoreconnect.apple.com'+p,{headers:{Authorization:'Bearer '+token}});
            const txt=await res.text();
            if(!res.ok) return {http:res.status,error:txt.slice(0,700)};
            return txt?JSON.parse(txt):null;
          }
          function slimError(x){return x?.error?{http:x.http,error:x.error}:x}

          (async()=>{
            const appId=process.env.ASC_APP_ID.trim();
            const groups=await req('/v1/apps/'+appId+'/subscriptionGroups?include=subscriptions&limit=200&limit[subscriptions]=50');
            if(groups?.error) throw new Error(JSON.stringify(groups));
            const subscriptions=(groups.included||[]).filter(x=>x.type==='subscriptions');
            const report={
              groups:(groups.data||[]).map(g=>({id:g.id,attributes:g.attributes})),
              subscriptions:[]
            };

            for(const sub of subscriptions){
              const id=sub.id;
              const loc=await req('/v1/subscriptions/'+id+'/subscriptionLocalizations?limit=50');
              const prices=await req('/v1/subscriptions/'+id+'/prices?include=subscriptionPricePoint,territory&limit=200');
              const availability=await req('/v1/subscriptions/'+id+'/subscriptionAvailability');
              const screenshot=await req('/v1/subscriptions/'+id+'/appStoreReviewScreenshot');
              const intro=await req('/v1/subscriptions/'+id+'/introductoryOffers?limit=50');
              report.subscriptions.push({
                id,
                productId:sub.attributes?.productId,
                state:sub.attributes?.state,
                attributes:sub.attributes,
                localizations:slimError(loc),
                prices:slimError(prices),
                availability:slimError(availability),
                appStoreReviewScreenshot:slimError(screenshot),
                introductoryOffers:slimError(intro)
              });
            }

            for(const g of (groups.data||[])){
              g.localizations=slimError(await req('/v1/subscriptionGroups/'+g.id+'/subscriptionGroupLocalizations?limit=50'));
            }
            console.log('=== SUBSCRIPTION AUDIT ===');
            console.log(JSON.stringify(report,null,2));
            console.log('=== END SUBSCRIPTION AUDIT ===');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
