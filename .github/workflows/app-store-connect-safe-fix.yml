name: Loki App Store Safe Fix

on:
  workflow_dispatch:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - '.github/workflows/app-store-connect-safe-fix.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fix safe App Store metadata
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const required = ['ASC_API_KEY_P8_BASE64','ASC_KEY_ID','ASC_ISSUER_ID','ASC_APP_ID'];
          const missing = required.filter(k => !process.env[k]?.trim());
          if (missing.length) throw new Error('Missing secrets: ' + missing.join(', '));

          const key = Buffer.from(process.env.ASC_API_KEY_P8_BASE64.trim(), 'base64');
          const enc = x => Buffer.from(JSON.stringify(x)).toString('base64url');
          const now = Math.floor(Date.now()/1000);
          const unsigned = enc({alg:'ES256',kid:process.env.ASC_KEY_ID.trim(),typ:'JWT'}) + '.' +
            enc({iss:process.env.ASC_ISSUER_ID.trim(),iat:now-30,exp:now+600,aud:'appstoreconnect-v1'});
          const token = unsigned + '.' + crypto.sign('sha256', Buffer.from(unsigned), {
            key, dsaEncoding:'ieee-p1363'
          }).toString('base64url');

          async function api(path, {method='GET', body, allow404=false}={}) {
            const res = await fetch('https://api.appstoreconnect.apple.com' + path, {
              method,
              headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body: body ? JSON.stringify(body) : undefined
            });
            if (allow404 && res.status === 404) return null;
            const text = await res.text();
            if (!res.ok) throw new Error(method + ' ' + path + ' HTTP ' + res.status + ' ' + text.slice(0,1000));
            return text ? JSON.parse(text) : null;
          }

          (async()=>{
            const appId = process.env.ASC_APP_ID.trim();
            const versions = await api('/v1/apps/' + appId +
              '/appStoreVersions?filter[platform]=IOS&fields[appStoreVersions]=versionString,appStoreState,createdDate&limit=50');
            const version = (versions.data || []).find(v => v.attributes?.appStoreState === 'PREPARE_FOR_SUBMISSION') ||
              (versions.data || [])[0];
            if (!version) throw new Error('No iOS App Store version found');

            const result = { versionId: version.id, versionString: version.attributes?.versionString };

            const gc = await api('/v1/appStoreVersions/' + version.id +
              '/gameCenterAppVersion?fields[gameCenterAppVersions]=enabled', {allow404:true});
            if (gc?.data?.attributes?.enabled === true) {
              await api('/v1/gameCenterAppVersions/' + gc.data.id, {
                method:'PATCH',
                body:{data:{type:'gameCenterAppVersions',id:gc.data.id,attributes:{enabled:false}}}
              });
              result.gameCenter = 'DISABLED';
            } else {
              result.gameCenter = gc?.data ? 'ALREADY_DISABLED' : 'NOT_CONFIGURED';
            }

            const app = await api('/v1/apps/' + appId + '?fields[apps]=name,bundleId,contentRightsDeclaration');
            if (!app.data.attributes?.contentRightsDeclaration) {
              await api('/v1/apps/' + appId, {
                method:'PATCH',
                body:{data:{type:'apps',id:appId,attributes:{contentRightsDeclaration:'USES_THIRD_PARTY_CONTENT'}}}
              });
              result.contentRightsDeclaration = 'USES_THIRD_PARTY_CONTENT_SET';
            } else {
              result.contentRightsDeclaration = app.data.attributes.contentRightsDeclaration;
            }

            const freePoints = await api('/v1/apps/' + appId + '/appPricePoints?filter[territory]=FRA&fields[appPricePoints]=customerPrice,proceeds,territory&include=territory&fields[territories]=currency&limit=200');
            result.freePricePoint = (freePoints.data || []).filter(p => Number(p.attributes?.customerPrice) === 0).map(p => ({id:p.id,customerPrice:p.attributes?.customerPrice,proceeds:p.attributes?.proceeds}))[0] || null;

            const price = await api('/v1/apps/' + appId +
              '/appPriceSchedule?include=baseTerritory,manualPrices&fields[appPriceSchedules]=baseTerritory,manualPrices&fields[appPrices]=manual,startDate,endDate,appPricePoint,territory&fields[territories]=currency&limit[manualPrices]=50',
              {allow404:true});
            result.price = { scheduleExists: !!price?.data };
            if (!price?.data && result.freePricePoint?.id) {
              const localPriceId = '
              const baseRel = price.data.relationships?.baseTerritory?.data;
              const manualRel = price.data.relationships?.manualPrices?.data || [];
              result.price.baseTerritoryConfigured = !!baseRel;
              result.price.baseTerritoryId = baseRel?.id || null;
              result.price.manualPriceCount = manualRel.length;
              result.price.included = (price.included || []).map(x => ({
                type:x.type,id:x.id,
                currency:x.attributes?.currency || null,
                manual:x.attributes?.manual ?? null,
                startDate:x.attributes?.startDate || null,
                endDate:x.attributes?.endDate || null
              }));
            }

            await new Promise(r => setTimeout(r, 2500));
            const verifyGc = await api('/v1/appStoreVersions/' + version.id +
              '/gameCenterAppVersion?fields[gameCenterAppVersions]=enabled', {allow404:true});
            const verifyApp = await api('/v1/apps/' + appId + '?fields[apps]=contentRightsDeclaration');
            result.verified = {
              gameCenterEnabled: verifyGc?.data?.attributes?.enabled ?? null,
              contentRightsDeclaration: verifyApp.data.attributes?.contentRightsDeclaration || null
            };

            console.log('=== LOKI SAFE FIX RESULT ===');
            console.log(JSON.stringify(result,null,2));
            console.log('=== END LOKI SAFE FIX RESULT ===');
          })().catch(e=>{console.error(e.stack || e.message || String(e));process.exit(1);});
          NODE
 + '{free-price-fr}';
              const created = await api('/v1/appPriceSchedules', {
                method:'POST',
                body:{
                  data:{
                    type:'appPriceSchedules',
                    relationships:{
                      app:{data:{type:'apps',id:appId}},
                      baseTerritory:{data:{type:'territories',id:'FRA'}},
                      manualPrices:{data:[{type:'appPrices',id:localPriceId}]}
                    }
                  },
                  included:[{
                    type:'appPrices',
                    id:localPriceId,
                    attributes:{startDate:null},
                    relationships:{appPricePoint:{data:{type:'appPricePoints',id:result.freePricePoint.id}}}
                  }]
                }
              });
              result.price = { scheduleExists:true, created:true, scheduleId:created?.data?.id || null, baseTerritory:'FRA', customerPrice:'0.0' };
            } else if (price?.data) {
              const baseRel = price.data.relationships?.baseTerritory?.data;
              const manualRel = price.data.relationships?.manualPrices?.data || [];
              result.price.baseTerritoryConfigured = !!baseRel;
              result.price.baseTerritoryId = baseRel?.id || null;
              result.price.manualPriceCount = manualRel.length;
              result.price.included = (price.included || []).map(x => ({
                type:x.type,id:x.id,
                currency:x.attributes?.currency || null,
                manual:x.attributes?.manual ?? null,
                startDate:x.attributes?.startDate || null,
                endDate:x.attributes?.endDate || null
              }));
            }

            await new Promise(r => setTimeout(r, 2500));
            const verifyGc = await api('/v1/appStoreVersions/' + version.id +
              '/gameCenterAppVersion?fields[gameCenterAppVersions]=enabled', {allow404:true});
            const verifyApp = await api('/v1/apps/' + appId + '?fields[apps]=contentRightsDeclaration');
            result.verified = {
              gameCenterEnabled: verifyGc?.data?.attributes?.enabled ?? null,
              contentRightsDeclaration: verifyApp.data.attributes?.contentRightsDeclaration || null
            };

            console.log('=== LOKI SAFE FIX RESULT ===');
            console.log(JSON.stringify(result,null,2));
            console.log('=== END LOKI SAFE FIX RESULT ===');
          })().catch(e=>{console.error(e.stack || e.message || String(e));process.exit(1);});
          NODE
