name: KEEP — Deploy keep-ai-relay (SHA auto-injecté)

# Adel (20/09/2026) : "arrête de le mettre en dur, injecte-le automatiquement
# au déploiement et renvoie la valeur" -- plus de SHA tapé à la main dans
# supabase/functions/keep-ai-relay/index.ts (DEPLOY_SHA lit maintenant
# Deno.env.get("GIT_SHA")). Ce workflow pose ce secret projet Supabase à
# chaque déploiement CI, avec le vrai SHA du commit qui a déclenché le run.
#
# Nécessite le secret GitHub SUPABASE_ACCESS_TOKEN (jeton d'accès personnel
# Supabase, https://supabase.com/dashboard/account/tokens) -- à créer par
# Adel dans GitHub → Settings → Secrets and variables → Actions. Aucune IA
# ne doit créer ou saisir ce jeton.

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'supabase/functions/keep-ai-relay/**'
      - '.github/workflows/deploy-keep-ai-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: rrhqsqzcplvmwxizqnla

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔑 Injecte GIT_SHA (secret projet Supabase, pas un secret Git)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN manquant -- ajoute-le dans GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes supabase@latest secrets set "GIT_SHA=${GITHUB_SHA::7}" --project-ref "$SUPABASE_PROJECT_REF"

      - name: 🚀 Déploie keep-ai-relay
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --yes supabase@latest functions deploy keep-ai-relay --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: ✅ Vérifie le ping renvoie bien ce SHA
        run: |
          sleep 5
          RESPONSE=$(curl -s "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/keep-ai-relay?op=ping")
          echo "Réponse: $RESPONSE"
          echo "$RESPONSE" | grep -q "${GITHUB_SHA::7}" || { echo "::error::Le ping ne renvoie pas le SHA attendu (${GITHUB_SHA::7})"; exit 1; }
