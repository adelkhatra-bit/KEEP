name: KEEP Battle accept + credit + mobile size

on:
  push:
    paths:
      - 'scripts/patch_keep_battle_accept_credit_and_mobile_size.py'
      - '.github/workflows/keep-battle-accept-credit-mobile-size-once.yml'
      - 'supabase/migrations/20260829151000_keep_battle_credit_gate_and_between_match_join.sql'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Sync branch
        run: git pull --rebase origin reconcile/claude-main-20260825
      - name: Apply accept + mobile size repair
        run: python scripts/patch_keep_battle_accept_credit_and_mobile_size.py
      - name: Install dependencies
        run: npm ci
      - name: Verify Battle mobile
        run: |
          npx tsc -p packages/mobile/tsconfig.json --noEmit
          npm test --workspace=packages/mobile -- --runInBand KeepBattleMobileGameV3.compact.test.ts
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'KEEP Guardian'
          git config user.email 'actions@github.com'
          git add packages/mobile/src/components/KeepBattleMobileGameV3.tsx packages/mobile/src/components/__tests__/KeepBattleMobileGameV3.compact.test.ts
          git commit -m 'fix(battle): gate credit failures and enlarge invite actions'
          git push origin HEAD:reconcile/claude-main-20260825
