name: KEEP — One-shot restore social source

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - '.github/workflows/one-shot-restore-social-source.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch only missing social-source UI and stale smoke assertions
        shell: python
        run: |
          from pathlib import Path

          music = Path('packages/mobile/src/screens/MyMusicScreen.tsx')
          s = music.read_text(encoding='utf-8')

          old = "import { musicEngine } from '../services/musicEngine';\n"
          new = old + "import { supabase } from '../services/supabaseClient';\n"
          if "../services/supabaseClient" not in s:
              if old not in s: raise SystemExit('musicEngine import anchor missing')
              s = s.replace(old, new, 1)

          anchor = """  const renderTrack = (track: CanonicalTrack) => {\n"""
          helper = """  const openSourceProfile = (sourceUsername?: string) => {\n    const clean = sourceUsername?.trim().replace(/^@+/, '');\n    if (!clean) return;\n    navigation.navigate('PublicProfile', { username: clean });\n  };\n\n  const followSource = async (sourceProfileId?: string, sourceUsername?: string) => {\n    const clean = sourceUsername?.trim().replace(/^@+/, '');\n    if (!sourceProfileId || !clean) return openSourceProfile(sourceUsername);\n    if (!user || isLocalGuest || isDemoMode || !supabase) {\n      Alert.alert('Compte KEEP requis', `Crée ton compte KEEP pour suivre @${clean}.`, [\n        { text: 'Plus tard', style: 'cancel' },\n        { text: 'Voir son profil', onPress: () => openSourceProfile(clean) },\n      ]);\n      return;\n    }\n    if (sourceProfileId === user.id) return;\n    const { error } = await supabase.from('follows').upsert(\n      { follower_id: user.id, followee_id: sourceProfileId },\n      { onConflict: 'follower_id,followee_id', ignoreDuplicates: true },\n    );\n    if (error) Alert.alert('Suivre', 'Impossible de suivre ce profil pour le moment.');\n    else Alert.alert('Suivre', `Tu suis maintenant @${clean}.`);\n  };\n\n"""
          if 'const followSource = async' not in s:
              if anchor not in s: raise SystemExit('renderTrack anchor missing')
              s = s.replace(anchor, helper + anchor, 1)

          old_render = """      <View style={styles.trackInfo}>\n        <Text style={styles.trackTitle} numberOfLines={1}>{track.title}</Text>\n        <Text style={styles.trackArtist} numberOfLines={1}>{track.artist}{track.album ? ` · ${track.album}` : ''}</Text>\n      </View>\n"""
          new_render = """      <View style={styles.trackInfo}>\n        <Text style={styles.trackTitle} numberOfLines={1}>{track.title}</Text>\n        <Text style={styles.trackArtist} numberOfLines={1}>{track.artist}{track.album ? ` · ${track.album}` : ''}</Text>\n        {localEntry?.sourceUsername ? <View style={styles.trackSourceRow}>\n          <Text style={styles.trackSourceLabel}>Donné par</Text>\n          <TouchableOpacity onPress={() => openSourceProfile(localEntry.sourceUsername)} accessibilityRole=\"link\" accessibilityLabel={`Ouvrir le profil de @${localEntry.sourceUsername}`}>\n            <Text style={styles.trackSourceLink}>@{localEntry.sourceUsername.replace(/^@+/, '')}</Text>\n          </TouchableOpacity>\n          {localEntry.sourceProfileId && localEntry.sourceProfileId !== user?.id ? <TouchableOpacity style={styles.trackSourceFollow} onPress={() => void followSource(localEntry.sourceProfileId, localEntry.sourceUsername)} accessibilityRole=\"button\" accessibilityLabel={`Suivre @${localEntry.sourceUsername}`}>\n            <Text style={styles.trackSourceFollowText}>+ Suivre</Text>\n          </TouchableOpacity> : null}\n        </View> : null}\n      </View>\n"""
          if 'styles.trackSourceRow' not in s:
              if old_render not in s: raise SystemExit('trackInfo render anchor missing')
              s = s.replace(old_render, new_render, 1)

          old_style = "trackInfo:{flex:1},trackTitle:{color:colors.textPrimary,fontSize:11,fontWeight:'800'},trackArtist:{color:colors.textSecondary,fontSize:9,marginTop:2},visibilityDot:"
          new_style = "trackInfo:{flex:1},trackTitle:{color:colors.textPrimary,fontSize:11,fontWeight:'800'},trackArtist:{color:colors.textSecondary,fontSize:9,marginTop:2},trackSourceRow:{flexDirection:'row',alignItems:'center',gap:4,marginTop:3,flexWrap:'wrap'},trackSourceLabel:{color:colors.textMuted,fontSize:8,fontWeight:'700'},trackSourceLink:{color:colors.primaryLight,fontSize:8,fontWeight:'900',textDecorationLine:'underline'},trackSourceFollow:{minHeight:20,paddingHorizontal:7,borderRadius:10,borderWidth:1,borderColor:colors.primary,alignItems:'center',justifyContent:'center'},trackSourceFollowText:{color:colors.primaryLight,fontSize:7,fontWeight:'900'},visibilityDot:"
          if 'trackSourceRow:{' not in s:
              if old_style not in s: raise SystemExit('track styles anchor missing')
              s = s.replace(old_style, new_style, 1)

          music.write_text(s, encoding='utf-8')

          smoke = Path('scripts/keep-public-trial-smoke.cjs')
          t = smoke.read_text(encoding='utf-8')
          old_asserts = """  await page.getByText('Utilisateur · Free', { exact: true }).last().waitFor({ state: 'visible', timeout: 20000 });\n  await page.getByText('🔒 Creator Pro', { exact: true }).last().waitFor({ state: 'visible', timeout: 20000 });\n  await page.getByText('🔒 Venue Pro', { exact: true }).last().waitFor({ state: 'visible', timeout: 20000 });\n  await page.getByText('🔒 Creator Pro', { exact: true }).last().click();\n"""
          new_asserts = """  await page.getByText('Type de profil', { exact: true }).last().waitFor({ state: 'visible', timeout: 20000 });\n  await page.getByText('Utilisateur', { exact: true }).last().waitFor({ state: 'visible', timeout: 20000 });\n  await page.getByText('KEEP PREMIUM', { exact: true }).last().waitFor({ state: 'visible', timeout: 20000 });\n  await page.getByText('2,99 € / mois', { exact: true }).last().waitFor({ state: 'visible', timeout: 20000 });\n  await page.getByText('KEEP CREATOR PRO', { exact: true }).last().waitFor({ state: 'visible', timeout: 20000 });\n  await page.getByText('9,99 € / mois', { exact: true }).last().waitFor({ state: 'visible', timeout: 20000 });\n  await page.getByText('KEEP VENUE PRO', { exact: true }).last().waitFor({ state: 'visible', timeout: 20000 });\n  await page.getByText('29,99 € / mois', { exact: true }).last().waitFor({ state: 'visible', timeout: 20000 });\n  await page.getByText('KEEP CREATOR PRO', { exact: true }).last().click();\n"""
          if old_asserts in t:
              t = t.replace(old_asserts, new_asserts, 1)
          smoke.write_text(t, encoding='utf-8')

          assert 'Donné par' in s and '+ Suivre' in s and "navigation.navigate('PublicProfile'" in s
          assert "Utilisateur · Free" not in t

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check

      - name: Commit targeted fix
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'adelkhatra-bit/KEEP'
          git config user.name 'KEEP CI'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/mobile/src/screens/MyMusicScreen.tsx scripts/keep-public-trial-smoke.cjs
          git diff --cached --check
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'fix(music): restore clickable source attribution'
          git push origin HEAD:reconcile/claude-main-20260825
