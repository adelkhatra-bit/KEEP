name: KEEP targeted isolation and social fixes

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths: ['.github/workflows/keep-targeted-fixes.yml']

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - name: Apply targeted fixes only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected snippet not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Account isolation: only a real guest upgrade may carry local KEEP into a new account.
          path = 'packages/mobile/src/components/UsernameAccountForm.tsx'
          replace_one(path,
              "  if (code === 'invalid_password') return 'Le mot de passe doit contenir au moins 8 caractères.';",
              "  if (code === 'invalid_password') return 'Le mot de passe doit contenir au moins 6 caractères.';")
          replace_one(path,
              "  const isLocalGuest = useUserStore((s) => s.isLocalGuest);",
              "  const isLocalGuest = useUserStore((s) => s.isLocalGuest);\n  const isDemoMode = useUserStore((s) => s.isDemoMode);")
          replace_one(path,
              "  const finishAuthenticatedFlow = async () => {\n    await importStagedGuestCreditsForAuthenticatedAccount().catch(() => null);\n    await useSessionHistoryStore.getState().syncUnsyncedKeeps().catch(() => {});\n    await useSessionHistoryStore.getState().refreshCreditLocks().catch(() => {});",
              "  const finishAuthenticatedFlow = async () => {\n    await importStagedGuestCreditsForAuthenticatedAccount().catch(() => null);\n    // Une bibliothèque locale n'est transférée que lors de la transformation\n    // explicite d'un invité en NOUVEAU compte. Une connexion à un compte existant\n    // ou une création depuis la démo repart de la bibliothèque serveur du compte.\n    const carryGuestKeeps = mode === 'create' && isLocalGuest && !isDemoMode;\n    if (!carryGuestKeeps) useSessionHistoryStore.getState().clearSessions();\n    await useSessionHistoryStore.getState().syncUnsyncedKeeps().catch(() => {});\n    await useSessionHistoryStore.getState().refreshCreditLocks().catch(() => {});")
          replace_one(path,
              "    if (password.length < 8) return setError(errorText('invalid_password'));",
              "    if (password.length < 6) return setError(errorText('invalid_password'));")
          replace_one(path,
              "        placeholder=\"Mot de passe — 8 caractères minimum\"",
              "        placeholder=\"Mot de passe\"")
          replace_one(path,
              "    <Text style={s.passwordRule}>8 caractères minimum. Utilise l’œil pour vérifier ta saisie.</Text>",
              "    <Text style={s.passwordRule}>Minimum technique : 6 caractères. KEEP n’impose aucune règle supplémentaire. Utilise l’œil pour vérifier ta saisie.</Text>")

          # 2) Server-side username password floor follows Supabase's technical minimum, not an app-specific 8/30 rule.
          replace_one('supabase/functions/keep-username-auth/index.ts',
              'const validPassword = (value: string) => value.length >= 8 && value.length <= 128;',
              'const validPassword = (value: string) => value.length >= 6 && value.length <= 128;')

          # 3) A KEEP copied from another profile is always social/free and never consumes listening credit.
          path = 'packages/mobile/src/services/keepTrackAction.ts'
          replace_one(path,
              "  const userState = useUserStore.getState();\n  // Le mode démo est illimité. Les appels normaux consomment un crédit, sauf\n  // lorsqu'un flux produit explicite `consumeCredit:false` (profil -> profil).\n  const consumesCredit = !userState.isDemoMode && options?.consumeCredit !== false;",
              "  const userState = useUserStore.getState();\n  const sourceProfileId = typeof options?.context?.sourceProfileId === 'string' ? options.context.sourceProfileId.trim() : '';\n  const isSocialCopy = Boolean(sourceProfileId && sourceProfileId !== userState.user?.id);\n  // Une reprise depuis le profil d'un autre membre est un cadeau communautaire :\n  // elle est tracée mais ne touche jamais au quota FREE de reconnaissance/KEEP.\n  const consumesCredit = !userState.isDemoMode && !isSocialCopy && options?.consumeCredit !== false;")

          # 4) Persist and restore social attribution on each KEEP row.
          path = 'packages/mobile/src/services/keepMusicCoreRecognition.ts'
          replace_one(path,
              "export interface PersistedKeepDecision {\n  decisionId: string;\n  visibility: KeepVisibility;\n  createdAt: string;\n  detectedAt: string;\n  sessionId?: string;\n  track: CanonicalTrack;\n}",
              "export interface PersistedKeepDecision {\n  decisionId: string;\n  visibility: KeepVisibility;\n  createdAt: string;\n  detectedAt: string;\n  sessionId?: string;\n  sourceProfileId?: string;\n  sourceUsername?: string;\n  creditPolicy: 'LISTEN_KEEP' | 'SOCIAL_ZERO_CREDIT';\n  track: CanonicalTrack;\n}")
          replace_one(path,
              "  url.searchParams.set('select', 'id,visibility,created_at,context,track:tracks(id,isrc,title,artist,album,duration_sec,artwork_url,genres,provider_ids,preview_url,external_urls,available_on)');",
              "  url.searchParams.set('select', 'id,visibility,created_at,context,source_user_id,source:profiles!keep_decisions_source_user_id_fkey(username),track:tracks(id,isrc,title,artist,album,duration_sec,artwork_url,genres,provider_ids,preview_url,external_urls,available_on)');")
          replace_one(path,
              "    const track = Array.isArray(row?.track) ? row.track[0] : row?.track;\n    if (!row?.id || !track?.id || !track?.title || !track?.artist) return [];\n    const context = row?.context && typeof row.context === 'object' ? row.context : {};",
              "    const track = Array.isArray(row?.track) ? row.track[0] : row?.track;\n    const source = Array.isArray(row?.source) ? row.source[0] : row?.source;\n    if (!row?.id || !track?.id || !track?.title || !track?.artist) return [];\n    const context = row?.context && typeof row.context === 'object' ? row.context : {};")
          replace_one(path,
              "      sessionId,\n      track: {",
              "      sessionId,\n      sourceProfileId: row.source_user_id ? String(row.source_user_id) : undefined,\n      sourceUsername: source?.username ? String(source.username) : undefined,\n      creditPolicy: context.creditPolicy === 'SOCIAL_ZERO_CREDIT' ? 'SOCIAL_ZERO_CREDIT' : 'LISTEN_KEEP',\n      track: {")

          # 5) Session entries know whether they are FREE/listening or copied from another KEEP user.
          path = 'packages/mobile/src/types/index.ts'
          replace_one(path,
              "  /** Identifiant Supabase de la décision, présent dès qu'un vrai compte est synchronisé. */\n  keepDecisionId?: string;",
              "  /** Identifiant Supabase de la décision, présent dès qu'un vrai compte est synchronisé. */\n  keepDecisionId?: string;\n  /** Attribution sociale : présent lorsque ce KEEP provient du profil d'un autre membre. */\n  sourceProfileId?: string;\n  sourceUsername?: string;\n  creditSource?: 'FREE' | 'SOCIAL';")

          path = 'packages/mobile/src/store/useSessionHistoryStore.ts'
          replace_one(path,
              "    keepDecisionId: remote.decisionId,\n    creditLocked: false,",
              "    keepDecisionId: remote.decisionId,\n    sourceProfileId: remote.sourceProfileId,\n    sourceUsername: remote.sourceUsername,\n    creditSource: remote.creditPolicy === 'SOCIAL_ZERO_CREDIT' ? 'SOCIAL' : 'FREE',\n    creditLocked: false,")
          replace_one(path,
              "        visibility: remote.visibility,\n        creditLocked: false,",
              "        visibility: remote.visibility,\n        sourceProfileId: remote.sourceProfileId ?? entry.sourceProfileId,\n        sourceUsername: remote.sourceUsername ?? entry.sourceUsername,\n        creditSource: remote.creditPolicy === 'SOCIAL_ZERO_CREDIT' ? 'SOCIAL' : (entry.creditSource ?? 'FREE'),\n        creditLocked: false,")

          # 6) Own profile: refresh from server, dedupe the visible KEEP, and show FREE / USER attribution.
          path = 'packages/mobile/src/screens/ProfilePublicScreen.tsx'
          replace_one(path,
              "  const sessions = useSessionHistoryStore((s) => s.sessions);",
              "  const sessions = useSessionHistoryStore((s) => s.sessions);\n  const syncUnsyncedKeeps = useSessionHistoryStore((s) => s.syncUnsyncedKeeps);")
          replace_one(path,
              "  useEffect(() => {\n    const refresh = () => { void refreshPlaylists().catch(() => {}); };\n    refresh();\n    const unsubscribe = navigation?.addListener?.('focus', refresh);\n    return () => unsubscribe?.();\n  }, [navigation, refreshPlaylists]);",
              "  useEffect(() => {\n    const refresh = () => { void refreshPlaylists().catch(() => {}); };\n    refresh();\n    const unsubscribe = navigation?.addListener?.('focus', refresh);\n    return () => unsubscribe?.();\n  }, [navigation, refreshPlaylists]);\n\n  useEffect(() => {\n    if (accountRequired) return undefined;\n    const refreshKeeps = () => { void syncUnsyncedKeeps().catch(() => {}); };\n    refreshKeeps();\n    const unsubscribe = navigation?.addListener?.('focus', refreshKeeps);\n    return () => unsubscribe?.();\n  }, [accountRequired, navigation, syncUnsyncedKeeps, user?.id]);")
          replace_one(path,
              "  const keptTracks = useMemo(() => sessions.flatMap((session) => session.tracks.filter((entry) => entry.status === 'kept')), [sessions]);",
              "  const keptTracks = useMemo(() => {\n    const unique = new Map<string, (typeof sessions)[number]['tracks'][number]>();\n    const all = sessions.flatMap((session) => session.tracks.filter((entry) => entry.status === 'kept'));\n    for (const entry of all) {\n      const title = entry.track.title.trim().toLowerCase().replace(/\\s+/g, ' ');\n      const artist = entry.track.artist.trim().toLowerCase().replace(/\\s+/g, ' ');\n      const identity = entry.track.isrc?.trim().toUpperCase() || `${title}|${artist}`;\n      const current = unique.get(identity);\n      if (!current || new Date(entry.detectedAt).getTime() >= new Date(current.detectedAt).getTime()) unique.set(identity, entry);\n    }\n    return Array.from(unique.values()).sort((a, b) => new Date(b.detectedAt).getTime() - new Date(a.detectedAt).getTime());\n  }, [sessions]);")
          replace_one(path,
              "  const renderCompactTrack = (track: CanonicalTrack, key: string) => (",
              "  const renderCompactTrack = (track: CanonicalTrack, key: string, sourceUsername?: string | null) => (")
          replace_one(path,
              "        <TouchableOpacity style={s.trackShare} onPress={() => void shareProfileTrack(user.username, track.title, track.artist)}><Text style={s.trackShareText}>↗ Partager</Text></TouchableOpacity>\n      </View>",
              "        <TouchableOpacity style={s.trackShare} onPress={() => void shareProfileTrack(user.username, track.title, track.artist)}><Text style={s.trackShareText}>↗ Partager</Text></TouchableOpacity>\n        {sourceUsername !== undefined ? <Text style={[s.keepOrigin, sourceUsername ? s.keepOriginSocial : s.keepOriginFree]}>{sourceUsername ? `UTILISATEUR · @${sourceUsername}` : 'FREE'}</Text> : null}\n      </View>")
          replace_one(path,
              "      return <View style={s.keepList}>{publicKeptTracks.slice(0,18).map((entry) => renderCompactTrack(entry.track, entry.id))}</View>;",
              "      return <View style={s.keepList}>{publicKeptTracks.slice(0,18).map((entry) => renderCompactTrack(entry.track, entry.id, entry.sourceUsername ?? null))}</View>;")
          replace_one(path,
              "trackShareText:{color:colors.primaryLight,fontSize:9,fontWeight:'800'},",
              "trackShareText:{color:colors.primaryLight,fontSize:9,fontWeight:'800'},keepOrigin:{alignSelf:'flex-start',marginTop:5,fontSize:8,fontWeight:'900',letterSpacing:.35},keepOriginFree:{color:'#8E8798'},keepOriginSocial:{color:'#CBB6FF'},")

          # 7) Session history contrast rule: never violet/blue text on a same-tone button.
          path = 'packages/mobile/src/screens/SessionHistoryScreen.tsx'
          replace_one(path,
              "  sortButton: { flex: 1, minHeight: 42, alignItems: 'center', justifyContent: 'center', backgroundColor: colors.backgroundElevated, borderRightWidth: 1, borderRightColor: colors.border },\n  sortText: { color: colors.primaryLight, fontSize: 10, fontWeight: '900', letterSpacing: .4 },",
              "  sortButton: { flex: 1, minHeight: 42, alignItems: 'center', justifyContent: 'center', backgroundColor: colors.primary, borderRightWidth: 1, borderRightColor: colors.border },\n  sortText: { color: colors.white, fontSize: 10, fontWeight: '900', letterSpacing: .4 },")

          # 8) Compact community panel for Discover: followers + following + follow-back.
          community = r'''import React, { useEffect, useMemo, useState } from 'react';
          import { ActivityIndicator, Image, StyleSheet, Text, TouchableOpacity, View } from 'react-native';
          import { supabase } from '../services/supabaseClient';
          import { colors } from '../theme/colors';
          import { radius, spacing } from '../theme/spacing';

          type CommunityProfile = { id: string; username: string; avatarUrl?: string; kind: string };
          type Mode = 'following' | 'followers' | null;

          export default function CommunityConnectionsPanel({ userId, navigation }: { userId: string; navigation: any }) {
            const [followers, setFollowers] = useState<CommunityProfile[]>([]);
            const [following, setFollowing] = useState<CommunityProfile[]>([]);
            const [followingIds, setFollowingIds] = useState<Set<string>>(new Set());
            const [mode, setMode] = useState<Mode>(null);
            const [loading, setLoading] = useState(true);
            const [busyId, setBusyId] = useState<string | null>(null);

            const load = async () => {
              if (!supabase || !userId) return setLoading(false);
              setLoading(true);
              try {
                const [outgoing, incoming] = await Promise.all([
                  supabase.from('follows').select('followee_id').eq('follower_id', userId),
                  supabase.from('follows').select('follower_id').eq('followee_id', userId),
                ]);
                if (outgoing.error) throw outgoing.error;
                if (incoming.error) throw incoming.error;
                const outIds = (outgoing.data ?? []).map((row: any) => String(row.followee_id));
                const inIds = (incoming.data ?? []).map((row: any) => String(row.follower_id));
                const ids = Array.from(new Set([...outIds, ...inIds]));
                let profiles: any[] = [];
                if (ids.length) {
                  const result = await supabase.from('profiles').select('id,username,avatar_url,kind').in('id', ids).eq('is_public', true);
                  if (result.error) throw result.error;
                  profiles = result.data ?? [];
                }
                const map = new Map(profiles.map((row: any) => [String(row.id), { id: String(row.id), username: String(row.username || ''), avatarUrl: row.avatar_url || undefined, kind: String(row.kind || 'USER') } as CommunityProfile]));
                setFollowing(outIds.map((id) => map.get(id)).filter(Boolean) as CommunityProfile[]);
                setFollowers(inIds.map((id) => map.get(id)).filter(Boolean) as CommunityProfile[]);
                setFollowingIds(new Set(outIds));
              } finally { setLoading(false); }
            };

            useEffect(() => {
              void load();
              const unsubscribe = navigation?.addListener?.('focus', () => { void load(); });
              return () => unsubscribe?.();
            }, [navigation, userId]);

            const rows = useMemo(() => mode === 'following' ? following : mode === 'followers' ? followers : [], [followers, following, mode]);

            const followBack = async (profile: CommunityProfile) => {
              if (!supabase || followingIds.has(profile.id) || busyId) return;
              setBusyId(profile.id);
              try {
                const { error } = await supabase.from('follows').upsert({ follower_id: userId, followee_id: profile.id }, { onConflict: 'follower_id,followee_id', ignoreDuplicates: true });
                if (error) throw error;
                setFollowingIds((current) => new Set(current).add(profile.id));
                setFollowing((current) => current.some((item) => item.id === profile.id) ? current : [...current, profile]);
              } finally { setBusyId(null); }
            };

            return <View style={s.shell}>
              <View style={s.header}><View><Text style={s.title}>Ma communauté</Text><Text style={s.hint}>Retrouve tes abonnements et les personnes qui te suivent.</Text></View>{loading ? <ActivityIndicator color={colors.primaryLight}/> : null}</View>
              <View style={s.tabs}>
                <TouchableOpacity style={[s.tab, mode === 'following' && s.tabOn]} onPress={() => setMode((value) => value === 'following' ? null : 'following')}><Text style={[s.tabText, mode === 'following' && s.tabTextOn]}>Abonnements · {following.length}</Text></TouchableOpacity>
                <TouchableOpacity style={[s.tab, mode === 'followers' && s.tabOn]} onPress={() => setMode((value) => value === 'followers' ? null : 'followers')}><Text style={[s.tabText, mode === 'followers' && s.tabTextOn]}>Abonnés · {followers.length}</Text></TouchableOpacity>
              </View>
              {mode ? <View style={s.list}>{rows.length ? rows.map((profile) => {
                const alreadyFollowing = followingIds.has(profile.id);
                return <View key={profile.id} style={s.row}>
                  <TouchableOpacity style={s.identity} onPress={() => navigation.navigate('PublicProfile', { username: profile.username })}>
                    {profile.avatarUrl ? <Image source={{ uri: profile.avatarUrl }} style={s.avatar}/> : <View style={[s.avatar,s.avatarFallback]}><Text style={s.avatarText}>{profile.username.slice(0,1).toUpperCase()}</Text></View>}
                    <View style={s.copy}><Text style={s.username}>@{profile.username}</Text><Text style={s.kind}>{profile.kind}</Text></View>
                  </TouchableOpacity>
                  {mode === 'followers' ? <TouchableOpacity style={[s.follow, alreadyFollowing && s.followOn]} onPress={() => void followBack(profile)} disabled={alreadyFollowing || busyId === profile.id}><Text style={[s.followText, alreadyFollowing && s.followTextOn]}>{busyId === profile.id ? '…' : alreadyFollowing ? 'ABONNÉ' : '+ SUIVRE'}</Text></TouchableOpacity> : <TouchableOpacity style={s.view} onPress={() => navigation.navigate('PublicProfile', { username: profile.username })}><Text style={s.viewText}>VOIR</Text></TouchableOpacity>}
                </View>;
              }) : <Text style={s.empty}>{mode === 'followers' ? 'Personne ne te suit encore.' : 'Tu ne suis encore aucun profil.'}</Text>}</View> : null}
            </View>;
          }

          const s = StyleSheet.create({
            shell:{marginTop:spacing.lg,padding:12,borderRadius:18,backgroundColor:'#151020',borderWidth:1,borderColor:'#312348'},header:{flexDirection:'row',alignItems:'center',justifyContent:'space-between',gap:10},title:{color:colors.textPrimary,fontSize:14,fontWeight:'900'},hint:{color:colors.textMuted,fontSize:10,lineHeight:14,marginTop:2},tabs:{flexDirection:'row',gap:7,marginTop:10},tab:{flex:1,minHeight:36,borderRadius:18,borderWidth:1,borderColor:'#40354E',alignItems:'center',justifyContent:'center',backgroundColor:'#21182F'},tabOn:{backgroundColor:colors.primary,borderColor:colors.primaryLight},tabText:{color:'#B9AEC6',fontSize:9,fontWeight:'900'},tabTextOn:{color:'#FFF'},list:{marginTop:8,borderTopWidth:1,borderTopColor:'#2C203A'},row:{minHeight:56,flexDirection:'row',alignItems:'center',gap:8,borderBottomWidth:StyleSheet.hairlineWidth,borderBottomColor:'#30263B'},identity:{flex:1,minWidth:0,flexDirection:'row',alignItems:'center',paddingVertical:8},avatar:{width:38,height:38,borderRadius:19,backgroundColor:'#241936'},avatarFallback:{alignItems:'center',justifyContent:'center'},avatarText:{color:colors.primaryLight,fontSize:14,fontWeight:'900'},copy:{flex:1,minWidth:0,marginLeft:9},username:{color:'#FFF',fontSize:11,fontWeight:'900'},kind:{color:colors.textMuted,fontSize:8,marginTop:2},follow:{minHeight:30,paddingHorizontal:10,borderRadius:15,backgroundColor:colors.primary,alignItems:'center',justifyContent:'center'},followOn:{backgroundColor:'#1C3028',borderWidth:1,borderColor:'#3B8061'},followText:{color:'#FFF',fontSize:8,fontWeight:'900'},followTextOn:{color:'#76E3AE'},view:{minHeight:30,paddingHorizontal:11,borderRadius:15,borderWidth:1,borderColor:'#493369',alignItems:'center',justifyContent:'center'},viewText:{color:'#D7C7FF',fontSize:8,fontWeight:'900'},empty:{color:colors.textMuted,fontSize:10,textAlign:'center',paddingVertical:12}
          });
          '''
          Path('packages/mobile/src/components/CommunityConnectionsPanel.tsx').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in community.splitlines()) + '\n', encoding='utf-8')

          path = 'packages/mobile/src/screens/DiscoverScreen.tsx'
          replace_one(path,
              "import SwipeDeck from '../components/SwipeDeck';",
              "import SwipeDeck from '../components/SwipeDeck';\nimport CommunityConnectionsPanel from '../components/CommunityConnectionsPanel';")
          replace_one(path,
              "        {!user?.city && <TouchableOpacity style={styles.locationHint} onPress={() => navigation.navigate('ProfileSettings')}><Text style={styles.locationHintText}>📍 Ajoute ta ville ou utilise ta position pour améliorer les profils autour de toi.</Text></TouchableOpacity>}\n\n        <View style={styles.section}>",
              "        {!user?.city && <TouchableOpacity style={styles.locationHint} onPress={() => navigation.navigate('ProfileSettings')}><Text style={styles.locationHintText}>📍 Ajoute ta ville ou utilise ta position pour améliorer les profils autour de toi.</Text></TouchableOpacity>}\n\n        {user && !isLocalGuest && !isDemoMode ? <CommunityConnectionsPanel userId={user.id} navigation={navigation} /> : null}\n\n        <View style={styles.section}>")

          # Remove this one-shot workflow from the resulting source commit.
          Path('.github/workflows/keep-targeted-fixes.yml').unlink(missing_ok=True)
          PY

      - name: Commit targeted fixes
        shell: bash
        run: |
          git config user.name "KEEP Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(mobile): isolate accounts and trace social KEEP origins"
          git push origin HEAD:reconcile/claude-main-20260825
