name: Mobile CI

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'packages/mobile/**'
      - 'packages/music/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'packages/mobile/**'
      - 'packages/music/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Targeted Listen → Sessions badge repair
        if: github.event_name == 'push' && github.ref_name == 'reconcile/claude-main-20260825'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          home = Path('packages/mobile/src/screens/HomeScreenCompact.tsx')
          text = home.read_text(encoding='utf-8')
          if "function TopBar({ navigation, planCode, creditRemaining, creditUnlimited }: any)" in text:
              pattern = re.compile(r"function TopBar\(\{ navigation, planCode, creditRemaining, creditUnlimited \}: any\) \{.*?\n\}\n\nfunction MiniStat", re.S)
              replacement = """function TopBar({ navigation }: any) {
            return <View style={s.topBar}>
              <TouchableOpacity style={s.round} onPress={() => navigation.navigate('SessionHistory')}><Text style={s.roundText}>☰</Text></TouchableOpacity>
              <Text style={s.brand}>KEEP</Text>
              <View style={s.topBarSpacer} />
            </View>;
          }

          function MiniStat"""
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('TopBar contract missing')
              anchor = "  topBar: { height: 52, flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', paddingHorizontal: 16 },"
              if 'topBarSpacer:' not in text:
                  if anchor not in text:
                      raise SystemExit('topBar style contract missing')
                  text = text.replace(anchor, anchor + "\n  topBarSpacer: { width: 44 },", 1)
              home.write_text(text, encoding='utf-8')
          elif "function TopBar({ navigation }: any)" not in text:
              raise SystemExit('Unexpected TopBar state')

          history = Path('packages/mobile/src/screens/SessionHistoryScreen.tsx')
          text = history.read_text(encoding='utf-8')
          if 'const [planBadge' not in text:
              text = text.replace("import React, { useEffect, useMemo } from 'react';", "import React, { useEffect, useMemo, useState } from 'react';", 1)
              import_anchor = "import { spacing, radius, typography } from '../theme/spacing';"
              if "../services/creditService" not in text:
                  if import_anchor not in text:
                      raise SystemExit('history import contract missing')
                  text = text.replace(import_anchor, import_anchor + "\nimport { getDownloadCreditStatus } from '../services/creditService';", 1)

              state_anchor = "  const activeSessionId = useSessionStore((s) => s.sessionId);\n"
              if state_anchor not in text:
                  raise SystemExit('history state contract missing')
              state_block = """  const activeSessionId = useSessionStore((s) => s.sessionId);
          const [planBadge, setPlanBadge] = useState<{ label: string; focusPlan: string; paid: boolean }>({ label: 'FREE', focusPlan: 'PREMIUM', paid: false });

          const refreshPlanBadge = async () => {
            try {
              const status = await getDownloadCreditStatus();
              const rawCode = String(status.planCode || 'FREE').toUpperCase();
              const code = rawCode === 'GUEST' || rawCode === 'DEMO' ? 'FREE' : rawCode;
              const paid = code !== 'FREE';
              const label = code === 'PREMIUM'
                ? '♛ Premium'
                : code === 'CREATOR_PRO'
                  ? 'Creator Pro'
                  : code === 'VENUE_PRO'
                    ? 'Venue Pro'
                    : status.remaining == null ? 'FREE' : `FREE · ${status.remaining}`;
              setPlanBadge({ label, focusPlan: paid ? code : 'PREMIUM', paid });
            } catch {
              setPlanBadge({ label: 'FREE', focusPlan: 'PREMIUM', paid: false });
            }
          };
          """
              text = text.replace(state_anchor, state_block, 1)

              refresh_anchor = """    const refresh = () => {
              reconcileOrphanedLiveSessions(realActiveSessionId);
              void refreshCreditLocks().catch(() => {});
            };"""
              refresh_replacement = """    const refresh = () => {
              reconcileOrphanedLiveSessions(realActiveSessionId);
              void refreshCreditLocks().catch(() => {});
              void refreshPlanBadge();
            };"""
              if refresh_anchor not in text:
                  raise SystemExit('history refresh contract missing')
              text = text.replace(refresh_anchor, refresh_replacement, 1)

              header_anchor = """      <View style={styles.header}>
                <TouchableOpacity onPress={() => navigation.goBack()} hitSlop={8}><Text style={styles.backArrow}>←</Text></TouchableOpacity>
                <Text style={styles.title}>{t('history.title')}</Text>
              </View>"""
              header_replacement = """      <View style={styles.header}>
                <TouchableOpacity onPress={() => navigation.goBack()} hitSlop={8}><Text style={styles.backArrow}>←</Text></TouchableOpacity>
                <Text style={styles.title}>{t('history.title')}</Text>
                <TouchableOpacity
                  style={[styles.planBadge, planBadge.paid ? styles.planBadgePaid : styles.planBadgeFree]}
                  onPress={() => navigation.navigate('Offers', { focusPlan: planBadge.focusPlan, sourceFeature: 'SESSION_PLAN_BADGE' })}
                  accessibilityLabel="Voir mon offre KEEP"
                >
                  <Text style={[styles.planBadgeText, planBadge.paid ? styles.planBadgePaidText : styles.planBadgeFreeText]}>{planBadge.label}</Text>
                </TouchableOpacity>
              </View>"""
              if header_anchor not in text:
                  raise SystemExit('history header contract missing')
              text = text.replace(header_anchor, header_replacement, 1)
              text = text.replace("  title: { ...typography.h2, color: colors.textPrimary },", "  title: { ...typography.h2, color: colors.textPrimary, flex: 1 },", 1)

              style_anchor = "  backArrow: { color: colors.textPrimary, fontSize: 22 },\n"
              if style_anchor not in text:
                  raise SystemExit('history style contract missing')
              badge_styles = """  backArrow: { color: colors.textPrimary, fontSize: 22 },
            planBadge: { minHeight: 30, minWidth: 70, paddingHorizontal: 10, borderRadius: 999, borderWidth: 1, alignItems: 'center', justifyContent: 'center' },
            planBadgeFree: { backgroundColor: '#10271F', borderColor: '#3BCB8B' },
            planBadgePaid: { backgroundColor: '#25183B', borderColor: colors.primaryLight },
            planBadgeText: { fontSize: 10, fontWeight: '900', letterSpacing: .3 },
            planBadgeFreeText: { color: '#68F2B1' },
            planBadgePaidText: { color: colors.primaryLight },
          """
              text = text.replace(style_anchor, badge_styles, 1)
              history.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check

      - name: Typecheck music engine
        run: npm --workspace packages/music run type-check

      - name: Mobile tests
        run: npm --workspace packages/mobile test -- --runInBand

      - name: Music tests
        run: npm --workspace packages/music test -- --runInBand

      - name: Export web bundle
        working-directory: packages/mobile
        run: npx expo export --platform web --output-dir dist-web

      - name: Verify web entrypoint
        run: test -f packages/mobile/dist-web/index.html

      - name: Export iOS bundle
        working-directory: packages/mobile
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Verify iOS export
        run: test -d packages/mobile/dist-ios && test "$(find packages/mobile/dist-ios -type f | wc -l)" -gt 0

      - name: Guard validated responsive/navigation files
        if: github.event_name == 'push' && github.ref_name == 'reconcile/claude-main-20260825'
        run: git diff --exit-code -- packages/mobile/App.tsx packages/mobile/src/navigation/Navigation.tsx

      - name: Push targeted repair if needed
        if: github.event_name == 'push' && github.ref_name == 'reconcile/claude-main-20260825'
        run: |
          if git diff --quiet -- packages/mobile/src/screens/HomeScreenCompact.tsx packages/mobile/src/screens/SessionHistoryScreen.tsx; then
            echo "Targeted repair already present."
            exit 0
          fi
          git config user.name "KEEP QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/mobile/src/screens/HomeScreenCompact.tsx packages/mobile/src/screens/SessionHistoryScreen.tsx
          git commit -m "fix(listen): move plan badge into session history"
          git push origin HEAD:reconcile/claude-main-20260825
