name: Mobile CI

on:
  pull_request:
    paths:
      - 'packages/mobile/**'
      - 'packages/music/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check

      - name: Mobile tests
        run: npm --workspace packages/mobile test -- --runInBand
