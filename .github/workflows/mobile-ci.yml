name: Mobile CI

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'packages/mobile/**'
      - 'packages/music/**'
      - 'supabase/migrations/**'
      - 'scripts/verify-profile-data-integrity.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'packages/mobile/**'
      - 'packages/music/**'
      - 'supabase/migrations/**'
      - 'scripts/verify-profile-data-integrity.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply validated profile/share patch
        run: |
          python3 scripts/one_time_profile_share_patch.py
          python3 scripts/one_time_share_contract_fix.py

      - name: Install dependencies
        run: npm ci

      - name: KEEP source of truth
        run: node scripts/verify-source-of-truth.cjs

      - name: KEEP profile data integrity contract
        run: node scripts/verify-profile-data-integrity.cjs

      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check

      - name: Typecheck music engine
        run: npm --workspace packages/music run type-check

      - name: Mobile tests
        run: npm --workspace packages/mobile test -- --runInBand

      - name: Music tests
        run: npm --workspace packages/music test -- --runInBand

      - name: Export web bundle
        working-directory: packages/mobile
        run: npx expo export --platform web --output-dir dist-web

      - name: Verify web entrypoint
        run: test -f packages/mobile/dist-web/index.html

      - name: Export iOS bundle
        working-directory: packages/mobile
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Verify iOS export
        run: test -d packages/mobile/dist-ios && test "$(find packages/mobile/dist-ios -type f | wc -l)" -gt 0

      - name: Commit validated patch and preserve concurrent work
        if: github.event_name == 'push'
        run: |
          git show c8b5018990b362c740748718476974cb9b841c02:.github/workflows/mobile-ci.yml > .github/workflows/mobile-ci.yml
          rm -f scripts/one_time_profile_share_patch.py
          rm -f scripts/one_time_share_contract_fix.py
          rm -f .github/workflows/one-time-fix-profile-swipe-sharing.yml
          rm -f .github/workflows/one-time-run-profile-share-patch.yml
          git config user.name "KEEP Codex"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "fix(profile): harden shares and separate social counters"
          git fetch origin reconcile/claude-main-20260825
          git rebase origin/reconcile/claude-main-20260825
          git push origin HEAD:reconcile/claude-main-20260825
