name: Mobile CI

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'packages/mobile/**'
      - 'packages/music/**'
      - 'supabase/migrations/**'
      - 'scripts/verify-profile-data-integrity.cjs'
      - 'scripts/verify-source-of-truth.cjs'
      - 'scripts/verify-mobile-text-contrast.cjs'
      - 'scripts/verify-mobile-accessibility-contract.cjs'
      - 'scripts/verify-music-anti-duplicate-contract.cjs'
      - 'config/mobile-accessibility-contract.json'
      - 'docs/KEEP_CAHIER_DES_CHARGES_UI.md'
      - 'docs/KEEP_MASTER_SPEC.md'
      - 'config/keep-ui-baseline.json'
      - 'scripts/verify-ui-layout-baseline.cjs'
      - 'scripts/verify-global-user-regression-guard.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'
  # Chaque PR vers reconcile exécute les MÊMES contrôles que l'OTA, sans filtre
  # de chemins : un test cassé ne doit plus jamais bloquer une release (11/10/2026).
  pull_request:
    branches: ['reconcile/claude-main-20260825']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: KEEP source of truth
        run: node scripts/verify-source-of-truth.cjs

      - name: KEEP profile data integrity contract
        run: node scripts/verify-profile-data-integrity.cjs

      - name: KEEP mobile text contrast contract
        run: node scripts/verify-mobile-text-contrast.cjs

      - name: KEEP mobile accessibility contract
        run: node scripts/verify-mobile-accessibility-contract.cjs

      - name: KEEP music anti-duplicate contract
        run: node scripts/verify-music-anti-duplicate-contract.cjs

      - name: KEEP UI baseline contract
        run: node scripts/verify-ui-layout-baseline.cjs

      - name: KEEP global user regression guard
        run: node scripts/verify-global-user-regression-guard.cjs

      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check

      - name: Typecheck music engine
        run: npm --workspace packages/music run type-check

      - name: Mobile tests
        run: npm --workspace packages/mobile test -- --runInBand

      - name: Music tests
        run: npm --workspace packages/music test -- --runInBand

      - name: Export web bundle
        working-directory: packages/mobile
        # Mêmes valeurs publiques que web-preview-pages.yml : sans elles l'app web démarre sans adresse Supabase
        # (écran de connexion, aucun onglet) et le garde-fou navigateur échoue à tort (run 4575, 11/10/2026).
        env:
          EXPO_PUBLIC_SUPABASE_URL: 'https://rrhqsqzcplvmwxizqnla.supabase.co'
          EXPO_PUBLIC_SUPABASE_ANON_KEY: 'sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru'
          EXPO_PUBLIC_WEB_URL: 'https://adelkhatra-bit.github.io/KEEP'
          EXPO_PUBLIC_AUTH_REDIRECT_URL: 'https://adelkhatra-bit.github.io/KEEP/'
          EXPO_PUBLIC_API_URL: 'https://keep-backend-mu.vercel.app'
          EXPO_PUBLIC_DEMO_MODE: 'false'
          EXPO_PUBLIC_KEEP_PREVIEW: '0'
        run: npx expo export --platform web --output-dir dist-web

      - name: Verify web entrypoint
        run: test -f packages/mobile/dist-web/index.html

      # Garde-fou « page noire / navigation visible » AVANT fusion (11/10/2026) : la publication Web #3498 a échoué sur ce
      # contrôle alors que la CI des PR ne le faisait pas. Même script, mêmes profils d'appareil (bureau souris : barre
      # latérale ; tablette et téléphone tactiles : barre du bas) que web-preview-pages.yml. Aucune publication ici.
      - name: Assemble web export for the browser gate
        working-directory: packages/mobile
        run: |
          set -euo pipefail
          node scripts/fix-web-export.cjs dist-web
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist-web/index.html')
          s = p.read_text(encoding='utf-8')
          for attr in ('src', 'href'):
              s = s.replace(f'{attr}="/_expo/', f'{attr}="/KEEP/_expo/').replace(f'{attr}="./_expo/', f'{attr}="/KEEP/_expo/')
          p.write_text(s, encoding='utf-8')
          PY
          rm -rf ../../_gate && mkdir -p ../../_gate/KEEP
          cp -R dist-web/. ../../_gate/KEEP/
          for route in Main Main/Listen Main/Discover Main/MyMusic Main/Parties Main/Profile; do
            mkdir -p "../../_gate/KEEP/$route"
            cp ../../_gate/KEEP/index.html "../../_gate/KEEP/$route/index.html"
          done

      - name: Install Chromium for the browser gate
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Block black page + wrong navigation (real Chromium, PC + tablet + mobile)
        run: |
          set -euo pipefail
          (cd _gate && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          node scripts/web-visible-surface-gate.cjs http://127.0.0.1:8765/KEEP

      - name: Export iOS bundle
        working-directory: packages/mobile
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Verify iOS export
        run: test -d packages/mobile/dist-ios && test "$(find packages/mobile/dist-ios -type f | wc -l)" -gt 0

  release-blocked-alert:
    name: Alerte RELEASE BLOQUÉE
    needs: [verify-mobile]
    if: ${{ failure() && github.event_name != 'pull_request' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/release-blocked-alert.yml
    with:
      workflow_label: 'Mobile CI'
