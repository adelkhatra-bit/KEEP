name: KEEP — Android Preview APK (gratuit)

on:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/music/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: true
  EXPO_PUBLIC_SUPABASE_URL: 'https://rrhqsqzcplvmwxizqnla.supabase.co'
  EXPO_PUBLIC_SUPABASE_ANON_KEY: 'sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru'
  EXPO_PUBLIC_DEMO_MODE: 'false'

jobs:
  build-android-preview:
    name: Build APK autonome de test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check

      - name: Generate Android native project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Give Gradle enough memory
        run: |
          cat >> packages/mobile/android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          EOF

      - name: Build installable preview APK
        working-directory: packages/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -f packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk KEEP-Android-Test.apk

      - name: Archive workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KEEP-Android-Preview
          path: KEEP-Android-Test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="keep-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" KEEP-Android-Test.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "KEEP Android Test ${GITHUB_RUN_NUMBER}" \
            --notes "Version gratuite de test KEEP reliée au vrai projet Supabase. Permet la création d'un compte et les tests du profil/application." \
            --prerelease
