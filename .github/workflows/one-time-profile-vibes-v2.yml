name: KEEP — One-time Profile Vibes v2

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - .github/workflows/one-time-profile-vibes-v2.yml

permissions:
  contents: write

concurrency:
  group: keep-profile-vibes-v2
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - name: Sync latest branch head
        run: git pull --ff-only origin reconcile/claude-main-20260825

      - name: Apply profile Vibes patch
        run: python3 scripts/profile_vibes_patch_v2.py

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck mobile
        run: npm run type-check --workspace=packages/mobile

      - name: Typecheck music core
        run: npm run type-check --workspace=packages/music

      - name: Commit generated profile integration
        run: |
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          git add package-lock.json packages/mobile/src/screens/ProfilePublicScreen.tsx
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat(profile): surface automatic Vibes with swipe"
            git pull --rebase origin reconcile/claude-main-20260825
            git push origin HEAD:reconcile/claude-main-20260825
          fi
