# audit-run: 2026-10-04T11:55:00+02:00 diagnose-testflight-push-environment
# audit-trigger-chatgpt-deep: 2026-10-04T15:30:00Z
name: Loki EAS Push Credentials Audit
# audit-trigger: 2026-10-04T04:45:00+02:00 testflight-push-environment

on:
  workflow_dispatch:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - '.github/workflows/eas-push-credentials-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Inspect EAS push credential metadata
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node <<'NODE'
          const token = process.env.EXPO_TOKEN;
          if (!token) throw new Error('EXPO_TOKEN missing');

          async function gql(query, variables={}) {
            const r = await fetch('https://api.expo.dev/graphql', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                authorization: 'Bearer ' + token,
              },
              body: JSON.stringify({query, variables}),
            });
            const j = await r.json();
            if (!r.ok || j.errors?.length) {
              throw new Error(JSON.stringify(j.errors || j).slice(0,3000));
            }
            return j.data;
          }

          (async()=>{
            const schema = await gql(`
              query PushKeySchema {
                __type(name: "ApplePushKey") {
                  fields {
                    name
                    type { kind name ofType { kind name } }
                  }
                }
              }
            `);

            const fields = (schema.__type?.fields || []).map(f => f.name).sort();
            console.log('APPLE_PUSH_KEY_FIELDS=' + JSON.stringify(fields));

            const data = await gql(`
              query LokiPushCredentials($fullName: String!) {
                app {
                  byFullName(fullName: $fullName) {
                    id
                    name
                    iosAppCredentials {
                      id
                      appleAppIdentifier { id bundleIdentifier }
                      appleTeam { id appleTeamIdentifier appleTeamName }
                      pushKey {
                        id
                        keyIdentifier
                        createdAt
                        updatedAt
                        appleTeam { id appleTeamIdentifier appleTeamName }
                      }
                    }
                  }
                }
              }
            `, {fullName:'@saleme01s-team/keep'});

            const app = data.app?.byFullName;
            const rows = (app?.iosAppCredentials || []).map(c => ({
              credentialsId: c.id,
              bundleIdentifier: c.appleAppIdentifier?.bundleIdentifier || null,
              teamIdentifierPresent: !!c.appleTeam?.appleTeamIdentifier,
              appleTeam: c.appleTeam ? {
                id: c.appleTeam.id,
                identifier: c.appleTeam.appleTeamIdentifier,
                name: c.appleTeam.appleTeamName,
              } : null,
              pushKey: c.pushKey ? {
                id: c.pushKey.id,
                keyIdentifier: c.pushKey.keyIdentifier,
                createdAt: c.pushKey.createdAt,
                updatedAt: c.pushKey.updatedAt,
                appleTeam: c.pushKey.appleTeam ? {
                  id: c.pushKey.appleTeam.id,
                  identifier: c.pushKey.appleTeam.appleTeamIdentifier,
                  name: c.pushKey.appleTeam.appleTeamName,
                } : null,
              } : null,
            }));
            console.log('LOKI_EAS_PUSH_CREDENTIALS=' + JSON.stringify({appId:app?.id,name:app?.name,rows},null,2));

            const account = await gql(`
              query AccountPushKeys($name: String!) {
                account {
                  byName(accountName: $name) {
                    id
                    applePushKeysPaginated(first: 20) {
                      edges {
                        node {
                          id
                          keyIdentifier
                          createdAt
                          updatedAt
                          appleTeam { id appleTeamIdentifier appleTeamName }
                          iosAppCredentialsList {
                            id
                            appleAppIdentifier { bundleIdentifier }
                            app { id name slug }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, {name:'saleme01s-team'});

            const keys = (account.account?.byName?.applePushKeysPaginated?.edges || []).map(e => ({
              id:e.node.id,
              keyIdentifier:e.node.keyIdentifier,
              createdAt:e.node.createdAt,
              updatedAt:e.node.updatedAt,
              appleTeam:e.node.appleTeam ? {
                id:e.node.appleTeam.id,
                identifier:e.node.appleTeam.appleTeamIdentifier,
                name:e.node.appleTeam.appleTeamName
              } : null,
              apps:(e.node.iosAppCredentialsList || []).map(x=>({
                id:x.id,bundleIdentifier:x.appleAppIdentifier?.bundleIdentifier||null,app:x.app?.name||null,slug:x.app?.slug||null
              }))
            }));
            console.log('ACCOUNT_PUSH_KEYS=' + JSON.stringify(keys,null,2));

            const configuredTeam = String(process.env.APPLE_TEAM_ID || '').trim();
            const main = rows.find(r => r.bundleIdentifier === 'com.adelkhatra.keep');
            const pushTeam = main?.pushKey?.appleTeam?.identifier || null;
            console.log('PUSH_TEAM_MATCH=' + JSON.stringify({
              configuredTeamPresent: !!configuredTeam,
              pushTeamPresent: !!pushTeam,
              matchesConfiguredAppleTeam: !!configuredTeam && !!pushTeam && configuredTeam === pushTeam,
              mainCredentialHasAppleTeam: !!main?.appleTeam?.identifier,
            }));
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
