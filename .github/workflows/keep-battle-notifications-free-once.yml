name: KEEP Battle notifications + Free repair

on:
  push:
    paths:
      - 'scripts/patch_keep_battle_notifications_and_free.py'
      - '.github/workflows/keep-battle-notifications-free-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Sync branch
        run: git pull --ff-only origin reconcile/claude-main-20260825
      - name: Apply Battle notification repair
        run: python3 scripts/patch_keep_battle_notifications_and_free.py
      - name: Install dependencies
        run: npm ci
      - name: Verify mobile + backend
        run: |
          npm --workspace packages/mobile run type-check
          npm --workspace packages/mobile test -- --runInBand BattleNotificationActions.contract.test.ts KeepBattleMobileGameV3.compact.test.ts NotificationBadgeRealtime.contract.test.ts
          npm --workspace packages/backend run build
      - name: Commit fix
        run: |
          git config user.name "KEEP Guardian"
          git config user.email "actions@github.com"
          git add packages/mobile/src/screens/NotificationsScreen.tsx packages/mobile/src/services/pushNotificationService.ts packages/backend/src/lib/pushNotifications.ts packages/mobile/src/screens/__tests__/BattleNotificationActions.contract.test.ts packages/mobile/src/components/KeepBattleMobileGameV3.tsx packages/mobile/src/components/__tests__/KeepBattleMobileGameV3.compact.test.ts packages/mobile/src/screens/ProfilePublicScreen.tsx packages/mobile/src/screens/__tests__/NotificationBadgeRealtime.contract.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(mobile): instant notification badge and faster Battle rounds"
          git push origin HEAD:reconcile/claude-main-20260825
