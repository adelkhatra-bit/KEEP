name: KEEP — One-shot music bridge finalize

on:
  push:
    branches: [reconcile/claude-main-20260825]
    paths:
      - .github/workflows/one-shot-music-bridge-finalize.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - name: Patch keyless export and native mic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          music = Path('packages/mobile/src/screens/MyMusicScreen.tsx')
          text = music.read_text()
          needle = "import { sharePlaylist } from '../services/sharingService';\n"
          replacement = needle + "import { prepareKeylessMusicExport } from '../services/keylessMusicBridge';\n"
          if "prepareKeylessMusicExport" not in text:
              if needle not in text:
                  raise SystemExit('MyMusic import anchor not found')
              text = text.replace(needle, replacement, 1)

          old = """        {!isAllKeepView ? <TouchableOpacity style={styles.shareMini} onPress={() => sharePlaylist(item.id, item.name).catch(() => Alert.alert('Partager', 'Partage indisponible pour le moment.'))}><Text style={styles.shareMiniText}>↗ PARTAGER</Text></TouchableOpacity> : null}"""
          new = """        {!isAllKeepView ? <View style={styles.collectionActions}>
          <TouchableOpacity style={styles.serviceMini} onPress={async () => {
            try {
              const exportTracks = tracks.length ? tracks : await loadTracks(item);
              if (!exportTracks.length) return Alert.alert('Services musicaux', 'Cette collection ne contient aucun morceau à envoyer.');
              await prepareKeylessMusicExport(item.name, exportTracks);
              navigation.navigate('MusicConnections');
            } catch (e: any) {
              Alert.alert('Services musicaux', e?.message ?? 'Impossible de préparer cette collection.');
            }
          }}><Text style={styles.serviceMiniText}>♫ SERVICES</Text></TouchableOpacity>
          <TouchableOpacity style={styles.shareMini} onPress={() => sharePlaylist(item.id, item.name).catch(() => Alert.alert('Partager', 'Partage indisponible pour le moment.'))}><Text style={styles.shareMiniText}>↗ PARTAGER</Text></TouchableOpacity>
        </View> : null}"""
          if old in text:
              text = text.replace(old, new, 1)
          elif '♫ SERVICES' not in text:
              raise SystemExit('MyMusic action anchor not found')

          old_style = "shareMini:{alignSelf:'flex-end',minHeight:28,paddingHorizontal:9,borderRadius:14,borderWidth:1,borderColor:colors.border,alignItems:'center',justifyContent:'center'},shareMiniText:{color:colors.textSecondary,fontSize:8,fontWeight:'900'},"
          new_style = "collectionActions:{flexDirection:'row',justifyContent:'flex-end',gap:6,marginTop:2},serviceMini:{minHeight:28,paddingHorizontal:10,borderRadius:14,borderWidth:1,borderColor:'#A884FA',backgroundColor:'#5B3F8C',alignItems:'center',justifyContent:'center'},serviceMiniText:{color:'#FFFFFF',fontSize:8,fontWeight:'900'},shareMini:{minHeight:28,paddingHorizontal:9,borderRadius:14,borderWidth:1,borderColor:'#38D990',backgroundColor:'#123D2C',alignItems:'center',justifyContent:'center'},shareMiniText:{color:'#FFFFFF',fontSize:8,fontWeight:'900'},"
          if old_style in text:
              text = text.replace(old_style, new_style, 1)
          elif 'collectionActions:' not in text:
              raise SystemExit('MyMusic style anchor not found')
          music.write_text(text)

          mic = Path('packages/mobile/src/services/micCapture.ts')
          text = mic.read_text()
          text = text.replace('const NATIVE_VISUAL_NOISE_FLOOR_DB = -44;', 'const NATIVE_VISUAL_NOISE_FLOOR_DB = -52;', 1)
          anchor = """  const { recording } = await Audio.Recording.createAsync(
    { ...Audio.RecordingOptionsPresets.HIGH_QUALITY, isMeteringEnabled: true },"""
          replacement = """  // Sur téléphone on privilégie un canal mono haute qualité : pour une
  // reconnaissance ambiante il n'y a aucun bénéfice au stéréo, et tout le
  // débit AAC sert ainsi au signal utile. Le seuil visuel natif est aussi plus
  // sensible qu'avant tout en conservant un vrai 0 sous le plancher de bruit.
  const highQuality = Audio.RecordingOptionsPresets.HIGH_QUALITY;
  const nativeRecognitionOptions = {
    ...highQuality,
    isMeteringEnabled: true,
    android: { ...highQuality.android, sampleRate: 44100, numberOfChannels: 1, bitRate: 128000 },
    ios: { ...highQuality.ios, sampleRate: 44100, numberOfChannels: 1, bitRate: 128000 },
  };

  const { recording } = await Audio.Recording.createAsync(
    nativeRecognitionOptions,"""
          if anchor in text:
              text = text.replace(anchor, replacement, 1)
          elif 'nativeRecognitionOptions' not in text:
              raise SystemExit('mic createAsync anchor not found')
          text = text.replace('    50\n  );', '    40\n  );', 1)
          mic.write_text(text)

          workflow = Path('.github/workflows/one-shot-music-bridge-finalize.yml')
          workflow.unlink()
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck mobile
        run: npm run -w packages/mobile type-check

      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/mobile/src/screens/MyMusicScreen.tsx packages/mobile/src/services/micCapture.ts .github/workflows/one-shot-music-bridge-finalize.yml
          git commit -m "feat(music): export KEEP collections without API and tune native mic"
          git push origin HEAD:reconcile/claude-main-20260825
