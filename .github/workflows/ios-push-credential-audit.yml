# audit-trigger-live: 2026-10-04T13:14:00Z
# audit-trigger-chatgpt: 2026-10-04T15:29:00Z
name: Loki iOS Push Credential Audit
# audit-trigger: 2026-10-04T01:25:30+02:00 verify-current-push-key

on:
  workflow_dispatch:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - '.github/workflows/ios-push-credential-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm ci
      - name: Install EAS CLI
        run: npm install -g eas-cli@24.6.0
      - name: Read Expo project identity
        working-directory: packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas whoami
          eas project:info --json
          eas config -p ios -e production --json > "$RUNNER_TEMP/eas-ios-config.json"
          node -e "const j=require(process.env.RUNNER_TEMP+'/eas-ios-config.json'); console.log(JSON.stringify({projectId:j.extra?.eas?.projectId,bundleIdentifier:j.ios?.bundleIdentifier,owner:j.owner,slug:j.slug},null,2))"
      - name: Read remote iOS credential summary without changing it
        working-directory: packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/read-credentials.exp" <<'EXP'
          #!/usr/bin/expect -f
          set timeout 60
          log_user 1
          spawn eas credentials -p ios
          expect {
            -re {Which build profile do you want to configure.*} {
              send -- "production\r"
              exp_continue
            }
            -re {What do you want to do.*} {
              # The credential summary printed immediately before this menu is
              # all we need. Exit without selecting any mutation.
              send -- "\003"
            }
            timeout {
              send -- "\003"
            }
            eof {}
          }
          EXP
          chmod +x "$RUNNER_TEMP/read-credentials.exp"
          "$RUNNER_TEMP/read-credentials.exp" || true
