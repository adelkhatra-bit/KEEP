name: KEEP — Test humain navigateur

on:
  push:
    branches: [main, 'reconcile/claude-main-20260825']
    paths:
      - 'packages/mobile/**'
      - 'packages/music/**'
      - '.github/workflows/human-smoke-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-smoke:
    name: Chromium — parcours utilisateur
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      EXPO_PUBLIC_DEMO_MODE: 'true'
      EXPO_PUBLIC_KEEP_PREVIEW: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install KEEP
        run: npm ci
      - name: Typecheck complet
        run: npm run type-check
      - name: Export web réel
        working-directory: packages/mobile
        run: npx expo export --platform web --output-dir dist-human-test
      - name: Corriger bootstrap module web
        working-directory: packages/mobile
        run: node scripts/fix-web-export.cjs dist-human-test
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Start preview server
        run: |
          cd packages/mobile/dist-human-test
          python3 -m http.server 4173 > /tmp/keep-preview.log 2>&1 &
          echo $! > /tmp/keep-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/keep-preview.log
          exit 1
      - name: Parcours KEEP + captures
        run: |
          mkdir -p artifacts/human-smoke
          cat > keep-human-smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const failures = [];
            page.on('pageerror', err => failures.push(`PAGE ERROR: ${err.message}`));
            page.on('console', msg => { if (msg.type() === 'error') failures.push(`CONSOLE ERROR: ${msg.text()}`); });
            page.on('dialog', async d => d.accept().catch(() => {}));
            const textLast = (value, options = {}) => page.getByText(value, options).last();

            const dump = async (name) => {
              await page.screenshot({ path: `artifacts/human-smoke/${name}.png`, fullPage: true });
              fs.writeFileSync(`artifacts/human-smoke/${name}.txt`, [
                `URL: ${page.url()}`,
                `TITLE: ${await page.title()}`,
                `BODY: ${(await page.locator('body').innerText()).slice(0, 12000)}`,
                ...failures,
              ].join('\n\n'));
            };

            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(1500);
            await textLast('KEEP', { exact: true }).waitFor({ state: 'visible', timeout: 15000 });

            for (const label of ['Écouter', 'Découvertes', 'Playlists', 'Soirées', 'Profil']) {
              await textLast(label, { exact: true }).waitFor({ state: 'visible', timeout: 10000 });
            }
            await dump('01-five-tabs');

            await textLast(/START A SESSION|DÉMARRER|COMMENCER/i).click();
            await textLast('EN ÉCOUTE', { exact: true }).waitFor({ state: 'visible', timeout: 15000 });
            await textLast(/PASS|PASSER/i).waitFor({ state: 'visible', timeout: 15000 });
            await textLast(/KEEP|GARDER/i).waitFor({ state: 'visible', timeout: 15000 });
            await textLast(/Partager/i).waitFor({ state: 'visible', timeout: 15000 });
            await textLast(/Terminer la session|Arrêter|End session/i).waitFor({ state: 'visible', timeout: 15000 });
            await dump('02-listening-current-design');

            for (const label of ['Écouter', 'Découvertes', 'Playlists', 'Soirées', 'Profil']) {
              await textLast(label, { exact: true }).waitFor({ state: 'visible', timeout: 10000 });
            }

            await textLast('Playlists', { exact: true }).click();
            await page.waitForTimeout(500);
            await dump('03-playlists');

            await textLast('Soirées', { exact: true }).click();
            await page.waitForTimeout(500);
            await dump('04-parties');

            await textLast('Profil', { exact: true }).click();
            await textLast(/KEEP DNA/i).waitFor({ state: 'visible', timeout: 15000 });
            await dump('05-profile');

            if (failures.some(x => x.startsWith('PAGE ERROR:'))) throw new Error(failures.join('\n'));
            fs.writeFileSync('artifacts/human-smoke/report.txt', [
              'KEEP browser smoke: PASS',
              '5 tabs: PASS',
              'Listening screen + footer actions: PASS',
              'Profile KEEP DNA: PASS',
              `URL: ${page.url()}`,
              `Console/page errors captured: ${failures.length}`,
              ...failures.slice(0, 30),
            ].join('\n'));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node keep-human-smoke.cjs
      - name: Upload preuves visuelles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KEEP-Human-Smoke-Screenshots
          path: artifacts/human-smoke
          retention-days: 14
          if-no-files-found: warn
