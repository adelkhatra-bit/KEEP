name: KEEP — Test humain navigateur

on:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/music/**'
      - '.github/workflows/human-smoke-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-smoke:
    name: Chromium — parcours utilisateur
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      EXPO_PUBLIC_DEMO_MODE: 'true'
      EXPO_PUBLIC_KEEP_PREVIEW: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install KEEP
        run: npm ci

      - name: Typecheck complet
        run: npm run type-check

      - name: Export web réel
        working-directory: packages/mobile
        run: npx expo export --platform web --output-dir dist-human-test

      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Start preview server
        run: |
          cd packages/mobile/dist-human-test
          python3 -m http.server 4173 > /tmp/keep-preview.log 2>&1 &
          echo $! > /tmp/keep-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/keep-preview.log
          exit 1

      - name: Parcours comme un utilisateur + captures
        run: |
          mkdir -p artifacts/human-smoke
          cat > /tmp/keep-human-smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const failures = [];

            page.on('pageerror', err => failures.push(`PAGE ERROR: ${err.message}`));
            page.on('console', msg => {
              if (msg.type() === 'error') failures.push(`CONSOLE ERROR: ${msg.text()}`);
            });

            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle', timeout: 60000 });
            await page.getByText('KEEP', { exact: true }).first().waitFor({ timeout: 30000 });
            await page.screenshot({ path: 'artifacts/human-smoke/01-home.png', fullPage: true });

            const musicTab = page.getByText(/Mes musiques|My Music/i).last();
            await musicTab.click();
            await page.getByText(/Tes playlists|playlists/i).first().waitFor({ timeout: 15000 });
            await page.screenshot({ path: 'artifacts/human-smoke/02-my-music.png', fullPage: true });

            await page.getByText(/Services/i).first().click();
            await page.getByText('Services musicaux', { exact: true }).waitFor({ timeout: 15000 });
            for (const name of ['Apple Music', 'Spotify', 'Deezer']) {
              await page.getByText(name, { exact: true }).waitFor({ timeout: 10000 });
            }
            await page.screenshot({ path: 'artifacts/human-smoke/03-services-musicaux.png', fullPage: true });

            await page.goBack();
            await page.waitForTimeout(500);
            const profileTab = page.getByText(/Profil|Profile/i).last();
            await profileTab.click();
            await page.getByText(/KEEP DNA/i).waitFor({ timeout: 15000 });
            await page.getByText(/Playlists/i).first().waitFor({ timeout: 10000 });
            await page.screenshot({ path: 'artifacts/human-smoke/04-profile-new-design.png', fullPage: true });

            fs.writeFileSync('artifacts/human-smoke/report.txt', [
              'KEEP human smoke test: PASS',
              `URL: ${page.url()}`,
              `Console/page errors: ${failures.length}`,
              ...failures.slice(0, 30),
            ].join('\n'));

            // Certaines erreurs réseau sont normales en preview démo (pas de backend réel),
            // mais une exception JS non gérée dans le rendu principal doit échouer.
            const fatal = failures.filter(x => /PAGE ERROR/.test(x));
            await browser.close();
            if (fatal.length) {
              console.error(fatal.join('\n'));
              process.exit(1);
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          JS
          node /tmp/keep-human-smoke.cjs

      - name: Upload preuves visuelles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KEEP-Human-Smoke-Screenshots
          path: artifacts/human-smoke
          retention-days: 14
          if-no-files-found: warn
