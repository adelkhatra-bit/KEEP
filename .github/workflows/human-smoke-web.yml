name: KEEP — Test humain navigateur

on:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/music/**'
      - '.github/workflows/human-smoke-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-smoke:
    name: Chromium — parcours utilisateur
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      EXPO_PUBLIC_DEMO_MODE: 'true'
      EXPO_PUBLIC_KEEP_PREVIEW: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install KEEP
        run: npm ci
      - name: Typecheck complet
        run: npm run type-check
      - name: Export web réel
        working-directory: packages/mobile
        run: npx expo export --platform web --output-dir dist-human-test
      - name: Corriger bootstrap module web
        working-directory: packages/mobile
        run: node scripts/fix-web-export.cjs dist-human-test
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Start preview server
        run: |
          cd packages/mobile/dist-human-test
          python3 -m http.server 4173 > /tmp/keep-preview.log 2>&1 &
          echo $! > /tmp/keep-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/keep-preview.log
          exit 1
      - name: Parcours comme un utilisateur + captures
        run: |
          mkdir -p artifacts/human-smoke
          cat > keep-human-smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const failures = [];
            page.on('pageerror', err => failures.push(`PAGE ERROR: ${err.message}`));
            page.on('console', msg => { if (msg.type() === 'error') failures.push(`CONSOLE ERROR: ${msg.text()}`); });

            const dump = async (name) => {
              await page.screenshot({ path: `artifacts/human-smoke/${name}.png`, fullPage: true });
              fs.writeFileSync(`artifacts/human-smoke/${name}.txt`, [
                `URL: ${page.url()}`,
                `TITLE: ${await page.title()}`,
                `BODY: ${(await page.locator('body').innerText()).slice(0, 12000)}`,
                ...failures,
              ].join('\n\n'));
            };

            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(2000);
            await dump('00-first-render');
            if (failures.some(x => x.startsWith('PAGE ERROR:'))) throw new Error(failures.join('\n'));

            await page.getByText('KEEP', { exact: true }).first().waitFor({ timeout: 15000 });
            await dump('01-home');

            await page.getByText(/START A SESSION|DÉMARRER|COMMENCER/i).first().click();
            await page.getByText('EN ÉCOUTE', { exact: true }).waitFor({ timeout: 15000 });
            await page.waitForTimeout(1200);
            await dump('02-neon-listening');

            await page.getByText(/Mes musiques|My Music/i).last().click();
            await page.getByText(/Tes playlists|playlists|My Music/i).first().waitFor({ timeout: 15000 });
            await dump('03-my-music');

            const services = page.getByText(/Services/i).first();
            await services.click({ force: true });
            await page.waitForTimeout(1200);
            await dump('04-after-services-click');
            if (failures.some(x => x.startsWith('PAGE ERROR:'))) throw new Error(failures.join('\n'));
            await page.getByText(/Services musicaux|Music services/i).first().waitFor({ timeout: 15000 });
            for (const name of ['Apple Music', 'Spotify', 'Deezer']) {
              await page.getByText(name, { exact: true }).waitFor({ timeout: 10000 });
            }
            await dump('05-services-musicaux');

            await page.getByText(/Retour|Back/i).first().click();
            await page.waitForTimeout(500);
            await page.getByText(/Profil|Profile/i).last().click();
            await page.getByText(/KEEP DNA/i).waitFor({ timeout: 15000 });
            await page.getByText(/Playlists/i).first().waitFor({ timeout: 10000 });
            await dump('06-profile-new-design');

            fs.writeFileSync('artifacts/human-smoke/report.txt', [
              'KEEP human smoke test: PASS',
              `URL: ${page.url()}`,
              `Console/page errors: ${failures.length}`,
              ...failures.slice(0, 30),
            ].join('\n'));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node keep-human-smoke.cjs
      - name: Upload preuves visuelles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KEEP-Human-Smoke-Screenshots
          path: artifacts/human-smoke
          retention-days: 14
          if-no-files-found: warn
