name: KEEP one-time profile privacy patch
on:
  push:
    branches: ['reconcile/claude-main-20260825']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - name: Patch public profile visibility only
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'packages/mobile/src/screens/ProfilePublicScreen.tsx';
          let s = fs.readFileSync(p, 'utf8');
          const replace = (from, to, label) => {
            if (!s.includes(from)) {
              if (s.includes(to)) return;
              throw new Error(`patch anchor missing: ${label}`);
            }
            s = s.replace(from, to);
          };

          replace(
            "import { musicEngine } from '../services/musicEngine';",
            "import { musicEngine } from '../services/musicEngine';\nimport { KeepPlaylistPreference, loadPlaylistPreferences, preferenceFor } from '../services/keepLibraryService';",
            'import'
          );

          replace(
            "  const [loadingPlaylistId, setLoadingPlaylistId] = useState<string | null>(null);\n\n  const accountRequired = isLocalGuest || isDemoMode;",
            "  const [loadingPlaylistId, setLoadingPlaylistId] = useState<string | null>(null);\n  const [playlistPreferences, setPlaylistPreferences] = useState<Record<string, KeepPlaylistPreference>>({});\n\n  const accountRequired = isLocalGuest || isDemoMode;\n  const providerId = musicEngine.musicProvider.providerId || 'KEEP';",
            'state'
          );

          replace(
            "  useEffect(() => {\n    const refresh = () => { void refreshPlaylists().catch(() => {}); };\n    refresh();\n    const unsubscribe = navigation?.addListener?.('focus', refresh);\n    return () => unsubscribe?.();\n  }, [navigation, refreshPlaylists]);",
            "  useEffect(() => {\n    const refresh = () => { void refreshPlaylists().catch(() => {}); };\n    refresh();\n    const unsubscribe = navigation?.addListener?.('focus', refresh);\n    return () => unsubscribe?.();\n  }, [navigation, refreshPlaylists]);\n\n  useEffect(() => {\n    let live = true;\n    const refreshPreferences = async () => {\n      const next = await loadPlaylistPreferences(providerId).catch(() => ({}));\n      if (live) setPlaylistPreferences(next);\n    };\n    void refreshPreferences();\n    const unsubscribe = navigation?.addListener?.('focus', () => { void refreshPreferences(); });\n    return () => { live = false; unsubscribe?.(); };\n  }, [navigation, providerId, providerPlaylists.length]);",
            'preferences effect'
          );

          replace(
            "  const keptTracks = useMemo(() => sessions.flatMap((session) => session.tracks.filter((entry) => entry.status === 'kept')), [sessions]);\n  const dna = useMemo(() => {\n    const decisions: DnaSourceDecision[] = keptTracks.map((entry) => ({ artist: entry.track.artist, genres: entry.track.genres ?? [], decision: 'KEPT', createdAt: entry.detectedAt }));\n    return computeMusicDNA(decisions);\n  }, [keptTracks]);\n  const artists = useMemo(() => Array.from(new Set(keptTracks.map((entry) => entry.track.artist))).slice(0, 18), [keptTracks]);\n  const albums = useMemo(() => Array.from(new Set(keptTracks.map((entry) => entry.track.album).filter(Boolean) as string[])).slice(0, 18), [keptTracks]);\n  const displayPlaylists = useMemo<ProviderPlaylist[]>(() => {\n    if (providerPlaylists.length) return providerPlaylists.slice(0, 18);\n    if (!keptTracks.length) return [];\n    return [{ id: LOCAL_PROFILE_PLAYLIST_ID, name: 'Mes KEEP', description: 'Morceaux gardés sur cet appareil', trackCount: keptTracks.length, isKeepManaged: true }];\n  }, [keptTracks.length, providerPlaylists]);",
            "  const keptTracks = useMemo(() => sessions.flatMap((session) => session.tracks.filter((entry) => entry.status === 'kept')), [sessions]);\n  // Profil = aperçu public réel. Un morceau passé en Privé dans Mes musiques\n  // reste dans la bibliothèque et dans les sessions, mais disparaît ici immédiatement.\n  const publicKeptTracks = useMemo(() => keptTracks.filter((entry) => entry.visibility === 'PUBLIC'), [keptTracks]);\n  const publicTrackIds = useMemo(() => new Set(publicKeptTracks.map((entry) => entry.track.id)), [publicKeptTracks]);\n  const dna = useMemo(() => {\n    const decisions: DnaSourceDecision[] = publicKeptTracks.map((entry) => ({ artist: entry.track.artist, genres: entry.track.genres ?? [], decision: 'KEPT', createdAt: entry.detectedAt }));\n    return computeMusicDNA(decisions);\n  }, [publicKeptTracks]);\n  const artists = useMemo(() => Array.from(new Set(publicKeptTracks.map((entry) => entry.track.artist))).slice(0, 18), [publicKeptTracks]);\n  const albums = useMemo(() => Array.from(new Set(publicKeptTracks.map((entry) => entry.track.album).filter(Boolean) as string[])).slice(0, 18), [publicKeptTracks]);\n  const displayPlaylists = useMemo<ProviderPlaylist[]>(() => {\n    if (providerPlaylists.length) {\n      return providerPlaylists.filter((playlist) => preferenceFor(playlistPreferences, providerId, playlist.id)?.isPublic === true).slice(0, 18);\n    }\n    const localPreference = preferenceFor(playlistPreferences, providerId, LOCAL_PROFILE_PLAYLIST_ID);\n    if (!publicKeptTracks.length || localPreference?.isPublic !== true) return [];\n    return [{ id: LOCAL_PROFILE_PLAYLIST_ID, name: localPreference.name || 'Mes KEEP', description: localPreference.description || 'Morceaux publics gardés sur cet appareil', trackCount: publicKeptTracks.length, isKeepManaged: true }];\n  }, [playlistPreferences, providerId, providerPlaylists, publicKeptTracks.length]);",
            'public selectors'
          );

          replace(
            "      const localTracks = keptTracks.map((entry) => entry.track);",
            "      const localTracks = publicKeptTracks.map((entry) => entry.track);",
            'local playlist filter'
          );

          replace(
            "      const tracks = await musicEngine.musicProvider.getPlaylistTracks(session, playlist.id);\n      setPlaylistTracks((current) => ({ ...current, [playlist.id]: tracks }));",
            "      const tracks = await musicEngine.musicProvider.getPlaylistTracks(session, playlist.id);\n      const visibleTracks = musicEngine.usesDemoMusicProvider ? tracks.filter((track) => publicTrackIds.has(track.id)) : tracks;\n      setPlaylistTracks((current) => ({ ...current, [playlist.id]: visibleTracks }));",
            'expanded playlist filter'
          );

          replace(
            "      if (!keptTracks.length) return <Empty text=\"Tes morceaux KEEP apparaîtront ici.\" />;\n      return <View style={s.keepList}>{keptTracks.slice(0,18).map((entry) => renderCompactTrack(entry.track, entry.id))}</View>;",
            "      if (!publicKeptTracks.length) return <Empty text=\"Tes morceaux publics apparaîtront ici. Les morceaux privés restent dans Mes musiques.\" />;\n      return <View style={s.keepList}>{publicKeptTracks.slice(0,18).map((entry) => renderCompactTrack(entry.track, entry.id))}</View>;",
            'keep tab'
          );

          replace(
            "<View style={s.stats}><Stat value={keptTracks.length} label=\"KEEP\"/><Stat value={user.followerCount} label=\"Abonnés\"/><Stat value={user.followingCount} label=\"Abonnements\"/></View>",
            "<View style={s.stats}><Stat value={publicKeptTracks.length} label=\"KEEP\"/><Stat value={user.followerCount} label=\"Abonnés\"/><Stat value={user.followingCount} label=\"Abonnements\"/></View>",
            'stats'
          );

          fs.writeFileSync(p, s);
          NODE
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "keep-ci"
          git config user.email "keep-ci@users.noreply.github.com"
          git add packages/mobile/src/screens/ProfilePublicScreen.tsx
          git commit -m "fix(profile): mirror public visibility from music library"
          git push origin HEAD:reconcile/claude-main-20260825
