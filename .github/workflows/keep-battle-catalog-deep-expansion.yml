name: KEEP — Battle catalog deep expansion

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - '.github/workflows/keep-battle-catalog-deep-expansion.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: keep-battle-catalog-deep-expansion
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Expand Battle catalog
        env:
          KEEP_BATTLE_CATALOG_WORKER_KEY: ${{ secrets.KEEP_BATTLE_CATALOG_WORKER_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${KEEP_BATTLE_CATALOG_WORKER_KEY:-}" ]; then
            echo "KEEP_BATTLE_CATALOG_WORKER_KEY not configured; Supabase Cron is the authoritative automatic expander."
            exit 0
          fi

          base='https://rrhqsqzcplvmwxizqnla.supabase.co/functions/v1/keep-battle-catalog-seed'
          themes=(
            CHANSON_FR RAP_FR
            RUSSE TURC ARABE RAI BRESIL INDE KPOP
            FUNK DISCO AFRO RAP_US ELECTRO POP RNB ROCK LATINO
            SOUL REGGAE JAZZ CLASSIQUE ANNEES_80 ANNEES_90
          )
          failed=0

          for theme in "${themes[@]}"; do
            echo "=== $theme ==="
            for batch in $(seq 0 60); do
              if ! body="$(curl --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 145                 --fail-with-body -sS                 -H "x-keep-worker-key: ${KEEP_BATTLE_CATALOG_WORKER_KEY}"                 "$base?theme=$theme&batch=$batch")"; then
                echo "::error::Seed failed for $theme batch $batch"
                failed=1
                break
              fi
              echo "$body" | jq -c '{ok,theme,batch,totalBatches,done,queries,found,considered,distinctArtists,inserted,updated,linked,budget}'
              if [ "$(echo "$body" | jq -r '.ok // false')" != "true" ]; then
                failed=1
                break
              fi
              [ "$(echo "$body" | jq -r '.done // false')" = "true" ] && break
              sleep 22
            done
          done

          exit "$failed"
