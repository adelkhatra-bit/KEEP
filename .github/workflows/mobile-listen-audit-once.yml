name: Mobile listen audit patch

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - scripts/patch_mobile_listen_audit.py
      - .github/workflows/mobile-listen-audit-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Apply mobile listen patch
        run: python3 scripts/patch_mobile_listen_audit.py
      - name: Install dependencies
        run: npm ci
      - name: Verify mobile TypeScript
        run: npm --workspace keep-mobile run type-check
      - name: Verify mobile tests
        run: npm --workspace keep-mobile test -- --runInBand
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/mobile/src/store/useSessionStore.ts packages/mobile/src/services/keepMusicCoreRecognition.ts supabase/functions/keep-music-recognition-v2/index.ts supabase/functions/keep-music-fallback/index.ts
          git commit -m "fix(listen): harden background mobile recognition"
          git push origin HEAD:reconcile/claude-main-20260825
