name: KEEP — One-shot product integrity only
on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths: ['.github/workflows/one-shot-product-integrity-only.yml']
permissions:
  contents: write
jobs:
  validate-and-push-product-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      EXPO_PUBLIC_SUPABASE_URL: https://rrhqsqzcplvmwxizqnla.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru
      EXPO_PUBLIC_DEMO_MODE: 'true'
      EXPO_PUBLIC_KEEP_PREVIEW: '0'
      EXPO_PUBLIC_KEEP_REAL_RECOGNITION: 'false'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3010
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 2
      - name: Latest canonical head
        run: git pull --ff-only origin reconcile/claude-main-20260825
      - name: Apply two audited product fixes only
        shell: python
        run: |
          from pathlib import Path
          profile=Path('packages/mobile/src/screens/ProfilePublicScreen.tsx')
          share=Path('packages/mobile/share-profile.html')
          p=profile.read_text(encoding='utf-8'); h=share.read_text(encoding='utf-8')
          count="  const profileOwnKeepCount = publicSnapshot?.directPublicKeeps ?? localPublicOwnKeepCount;\n  const profileUserKeepCount = publicSnapshot?.socialPublicKeeps ?? localPublicUserKeepCount;"
          if 'profileTotalKeepCount' not in p:
              assert count in p
              p=p.replace(count,count+"\n  const profileTotalKeepCount = publicSnapshot?.totalPublicKeeps ?? (localPublicOwnKeepCount + localPublicUserKeepCount);",1)
          if '<Stat value={profileOwnKeepCount} label="KEEP"/>' in p:
              p=p.replace('<Stat value={profileOwnKeepCount} label="KEEP"/>','<Stat value={profileTotalKeepCount} label="KEEP total"/>',1)
          assert '<Stat value={profileTotalKeepCount} label="KEEP total"/>' in p
          old="  const profileRows=await get(`profiles?username=ilike.${encodeURIComponent(u)}&select=id,username,bio,city,country_code,favorite_genres,social_links,avatar_url&limit=1`);\n  if(!profileRows.length)throw new Error('Profil introuvable');\n  const p=profileRows[0];"
          if 'profile_username_aliases?' not in h:
              assert old in h
              new="  let profileRows=await get(`profiles?username=ilike.${encodeURIComponent(u)}&select=id,username,bio,city,country_code,favorite_genres,social_links,avatar_url&limit=1`);\n  if(!profileRows.length){\n    const aliases=await get(`profile_username_aliases?alias=ilike.${encodeURIComponent(u)}&select=profile_id&limit=1`);\n    if(aliases.length)profileRows=await get(`profiles?id=eq.${encodeURIComponent(aliases[0].profile_id)}&select=id,username,bio,city,country_code,favorite_genres,social_links,avatar_url&limit=1`);\n  }\n  if(!profileRows.length)throw new Error('Profil introuvable');\n  const p=profileRows[0];"
              h=h.replace(old,new,1)
          profile.write_text(p,encoding='utf-8'); share.write_text(h,encoding='utf-8')
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Source truth
        run: node scripts/verify-source-of-truth.cjs
      - name: Typecheck
        run: npm run type-check
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Start exact mobile runtime
        working-directory: packages/mobile
        run: |
          node scripts/start-web.cjs --port 8081 --clear >/tmp/keep-product-gate.log 2>&1 &
          for i in {1..120}; do
            if grep -Fq '[KEEP WEB] READY http://localhost:8081' /tmp/keep-product-gate.log 2>/dev/null && curl -fsS http://127.0.0.1:8081 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/keep-product-gate.log; exit 1
      - name: Human gate 390x844
        run: |
          cat > keep-product-gate.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844}});const t=(v,o={})=>p.getByText(v,o).last();await p.goto('http://127.0.0.1:8081',{waitUntil:'networkidle'});await t('ESSAYER GRATUITEMENT',{exact:true}).click();for(const x of ['Écouter','Découvertes','Playlists','Soirées','Profil'])await t(x,{exact:true}).waitFor({state:'visible'});const start=p.getByLabel('Démarrer une écoute').last();await start.click();await t(/MICRO · (?:ANALYSE|ACTIF)/i).waitFor({state:'visible'});const end=t(/Terminer la session|Arrêter|End session/i);await end.waitFor({state:'visible'});await end.click();await start.waitFor({state:'visible'});await t('Découvertes',{exact:true}).click();await t('1 · DISTANCE',{exact:true}).waitFor({state:'visible'});const s=t('2 · ⌖ RECHERCHER',{exact:true});await s.waitFor({state:'visible'});const box=await s.boundingBox();if(!box||box.y+box.height>844)throw Error('search outside viewport');await p.getByLabel('Rayon 100 kilomètres').last().waitFor({state:'visible'});await t('Profil',{exact:true}).click();await p.getByLabel('Menu du profil').last().waitFor({state:'visible'});await t('PARTAGER',{exact:true}).waitFor({state:'visible'});if(await t('+ Suivre',{exact:true}).isVisible().catch(()=>false))throw Error('self-follow');await b.close();console.log('PRODUCT HUMAN GATE PASS')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node keep-product-gate.cjs
          rm keep-product-gate.cjs
      - name: Refuse unrelated product edits
        run: |
          test -z "$(git diff --name-only | grep -Ev '^(packages/mobile/src/screens/ProfilePublicScreen.tsx|packages/mobile/share-profile.html)$' || true)"
      - name: Push product fixes only
        run: |
          git config user.name 'KEEP QA Bot'
          git config user.email 'keep-qa-bot@users.noreply.github.com'
          git add packages/mobile/src/screens/ProfilePublicScreen.tsx packages/mobile/share-profile.html
          git commit -m 'fix(profile): preserve public music counts and permanent share links'
          git push origin HEAD:reconcile/claude-main-20260825
