name: KEEP — One-time profile layout consistency

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - .github/workflows/one-time-keep-vibes-sync.yml

permissions:
  contents: write

concurrency:
  group: keep-profile-layout-one-time
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - name: Sync latest branch head
        run: git pull --ff-only origin reconcile/claude-main-20260825

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply profile layout consistency patch
        run: python3 scripts/one_time_profile_layout_consistency.py

      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check

      - name: Verify canonical source
        run: node scripts/verify-source-of-truth.cjs

      - name: Commit verified profile layout and clean temporary files
        run: |
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          git add packages/mobile/src/screens/ProfilePublicScreen.tsx packages/mobile/src/screens/PublicUserProfileScreen.tsx
          git rm scripts/one_time_profile_layout_consistency.py
          git rm .github/workflows/one-time-keep-vibes-sync.yml
          git commit -m "fix(profile): align own and visitor profile hierarchy"
          git pull --rebase origin reconcile/claude-main-20260825
          git push origin HEAD:reconcile/claude-main-20260825
