name: KEEP — One-time Vibes Sync

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - .github/workflows/one-time-keep-vibes-sync.yml

permissions:
  contents: write

concurrency:
  group: keep-vibes-one-time-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - name: Sync latest branch head
        run: git pull --ff-only origin reconcile/claude-main-20260825

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply collective profile hierarchy
        run: python3 scripts/profile_collective_hierarchy_patch.py

      - name: Validate clean install
        run: npm ci --ignore-scripts

      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check

      - name: Verify canonical source
        run: node scripts/verify-source-of-truth.cjs

      - name: Commit verified hierarchy
        run: |
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          git add packages/mobile/src/screens/ProfilePublicScreen.tsx
          git rm .github/workflows/one-time-keep-vibes-sync.yml
          git rm -f .github/workflows/one-time-profile-collective-hierarchy.yml || true
          git rm scripts/profile_collective_hierarchy_patch.py
          git commit -m "fix(profile): finalize collective owner hierarchy"
          git pull --rebase origin reconcile/claude-main-20260825
          git push origin HEAD:reconcile/claude-main-20260825
