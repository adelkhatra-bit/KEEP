name: KEEP Battle accept refuse final repair

on:
  push:
    paths:
      - 'scripts/patch_keep_battle_accept_refuse_final.py'
      - '.github/workflows/keep-battle-accept-refuse-final-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Sync branch
        run: git pull --ff-only origin reconcile/claude-main-20260825
      - name: Apply final accept refuse repair
        run: python3 scripts/patch_keep_battle_accept_refuse_final.py
      - name: Install dependencies
        run: npm ci
      - name: Verify mobile Battle
        run: |
          npm --workspace packages/mobile run type-check
          npm --workspace packages/mobile test -- --runInBand KeepBattleMobileGameV3.compact.test.ts BattleNotificationActions.contract.test.ts
      - name: Verify final interaction contract
        run: |
          grep -F "const loadArenaWithRetry = React.useCallback" packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          grep -F "inbox.filter((x) => x.id !== respondingChallengeId)" packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          grep -F "const loadedArena = await loadArenaWithRetry(response.arenaId)" packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          grep -F 'accessibilityLabel="Refuser le Battle"' packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          grep -F 'accessibilityLabel="Accepter le Battle"' packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          grep -F "minHeight: 50" packages/mobile/src/components/KeepBattleMobileGameV3.tsx
      - name: Commit fix
        run: |
          git config user.name "KEEP Guardian"
          git config user.email "actions@github.com"
          git add packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(battle): make accept refuse reliable on mobile"
          git push origin HEAD:reconcile/claude-main-20260825
