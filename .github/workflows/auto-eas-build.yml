name: 🚀 Auto EAS Build iOS Production

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development
      forceNewCertificate:
        description: 'Ignorer le certificat de distribution en cache (recreer meme si un certificat actif existe) -- utile si un certificat cache est corrompu, ex. p12 exporte avant le correctif -legacy'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - 'packages/mobile/**'
      - 'packages/music/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-app-store-readiness.cjs'
      - '.github/workflows/auto-eas-build.yml'

concurrency:
  group: loki-ios-signing-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build-ios:
    # Adel (19/09/2026) : "comment font les gens ... que ça coute le moins
    # cher possible" -- le depot KEEP est PUBLIC, donc GitHub offre des
    # runners macOS gratuits et illimites (normalement payants sur prive).
    # Compiler ici en local (eas build --local) evite entierement la file
    # d'attente/le quota du plan gratuit EAS Cloud Build.
    runs-on: macos-latest
    timeout-minutes: 120
    name: Build iOS ${{ inputs.profile || 'production' }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔐 Setup Expo credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "✅ Expo credentials configured"
          echo "EXPO_TOKEN is set: ${{ secrets.EXPO_TOKEN != '' }}"

      - name: Install workspace dependencies
        run: npm ci

      - name: 📥 Install EAS CLI
        run: npm install -g eas-cli@24.6.0

      - name: ✅ Validate Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Configure Apple credentials in runner only
        env:
          BUILD_PROFILE: ${{ inputs.profile || 'production' }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        working-directory: packages/mobile
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const names = ['ASC_API_KEY_P8_BASE64', 'ASC_KEY_ID', 'ASC_ISSUER_ID', 'APPLE_TEAM_ID', 'ASC_APP_ID'];
          const missing = names.filter(name => !process.env[name]?.trim());
          if (missing.length) {
            if (process.env.BUILD_PROFILE === 'production') {
              console.error('Missing GitHub secrets: ' + missing.join(', '));
              process.exit(1);
            }
            console.log('Non-production build: using existing EAS signing credentials.');
            process.exit(0);
          }
          const keyPath = path.join(process.env.RUNNER_TEMP, 'loki-asc-api-key.p8');
          const key = Buffer.from(process.env.ASC_API_KEY_P8_BASE64.trim(), 'base64');
          try {
            const parsed = crypto.createPrivateKey(key);
            if (parsed.asymmetricKeyType !== 'ec' || parsed.asymmetricKeyDetails?.namedCurve !== 'prime256v1') throw new Error();
          } catch {
            console.error('ASC_API_KEY_P8_BASE64 must encode a valid Apple P-256 private key.');
            process.exit(1);
          }
          fs.writeFileSync(keyPath, key, { mode: 0o600 });
          const value = name => process.env[name].trim();
          for (const name of names.slice(1)) {
            if (/[\r\n]/.test(value(name))) throw new Error('Invalid multiline identifier: ' + name);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, [
            'EXPO_ASC_API_KEY_PATH=' + keyPath,
            'EXPO_ASC_KEY_ID=' + value('ASC_KEY_ID'),
            'EXPO_ASC_ISSUER_ID=' + value('ASC_ISSUER_ID'),
            'EXPO_APPLE_TEAM_ID=' + value('APPLE_TEAM_ID'),
            ''
          ].join('\n'));
          if (process.env.BUILD_PROFILE === 'production') {
            const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
            eas.submit ||= {};
            eas.submit.production ||= {};
            eas.submit.production.ios = {
              ...eas.submit.production.ios,
              ascAppId: value('ASC_APP_ID'),
              appleTeamId: value('APPLE_TEAM_ID'),
              ascApiKeyPath: keyPath,
              ascApiKeyId: value('ASC_KEY_ID'),
              ascApiKeyIssuerId: value('ASC_ISSUER_ID')
            };
            fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2) + '\n');
          }
          console.log('Apple credentials configured without printing private key.');
          NODE

      - name: Verify Apple signing API access (read-only)
        if: ${{ (inputs.profile || 'production') == 'production' }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          (async () => {
            const key = fs.readFileSync(process.env.EXPO_ASC_API_KEY_PATH);
            const enc = obj => Buffer.from(JSON.stringify(obj)).toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const body = enc({alg:'ES256',kid:process.env.EXPO_ASC_KEY_ID,typ:'JWT'}) + '.' +
              enc({iss:process.env.EXPO_ASC_ISSUER_ID,iat:now-30,exp:now+300,aud:'appstoreconnect-v1'});
            const token = body + '.' + crypto.sign('sha256',Buffer.from(body),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
            async function get(route, label) {
              const response = await fetch('https://api.appstoreconnect.apple.com/v1/' + route, {
                headers: {Authorization:'Bearer '+token}, signal:AbortSignal.timeout(30000)
              });
              if (!response.ok) {
                // Never print response bodies or JWTs: a status is sufficient to identify an access blocker.
                throw new Error(label + ': Apple HTTP ' + response.status +
                  (response.status===401 ? ' (key / issuer / private key rejected)' :
                   response.status===403 ? ' (insufficient Apple permission)' : ''));
              }
              console.log(label + ': Apple HTTP 200');
              return response.json();
            }
            const app = await get('apps/6812393589','App access');
            if(app.data?.attributes?.bundleId !== 'com.adelkhatra.keep') throw new Error('Apple app bundle mismatch');
            const bundles = await get('bundleIds?filter[identifier]=com.adelkhatra.keep&limit=50','Bundle access'); const exactBundles = (bundles.data || []).filter(b => b.attributes?.identifier === 'com.adelkhatra.keep');
            if(exactBundles.length !== 1) { console.log('Bundle identifiers found via Apple prefix filter (' + (bundles.data?.length ?? 0) + '): ' + JSON.stringify((bundles.data || []).map(b => ({id: b.id, identifier: b.attributes?.identifier})))); throw new Error('Expected exactly one exact-match KEEP bundle identifier (found ' + exactBundles.length + ')'); }
            await get('certificates?filter[certificateType]=DISTRIBUTION&limit=1','Distribution certificate access');
            await get('profiles?filter[profileType]=IOS_APP_STORE&limit=1','Provisioning profile access');
            console.log('Read-only Apple API preflight passed; no signing resources created.');
          })().catch(error => { console.error(error.message); process.exitCode=1; });
          NODE

      - name: Bootstrap Loki signing in Apple and EAS
        if: ${{ (inputs.profile || 'production') == 'production' }}
        timeout-minutes: 10
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          LOKI_FORCE_NEW_CERTIFICATE: ${{ inputs.forceNewCertificate }}
        working-directory: packages/mobile
        run: |
          export NODE_PATH="$(npm root -g)"
          node - <<'NODE'
          // Pinned EAS 24.6.0 APIs: no interactive prompts and no private values in logs.
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const { createGraphqlClient } = require('eas-cli/build/commandUtils/context/contextUtils/createGraphqlClient');
          const { AppQuery } = require('eas-cli/build/graphql/queries/AppQuery');
          const ios = require('eas-cli/build/credentials/ios/api/GraphqlClient');
          const { assignBuildCredentialsAsync } = require('eas-cli/build/credentials/ios/actions/BuildCredentialsUtils');
          const { parse } = require('eas-cli/build/credentials/ios/utils/provisioningProfile');
          class SigningError extends Error {}
          const check = (value, message) => { if (!value) throw new SigningError(message); };
          let phase = 'initialisation';
          let temporaryDirectory;
          async function main() {
            const teamId = 'WTG9399DBK';
            check(process.env.EXPO_APPLE_TEAM_ID === teamId, 'Unexpected Apple team');
            check(process.env.EXPO_TOKEN, 'Missing Expo token');
            const config = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
            const projectId = 'f9598ced-2480-4fa6-8d6e-885dd4e489e8';
            check(config.extra.eas.projectId === projectId && config.ios.bundleIdentifier === 'com.adelkhatra.keep', 'Unexpected project');
            const key = fs.readFileSync(process.env.EXPO_ASC_API_KEY_PATH);
            async function apple(route, method = 'GET', data) {
              const enc = value => Buffer.from(JSON.stringify(value)).toString('base64url');
              const now = Math.floor(Date.now() / 1000);
              const body = enc({alg:'ES256',kid:process.env.EXPO_ASC_KEY_ID,typ:'JWT'}) + '.' + enc({iss:process.env.EXPO_ASC_ISSUER_ID,iat:now-30,exp:now+300,aud:'appstoreconnect-v1'});
              const token = body + '.' + crypto.sign('sha256', Buffer.from(body), {key,dsaEncoding:'ieee-p1363'}).toString('base64url');
              const response = await fetch('https://api.appstoreconnect.apple.com/v1/' + route, {
                method, headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
                body: data ? JSON.stringify({data}) : undefined, signal:AbortSignal.timeout(30000)
              });
              if (!response.ok) {
                const failure = await response.json().catch(() => ({}));
                const codes = (failure.errors || []).map(e => String(e.code || '').replace(/[^A-Z0-9_.-]/g,'')).join(',');
                throw new SigningError('Apple HTTP ' + response.status + ' ' + codes);
              }
              return response.json();
            }
            phase = 'verify Expo project';
            const graphqlClient = createGraphqlClient({accessToken:process.env.EXPO_TOKEN});
            const project = await AppQuery.byIdAsync(graphqlClient, projectId);
            check(project.ownerAccount.name === 'saleme01s-team', 'Unexpected Expo owner');
            const base = {account:project.ownerAccount,projectName:config.slug};
            const ctx = {graphqlClient,ios,nonInteractive:true};
            const targets = ['com.adelkhatra.keep','com.adelkhatra.keep.share-extension'];
            const bundles = [];
            phase = 'verify Apple app';
            const appleApp = await apple('apps/6812393589');
            check(appleApp.data.attributes.bundleId === targets[0], 'Unexpected Apple app');
            for (const bundleIdentifier of targets) {
              phase = 'resolve bundle ' + bundleIdentifier;
              const result = await apple('bundleIds?filter[identifier]=' + encodeURIComponent(bundleIdentifier) + '&limit=50');
              const exactResultData = result.data.filter(b => b.attributes?.identifier === bundleIdentifier); check(exactResultData.length <= 1, 'Ambiguous bundle identifier');
              let bundle = exactResultData[0];
              if (!bundle) {
                check(bundleIdentifier === targets[1], 'Main Apple bundle missing');
                bundle = (await apple('bundleIds','POST',{type:'bundleIds',attributes:{identifier:bundleIdentifier,name:'Loki Share Extension',platform:'IOS'}})).data;
                console.log('Registered Loki share-extension bundle.');
              }
              bundles.push(bundle);
            }
            phase = 'resolve distribution certificate';
            const portal = await apple('certificates?filter[certificateType]=DISTRIBUTION,IOS_DISTRIBUTION&limit=200');
            check(!portal.links?.next, 'Certificate list pagination requires review');
            const active = portal.data.filter(c => new Date(c.attributes.expirationDate).getTime() > Date.now()+7*86400000);
            const normalize = serial => String(serial).replace(/^0+/,'').toUpperCase();
            const forceNewCertificate = process.env.LOKI_FORCE_NEW_CERTIFICATE === 'true';
            const existing = forceNewCertificate ? [] : await ios.getDistributionCertificatesForAccountAsync(graphqlClient, base.account);
            if (forceNewCertificate) console.log('LOKI_FORCE_NEW_CERTIFICATE=true : cache de certificat ignore, creation forcee.');
            let cert = existing.find(c => c.appleTeam?.appleTeamIdentifier === teamId && c.certificateP12 && active.some(a => normalize(a.attributes.serialNumber) === normalize(c.serialNumber)));
            let portalCert;
            if (cert) {
              portalCert = active.find(a => normalize(a.attributes.serialNumber) === normalize(cert.serialNumber));
              console.log('Reusing existing valid distribution certificate; no revocation.');
            } else {
              phase = 'create distribution certificate';
              temporaryDirectory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP,'loki-signing-'));
              fs.chmodSync(temporaryDirectory,0o700);
              const keyFile = path.join(temporaryDirectory,'signing.key');
              const csrFile = path.join(temporaryDirectory,'signing.csr');
              const certFile = path.join(temporaryDirectory,'signing.der');
              const pemFile = path.join(temporaryDirectory,'signing.pem');
              const p12File = path.join(temporaryDirectory,'signing.p12');
              const password = crypto.randomBytes(32).toString('hex');
              const run = args => execFileSync('openssl',args,{stdio:'ignore',env:{...process.env,LOKI_P12_PASSWORD:password}});
              run(['req','-new','-newkey','rsa:2048','-nodes','-keyout',keyFile,'-out',csrFile,'-subj','/CN=Loki EAS Signing']);
              portalCert = (await apple('certificates','POST',{type:'certificates',attributes:{certificateType:'DISTRIBUTION',csrContent:fs.readFileSync(csrFile,'utf8')}})).data;
              console.log('Created Apple distribution certificate ID: '+portalCert.id);
              fs.writeFileSync(certFile,Buffer.from(portalCert.attributes.certificateContent,'base64'),{mode:0o600});
              const parsed = new crypto.X509Certificate(fs.readFileSync(certFile));
              check(parsed.subject.split('\n').some(line => line === 'OU='+teamId), 'Certificate team mismatch');
              run(['x509','-inform','DER','-in',certFile,'-out',pemFile]);
              run(['pkcs12','-export','-legacy','-certpbe','PBE-SHA1-3DES','-keypbe','PBE-SHA1-3DES','-macalg','sha1','-inkey',keyFile,'-in',pemFile,'-out',p12File,'-passout','env:LOKI_P12_PASSWORD']);
              phase = 'persist distribution certificate in EAS';
              cert = await ios.createDistributionCertificateAsync(graphqlClient,base.account,{
                certId:portalCert.id,certP12:fs.readFileSync(p12File).toString('base64'),certPassword:password,teamId
              });
              console.log('Distribution certificate stored in EAS.');
            }
            phase = 'resolve EAS Apple team';
            const appleTeam = await ios.createOrGetExistingAppleTeamAndUpdateNameIfChangedAsync(graphqlClient,base.account.id,{appleTeamIdentifier:teamId});
            for (let i=0;i<targets.length;i++) {
              const bundleIdentifier = targets[i];
              const app = {...base,bundleIdentifier,...(i ? {parentBundleIdentifier:targets[0]} : {})};
              phase = 'resolve profile '+bundleIdentifier;
              const current = await ios.getIosAppCredentialsWithBuildCredentialsAsync(graphqlClient,app,{iosDistributionType:'APP_STORE'});
              const prior = current?.iosAppBuildCredentialsList?.[0];
              if (prior?.distributionCertificate?.id === cert.id && prior.provisioningProfile?.developerPortalIdentifier) {
                const profile = await apple('profiles/'+prior.provisioningProfile.developerPortalIdentifier);
                if(profile.data.attributes.profileState === 'ACTIVE' && new Date(profile.data.attributes.expirationDate).getTime() > Date.now()+7*86400000) {
                  console.log('Existing active profile kept for '+bundleIdentifier);
                  continue;
                }
              }
              const profile = (await apple('profiles','POST',{type:'profiles',attributes:{name:'Loki EAS '+(i?'Share':'App')+' '+Date.now(),profileType:'IOS_APP_STORE'},relationships:{bundleId:{data:{type:'bundleIds',id:bundles[i].id}},certificates:{data:[{type:'certificates',id:portalCert.id}]}}})).data;
              const content = profile.attributes.profileContent;
              const plist = parse(content);
              check(plist.TeamIdentifier?.[0] === teamId && plist.Entitlements?.['application-identifier'] === teamId+'.'+bundleIdentifier, 'Profile team / bundle mismatch');
              check(!plist.Entitlements?.['get-task-allow'] && !plist.ProvisionedDevices && !plist.ProvisionsAllDevices, 'Not an App Store profile');
              phase = 'persist profile '+bundleIdentifier;
              const identifier = await ios.createOrGetExistingAppleAppIdentifierAsync(graphqlClient,app,appleTeam);
              const stored = await ios.createProvisioningProfileAsync(graphqlClient,app,identifier,{appleProvisioningProfile:content});
              await assignBuildCredentialsAsync(ctx,app,'APP_STORE',cert,stored,appleTeam);
              console.log('App Store signing configured in EAS for '+bundleIdentifier);
            }
            console.log('Loki signing bootstrap completed. Build and TestFlight still require separate verification.');
          }
          main().catch(error => {
            console.error('Signing bootstrap stopped during: '+phase);
            console.error(error instanceof SigningError ? error.message : 'EAS or local signing operation failed; private response details suppressed.');
            process.exitCode=1;
          }).finally(() => { if(temporaryDirectory) fs.rmSync(temporaryDirectory,{recursive:true,force:true}); });
          module.exports = { main };
          NODE

      - name: 🏗️ Build iOS local (${{ inputs.profile || 'production' }})
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: packages/mobile
        run: |
          set -euo pipefail
          profile="${{ inputs.profile || 'production' }}"
          eas build --local --platform ios --profile "$profile" --non-interactive --output "$RUNNER_TEMP/loki.ipa"

      - name: 📤 Soumettre a TestFlight
        if: ${{ (inputs.profile || 'production') == 'production' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: packages/mobile
        run: |
          set -euo pipefail
          eas submit --platform ios --path "$RUNNER_TEMP/loki.ipa" --non-interactive

      - name: 📦 Artefact .ipa (toujours conserve)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loki-ios-${{ inputs.profile || 'production' }}
          path: ${{ runner.temp }}/loki.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary Apple key
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          fs.rmSync(path.join(process.env.RUNNER_TEMP, 'loki-asc-api-key.p8'), { force: true });
          NODE

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "Workflow status: ${{ job.status }}"
          echo "A successful build does not by itself confirm availability in TestFlight."
          echo "Platform: iOS"
          echo "Profile: ${{ inputs.profile || 'production' }}"
          echo "Repository: adelkhatra-bit/KEEP"

      - name: 🔔 Notify on failure
        if: failure()
        run: |
          echo "❌ Build failed. Check the logs above for details."
          exit 1
