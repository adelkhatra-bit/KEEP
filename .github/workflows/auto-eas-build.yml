name: 🚀 Auto EAS Build iOS Production

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - 'packages/mobile/app.json'
      - 'packages/mobile/eas.json'
      - '.github/workflows/auto-eas-build.yml'

concurrency:
  group: loki-ios-signing
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  build-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: Build iOS ${{ inputs.profile || 'production' }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔐 Setup Expo credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "✅ Expo credentials configured"
          echo "EXPO_TOKEN is set: ${{ secrets.EXPO_TOKEN != '' }}"

      - name: Install workspace dependencies
        run: npm ci

      - name: 📥 Install EAS CLI
        run: npm install -g eas-cli@24.6.0

      - name: ✅ Validate Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: 🏗️ Build iOS (${{ inputs.profile || 'production' }})
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: packages/mobile
        run: eas build --platform ios --profile ${{ inputs.profile || 'production' }} --non-interactive --wait

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "Workflow status: ${{ job.status }}"
          echo "Platform: iOS"
          echo "Profile: ${{ inputs.profile || 'production' }}"
          echo "Repository: adelkhatra-bit/KEEP"