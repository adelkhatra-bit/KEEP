name: Loki App Store Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - '.github/workflows/app-store-screenshots.yml'
      - 'scripts/app-store-screenshot-contract.cjs'
      - 'scripts/app-store-screenshot-contract.test.cjs'
      - 'scripts/capture-app-store-screenshots.cjs'
      - 'scripts/upload-app-store-screenshots.cjs'
      - 'packages/mobile/src/**'
      - 'packages/mobile/e2e/journeys/fake-supabase.cjs'

concurrency:
  group: loki-app-store-screenshots
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      EXPO_PUBLIC_SUPABASE_URL: https://appstore-fixture.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: app-store-screenshot-fixture-key
      EXPO_PUBLIC_DEMO_MODE: 'false'
      EXPO_PUBLIC_KEEP_PREVIEW: '0'
      EXPO_PUBLIC_KEEP_REAL_RECOGNITION: 'false'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3010

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Chromium runner
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install chromium --with-deps
      - name: Start Loki web runtime
        working-directory: packages/mobile
        run: |
          node scripts/start-web.cjs --port 8081 --clear >/tmp/loki-appstore.log 2>&1 &
          for i in {1..120}; do
            if grep -Fq '[KEEP WEB] READY http://localhost:8081' /tmp/loki-appstore.log 2>/dev/null && curl -fsS http://127.0.0.1:8081 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/loki-appstore.log
          exit 1
      - name: Check screenshot contract
        run: node --test scripts/app-store-screenshot-contract.test.cjs
      - name: Capture actual app screens in both Apple sizes
        run: node scripts/capture-app-store-screenshots.cjs
      - name: Archive all ten validated JPEGs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loki-app-store-screenshots-${{ github.run_id }}
          path: |
            artifacts/app-store-67/*.jpg
            artifacts/app-store-65/*.jpg
          if-no-files-found: error
          retention-days: 14
      - name: Replace and verify the v1.0.0 fr-FR screenshots in App Store Connect
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: node scripts/upload-app-store-screenshots.cjs
