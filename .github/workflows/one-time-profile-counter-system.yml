name: One-time system profile counters

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - '.github/workflows/one-time-profile-counter-system.yml'
      - 'scripts/one_time_profile_counter_system_refactor.py'
      - 'packages/mobile/src/components/ProfileCounterRow.tsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply shared profile counter contract
        run: python3 scripts/one_time_profile_counter_system_refactor.py

      - name: Install dependencies
        run: npm ci

      - name: Source of truth
        run: node scripts/verify-source-of-truth.cjs

      - name: Profile integrity
        run: node scripts/verify-profile-data-integrity.cjs

      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check

      - name: Mobile tests
        run: npm --workspace packages/mobile test -- --runInBand

      - name: Export web
        working-directory: packages/mobile
        run: npx expo export --platform web --output-dir dist-web

      - name: Verify web export
        run: test -f packages/mobile/dist-web/index.html

      - name: Export iOS
        working-directory: packages/mobile
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Verify iOS export
        run: test -d packages/mobile/dist-ios && test "$(find packages/mobile/dist-ios -type f | wc -l)" -gt 0

      - name: Commit validated system profile counters
        run: |
          git config user.name "KEEP Codex"
          git config user.email "actions@github.com"
          git add packages/mobile/src/screens/ProfilePublicScreen.tsx packages/mobile/src/screens/PublicUserProfileScreen.tsx packages/mobile/share-profile.html
          git commit -m "refactor(profile): use shared counters across profile surfaces"
          git fetch origin reconcile/claude-main-20260825
          git rebase origin/reconcile/claude-main-20260825
          git push origin HEAD:reconcile/claude-main-20260825
