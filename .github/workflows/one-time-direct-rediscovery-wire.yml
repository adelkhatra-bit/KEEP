name: KEEP Direct Rediscovery Wiring

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - scripts/one_time_direct_rediscovery_wire.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - name: Sync branch
        run: git pull --rebase origin reconcile/claude-main-20260825
      - name: Apply direct rediscovery wiring
        run: python3 scripts/one_time_direct_rediscovery_wire.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Typecheck mobile
        run: npm run type-check --workspace=packages/mobile
      - name: Test mobile
        run: npm test --workspace=packages/mobile -- --runInBand
      - name: Verify rediscovery contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          service = Path('packages/mobile/src/services/keepMusicCoreRecognition.ts').read_text()
          store = Path('packages/mobile/src/store/useSessionStore.ts').read_text()
          offers = Path('packages/mobile/src/screens/OffersScreen.tsx').read_text()
          migration = Path('supabase/migrations/20260829045500_keep_direct_rediscovery_source.sql').read_text()
          required = [
            (service, 'export async function markDirectRediscovery'),
            (service, "supabase.rpc('keep_mark_direct_rediscovery'"),
            (store, 'markDirectRediscovery'),
            (store, 'match?.decisionId && match?.trackId'),
            (store, "source: 'listen'"),
            (migration, 'previousSocialOriginUserId'),
            (offers, 'Tes découvertes peuvent faire grandir ton profil.'),
            (offers, 'ton pseudo reste visible et cliquable sur les 20 copies'),
          ]
          missing = [needle for haystack, needle in required if needle not in haystack]
          if missing:
            raise SystemExit('Missing direct rediscovery contract: ' + repr(missing))
          PY
      - name: Commit verified source and cleanup
        run: |
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          git add packages/mobile/src/services/keepMusicCoreRecognition.ts packages/mobile/src/store/useSessionStore.ts packages/mobile/src/screens/OffersScreen.tsx
          git rm .github/workflows/one-time-direct-rediscovery-wire.yml scripts/one_time_direct_rediscovery_wire.py
          git commit -m "fix(listen): preserve discovery visibility chain"
          git pull --rebase origin reconcile/claude-main-20260825
          git push origin HEAD:reconcile/claude-main-20260825
