name: KEEP — One-shot Super Admin role UI alignment

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - .github/workflows/one-shot-admin-user-role-ui.yml

permissions:
  contents: write

concurrency:
  group: keep-one-shot-admin-user-role-ui
  cancel-in-progress: true

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - name: Sync branch
        run: git pull --ff-only origin reconcile/claude-main-20260825
      - name: Align visible user controls with backend roles
        shell: python
        run: |
          from pathlib import Path
          p = Path('packages/admin/pages/users.tsx')
          s = p.read_text(encoding='utf-8')
          def once(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'Expected exactly one match, got {n}: {old[:90]!r}')
              s = s.replace(old, new, 1)

          once(
              "type PaidPlan = 'PREMIUM' | 'CREATOR_PRO' | 'VENUE_PRO';",
              "type PaidPlan = 'PREMIUM' | 'CREATOR_PRO' | 'VENUE_PRO';\ntype AdminRole = 'SUPER_ADMIN' | 'ADMIN' | 'SUPPORT' | 'MODERATOR';",
          )
          once(
              "  const [message, setMessage] = useState<string | null>(null);",
              "  const [message, setMessage] = useState<string | null>(null);\n  const [adminRole, setAdminRole] = useState<AdminRole | null>(null);",
          )
          once(
              "  useEffect(() => { void load(); }, []);",
              "  useEffect(() => { void load(); }, []);\n  useEffect(() => {\n    if (!supabase) return;\n    void supabase.rpc('get_my_admin_role').then(\n      ({ data }) => {\n        const role = String(data || '') as AdminRole;\n        setAdminRole(['SUPER_ADMIN','ADMIN','SUPPORT','MODERATOR'].includes(role) ? role : null);\n      },\n      () => setAdminRole(null),\n    );\n  }, []);",
          )
          once(
              "  const toggleRequirement = (key: string) => setRequirements((current) => current.includes(key) ? current.filter((item) => item !== key) : [...current, key]);\n\n  return <AdminLayout>",
              "  const toggleRequirement = (key: string) => setRequirements((current) => current.includes(key) ? current.filter((item) => item !== key) : [...current, key]);\n  const canRequirements = adminRole === 'SUPER_ADMIN' || adminRole === 'ADMIN' || adminRole === 'SUPPORT';\n  const canGrant = adminRole === 'SUPER_ADMIN' || adminRole === 'ADMIN';\n  const canModerateDiscovery = adminRole === 'SUPER_ADMIN' || adminRole === 'ADMIN' || adminRole === 'MODERATOR';\n  const canBlock = adminRole === 'SUPER_ADMIN' || adminRole === 'ADMIN';\n  const canDestruct = adminRole === 'SUPER_ADMIN';\n\n  return <AdminLayout>",
          )
          once(
              "    <details style={{marginTop:18}}><summary style={{cursor:'pointer',color:'var(--text-muted)'}}>Récupérer un ancien profil de test</summary>",
              "    <details style={{marginTop:18,display:canRequirements?'block':'none'}}><summary style={{cursor:'pointer',color:'var(--text-muted)'}}>Récupérer un ancien profil de test</summary>",
          )
          once(
              "          <div style={{marginTop:18,borderTop:'1px solid var(--border)',paddingTop:16}}>\n            <h3 style={{margin:'0 0 6px'}}>Accès au compte</h3>",
              "          <div style={{marginTop:18,borderTop:'1px solid var(--border)',paddingTop:16,display:canDestruct?'block':'none'}}>\n            <h3 style={{margin:'0 0 6px'}}>Accès au compte</h3>",
          )
          once(
              "          <div style={{marginTop:18,borderTop:'1px solid var(--border)',paddingTop:16}}>\n            <h3 style={{margin:'0 0 4px'}}>À imposer à cet utilisateur</h3>",
              "          <div style={{marginTop:18,borderTop:'1px solid var(--border)',paddingTop:16,display:canRequirements?'block':'none'}}>\n            <h3 style={{margin:'0 0 4px'}}>À imposer à cet utilisateur</h3>",
          )
          once(
              "          <div style={{marginTop:18,borderTop:'1px solid var(--border)',paddingTop:16}}>\n            <h3 style={{margin:'0 0 10px'}}>Abonnement offert</h3>",
              "          <div style={{marginTop:18,borderTop:'1px solid var(--border)',paddingTop:16,display:canGrant?'block':'none'}}>\n            <h3 style={{margin:'0 0 10px'}}>Abonnement offert</h3>",
          )
          once(
              "          <div style={{marginTop:18,borderTop:'1px solid var(--border)',paddingTop:16}}>\n            <h3 style={{margin:'0 0 5px'}}>Visibilité Découvertes</h3>",
              "          <div style={{marginTop:18,borderTop:'1px solid var(--border)',paddingTop:16,display:canModerateDiscovery?'block':'none'}}>\n            <h3 style={{margin:'0 0 5px'}}>Visibilité Découvertes</h3>",
          )
          once(
              "          <div style={{marginTop:18,borderTop:'1px solid var(--border)',paddingTop:16,display:'flex',gap:8,flexWrap:'wrap'}}>\n            <button onClick={()=>void toggleBlocked()} disabled={busy!==null}>{isBanned(snapshot.auth.bannedUntil)?'Débloquer le compte':'Bloquer le compte'}</button>\n            <button onClick={()=>void deleteUser()} disabled={busy!==null} style={{background:'#7a1f2a'}}>Supprimer définitivement</button>",
              "          <div style={{marginTop:18,borderTop:'1px solid var(--border)',paddingTop:16,display:(canBlock||canDestruct)?'flex':'none',gap:8,flexWrap:'wrap'}}>\n            <button onClick={()=>void toggleBlocked()} disabled={busy!==null} style={{display:canBlock?'inline-block':'none'}}>{isBanned(snapshot.auth.bannedUntil)?'Débloquer le compte':'Bloquer le compte'}</button>\n            <button onClick={()=>void deleteUser()} disabled={busy!==null} style={{background:'#7a1f2a',display:canDestruct?'inline-block':'none'}}>Supprimer définitivement</button>",
          )
          p.write_text(s, encoding='utf-8')
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/one-shot-admin-user-role-ui.yml
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Typecheck all workspaces
        run: npm run type-check
      - name: Commit exact role UI alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          git add packages/admin/pages/users.tsx .github/workflows/one-shot-admin-user-role-ui.yml
          git diff --cached --check
          git commit -m "fix(admin): align user actions with admin roles"
          git pull --rebase origin reconcile/claude-main-20260825
          git push origin HEAD:reconcile/claude-main-20260825
