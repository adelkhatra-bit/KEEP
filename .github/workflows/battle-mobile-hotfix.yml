name: Loki Battle Mobile Hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - '.github/workflows/battle-mobile-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - name: Apply Battle mobile hotfix
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('packages/mobile/src/components/KeepBattleMobileGameV3.tsx')
          s = p.read_text()

          # 1) Toute décision REFUSER doit être explicitement confirmée.
          old = "  const respond = async (item: KeepBattleIncomingChallenge, accept: boolean) => {"
          if old in s:
              s = s.replace(old, "  const commitBattleChallengeDecision = async (item: KeepBattleIncomingChallenge, accept: boolean) => {", 1)
              anchor = """    } finally {
      setRespondingChallengeId(null);
    }
  };

  // Adel (03/09/2026) : "quand j'appuie sur revanche"""
              replacement = """    } finally {
      setRespondingChallengeId(null);
    }
  };

  const respond = (item: KeepBattleIncomingChallenge, accept: boolean) => {
    if (accept) {
      void commitBattleChallengeDecision(item, true);
      return;
    }
    if (respondingChallengeId) return;
    Alert.alert(
      'Refuser ce Battle ?',
      `Confirme uniquement si tu veux réellement refuser l’invitation de ${item.username}.`,
      [
        { text: 'ANNULER', style: 'cancel' },
        { text: 'REFUSER', style: 'destructive', onPress: () => { void commitBattleChallengeDecision(item, false); } },
      ],
    );
  };

  // Adel (03/09/2026) : "quand j'appuie sur revanche"""
              if anchor not in s:
                  raise SystemExit('respond wrapper anchor missing')
              s = s.replace(anchor, replacement, 1)
          elif "const commitBattleChallengeDecision" not in s:
              raise SystemExit('respond function not found')

          # 2) Même grand carré Solo/Battle, réponses au plus bas sans espace noir.
          replacements = {
              "arenaScrollContentActive: { flexGrow: 1, paddingBottom: 2 },":
                "arenaScrollContentActive: { flexGrow: 1, paddingBottom: 0 },",
              "arenaCardActive: { flexGrow: 1, justifyContent: 'flex-start' },":
                "arenaCardActive: { flexGrow: 1, justifyContent: 'flex-start', paddingHorizontal: 2, paddingTop: 2, paddingBottom: 2 },",
              "soloCardActive: { flexGrow: 1, justifyContent: 'flex-start' },":
                "soloCardActive: { flexGrow: 1, justifyContent: 'flex-start', paddingHorizontal: 2, paddingTop: 2, paddingBottom: 2 },",
              "soloAnswersActive: { marginTop: 'auto', paddingTop: 6, paddingBottom: 0 },":
                "soloAnswersActive: { marginTop: 'auto', paddingTop: 8, paddingBottom: 0 },",
              "arenaAnswersActive: { marginTop: 'auto', paddingTop: 6, paddingBottom: 0 },":
                "arenaAnswersActive: { marginTop: 'auto', paddingTop: 8, paddingBottom: 0 },",
          }
          for a,b in replacements.items():
              if a in s:
                  s = s.replace(a,b,1)
              elif b not in s:
                  raise SystemExit('layout anchor missing: '+a)

          p.write_text(s)
          PY

      - name: Verify Battle source contract
        run: |
          grep -q "const commitBattleChallengeDecision" packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          grep -q "Refuser ce Battle ?" packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          grep -q "arenaCardActive: { flexGrow: 1, justifyContent: 'flex-start', paddingHorizontal: 2" packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          grep -q "arenaAnswersActive: { marginTop: 'auto'" packages/mobile/src/components/KeepBattleMobileGameV3.tsx

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "Loki CI"
          git config user.email "actions@users.noreply.github.com"
          git add packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          git commit -m "fix(battle): confirm declines and tighten mobile round layout"
          git push origin HEAD:reconcile/claude-main-20260825
