name: KEEP — Sync Expo Application dependency

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - '.github/push-env-dependency-trigger'

permissions:
  contents: write

concurrency:
  group: keep-sync-expo-application
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install SDK-compatible expo-application
        run: npm install expo-application@~7.0.8 --workspace packages/mobile --save
      - name: Commit lockfile and package manifest
        run: |
          if git diff --quiet -- packages/mobile/package.json package-lock.json; then
            echo "Dependency already synchronized."
            exit 0
          fi
          git config user.name "keep-ci-bot"
          git config user.email "keep-ci-bot@users.noreply.github.com"
          git add packages/mobile/package.json package-lock.json
          git commit -m "fix(push): add native APNs environment detection"
          git push origin HEAD:reconcile/claude-main-20260825
