name: KEEP Battle style room patch

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - '.github/workflows/keep-battle-invite-pause-dedupe-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Battle style rooms
        env:
          PATCH_B64: ""
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Verify Battle style-room contract
        run: |
          npm ci
          npm --workspace packages/mobile run type-check
          npm --workspace packages/mobile test -- --runInBand KeepBattleMobileGameV3.compact.test.ts
      - name: Commit style rooms
        run: |
          git config user.name 'KEEP Guardian'
          git config user.email 'actions@github.com'
          git add packages/mobile/src/components/KeepBattleMobileGameV3.tsx packages/mobile/src/components/__tests__/KeepBattleMobileGameV3.compact.test.ts
          git commit -m 'feat(battle): match players by music style rooms'
          git push origin HEAD:reconcile/claude-main-20260825
