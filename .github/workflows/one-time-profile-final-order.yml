name: KEEP — One-time Profile Final Order

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - .github/workflows/one-time-profile-final-order.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - run: git pull --ff-only origin reconcile/claude-main-20260825
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply final owner order
        run: python3 scripts/one_time_profile_final_order.py
      - name: Install
        run: npm ci --ignore-scripts
      - name: Verify hierarchy contract
        run: node packages/mobile/scripts/verify-profile-hierarchy.cjs
      - name: Verify text contrast
        run: node scripts/verify-mobile-text-contrast.cjs
      - name: Verify source of truth
        run: node scripts/verify-source-of-truth.cjs
      - name: Typecheck mobile
        run: npm --workspace packages/mobile run type-check
      - name: Mobile tests
        run: npm --workspace packages/mobile test -- --runInBand
      - name: Commit final order
        run: |
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          git add packages/mobile/src/screens/ProfilePublicScreen.tsx packages/mobile/scripts/verify-profile-hierarchy.cjs
          git rm .github/workflows/one-time-profile-final-order.yml
          git rm scripts/one_time_profile_final_order.py
          git commit -m "fix(profile): finalize owner content hierarchy"
          git pull --rebase origin reconcile/claude-main-20260825
          git push origin HEAD:reconcile/claude-main-20260825
