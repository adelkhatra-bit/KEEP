name: Loki Battle Mobile Audit

on:
  workflow_dispatch:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - '.github/workflows/loki-battle-mobile-audit.yml'
      - 'packages/mobile/src/components/KeepBattleMobileGameV3.tsx'
      - 'packages/mobile/src/components/GlobalNotificationBanner.tsx'
      - 'packages/mobile/src/screens/PartiesScreen.tsx'
      - 'packages/mobile/src/services/battleHomeInfo.ts'
      - 'packages/mobile/src/services/keepBattleExperienceService.ts'
      - 'packages/mobile/src/services/lokiSpeechService.ts'
      - 'packages/mobile/src/services/gameExitGuard.ts'
      - 'packages/mobile/src/store/useGameSessionStore.ts'
      - 'packages/mobile/src/navigation/navigationRef.ts'
      - 'packages/mobile/src/services/pushNotificationService.ts'
      - 'packages/mobile/src/components/__tests__/KeepBattleMobileGameV3.compact.test.ts'
      - 'packages/mobile/src/services/__tests__/pushNotificationService.directSupabase.test.ts'
      - 'packages/mobile/src/screens/__tests__/BattleNotificationActions.contract.test.ts'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm --workspace packages/mobile run type-check
      - name: Desktop web export
        working-directory: packages/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: 'https://rrhqsqzcplvmwxizqnla.supabase.co'
          EXPO_PUBLIC_SUPABASE_ANON_KEY: 'sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru'
          EXPO_PUBLIC_WEB_URL: 'https://adelkhatra-bit.github.io/KEEP'
          EXPO_PUBLIC_AUTH_REDIRECT_URL: 'https://adelkhatra-bit.github.io/KEEP/'
          EXPO_PUBLIC_API_URL: 'https://keep-backend-mu.vercel.app'
        run: |
          npx expo export --platform web --output-dir web-dist
          test -s web-dist/index.html
          grep -q '<div id="root"' web-dist/index.html
      - name: Battle and push regression tests
        run: |
          npm --workspace packages/mobile test -- --runInBand             KeepBattleMobileGameV3.compact.test.ts             BattleNotificationActions.contract.test.ts             pushNotificationService.directSupabase.test.ts
