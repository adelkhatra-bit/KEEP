name: KEEP — One-shot compact profile header

on:
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - .github/workflows/one-shot-profile-header-compact.yml

permissions:
  contents: write

concurrency:
  group: keep-one-shot-profile-header-compact
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - name: Sync latest branch head
        run: git pull --ff-only origin reconcile/claude-main-20260825

      - name: Apply compact profile header
        run: python3 scripts/one_shot_profile_header_compact.py

      - name: Remove one-shot files
        run: rm -f scripts/one_shot_profile_header_compact.py .github/workflows/one-shot-profile-header-compact.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck mobile
        run: npm run type-check --workspace=packages/mobile

      - name: Typecheck music
        run: npm run type-check --workspace=packages/music

      - name: Typecheck admin
        run: npm run type-check --workspace=packages/admin

      - name: Commit compact profile header
        run: |
          git config user.name "KEEP QA Bot"
          git config user.email "keep-qa-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat(profile): compact own header and move share action"
            git pull --rebase origin reconcile/claude-main-20260825
            git push origin HEAD:reconcile/claude-main-20260825
          fi
