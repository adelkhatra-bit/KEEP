name: App Store — fiche, precheck et soumission

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'precheck, listing ou submit'
        required: true
        default: 'precheck'
        type: choice
        options:
          - precheck
          - listing
          - submit
  push:
    branches:
      - reconcile/claude-main-20260825
    paths:
      - 'packages/mobile/.app-store-submit-trigger'
      - 'packages/mobile/fastlane/Fastfile'
      - '.github/workflows/app-store-submit.yml'

concurrency:
  group: app-store-submit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  app-store:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      ASC_APP_VERSION: '1.0.0'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve lane
        id: lane
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            lane="${{ github.event.inputs.lane }}"
          else
            lane="$(tr -d '[:space:]' < packages/mobile/.app-store-submit-trigger)"
          fi
          case "$lane" in
            precheck|listing|submit) ;;
            *) echo "::error::Lane invalide: $lane"; exit 1 ;;
          esac
          resolved_lane="$lane"
          if [ "$lane" = "precheck" ]; then resolved_lane="validate"; fi
          echo "requested_lane=$lane" >> "$GITHUB_OUTPUT"
          echo "lane=$resolved_lane" >> "$GITHUB_OUTPUT"
          echo "Lane App Store: $lane -> fastlane ios $resolved_lane"

      - name: Verify Apple API secrets
        shell: bash
        run: |
          missing=0
          for v in ASC_API_KEY_P8_BASE64 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID ASC_APP_ID; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret manquant: $v"
              missing=1
            fi
          done
          [ "$missing" = "0" ]

      - name: Verify App Store subscription products
        shell: bash
        run: |
          node - <<'NODE'
          const crypto = require('node:crypto');
          (async () => {
            const privateKey = Buffer.from(process.env.ASC_API_KEY_P8_BASE64.trim(), 'base64');
            const keyId = String(process.env.ASC_KEY_ID || '').trim();
            const issuerId = String(process.env.ASC_ISSUER_ID || '').trim();
            const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const unsigned = encode({ alg: 'ES256', kid: keyId, typ: 'JWT' }) + '.' +
              encode({ iss: issuerId, iat: now - 30, exp: now + 300, aud: 'appstoreconnect-v1' });
            const jwt = unsigned + '.' + crypto.sign('sha256', Buffer.from(unsigned), { key: privateKey, dsaEncoding: 'ieee-p1363' }).toString('base64url');
            const headers = { Authorization: 'Bearer ' + jwt };
            const appsUrl = new URL('https://api.appstoreconnect.apple.com/v1/apps');
            appsUrl.searchParams.set('filter[bundleId]', 'com.adelkhatra.keep');
            appsUrl.searchParams.set('fields[apps]', 'bundleId,name');
            const appsResponse = await fetch(appsUrl, { headers, signal: AbortSignal.timeout(30000) });
            if (!appsResponse.ok) throw new Error('App Store apps API HTTP ' + appsResponse.status + ': ' + (await appsResponse.text()).slice(0, 300));
            const appsPayload = await appsResponse.json();
            const app = (appsPayload.data || []).find(item => item.attributes?.bundleId === 'com.adelkhatra.keep');
            if (!app?.id) throw new Error('App com.adelkhatra.keep introuvable dans App Store Connect');
            const url = new URL('https://api.appstoreconnect.apple.com/v1/apps/' + encodeURIComponent(app.id) + '/subscriptionGroups');
            url.searchParams.set('include', 'subscriptions');
            url.searchParams.set('fields[subscriptions]', 'productId,state');
            url.searchParams.set('limit', '200');
            url.searchParams.set('limit[subscriptions]', '50');
            const response = await fetch(url, { headers, signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error('App Store subscriptions API HTTP ' + response.status + ': ' + (await response.text()).slice(0, 300));
            const payload = await response.json();
            const subs = (payload.included || []).filter(item => item.type === 'subscriptions');
            const byProduct = new Map(subs.map(item => [item.attributes?.productId, item.attributes?.state]));
            const expected = [
              'com.adelkhatra.keep.premium.monthly',
              'com.adelkhatra.keep.creatorpro.monthly',
              'com.adelkhatra.keep.venuepro.monthly',
            ];
            const missing = expected.filter(id => !byProduct.has(id));
            if (missing.length) throw new Error('Abonnements App Store manquants: ' + missing.join(', '));
            const badStates = new Set(['MISSING_METADATA','DEVELOPER_ACTION_NEEDED','REJECTED']);
            const blocked = expected.filter(id => badStates.has(String(byProduct.get(id) || '')));
            if (blocked.length) throw new Error('Abonnements App Store non prêts: ' + blocked.map(id => id + '=' + byProduct.get(id)).join(', '));
            console.log('App Store subscriptions OK: ' + expected.map(id => id + '=' + byProduct.get(id)).join(', '));
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE

      - name: Setup Ruby
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Run App Store lane
        working-directory: packages/mobile
        run: fastlane ios "${{ steps.lane.outputs.lane }}"

      - name: Summary
        if: always()
        run: |
          echo "### Loki Music — App Store" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lane: ${{ steps.lane.outputs.lane }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $ASC_APP_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
