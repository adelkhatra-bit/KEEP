name: KEEP verify targeted fixes once

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths: ['.github/workflows/verify-targeted-fixes-once.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://rrhqsqzcplvmwxizqnla.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru
      EXPO_PUBLIC_KEEP_REAL_RECOGNITION: 'true'
      EXPO_PUBLIC_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Type-check mobile
        run: npm run type-check --workspace=packages/mobile

      - name: Type-check all workspaces
        run: npm run type-check --workspaces --if-present

      - name: Export web bundle
        working-directory: packages/mobile
        run: npx expo export --platform web --output-dir dist-verify

      - name: Guard protected design files
        shell: bash
        run: |
          git diff eea0c5787fe4b44161c5c8abb2703c4ef7006dcb...HEAD -- packages/mobile/App.tsx packages/mobile/src/navigation/Navigation.tsx > /tmp/protected.diff
          test ! -s /tmp/protected.diff || { cat /tmp/protected.diff; exit 1; }

      - name: Verify isolation and social markers exist
        shell: bash
        run: |
          grep -q "carryGuestKeeps" packages/mobile/src/components/UsernameAccountForm.tsx
          grep -q "isSocialCopy" packages/mobile/src/services/keepTrackAction.ts
          grep -q "UTILISATEUR · @" packages/mobile/src/screens/ProfilePublicScreen.tsx
          grep -q "CommunityConnectionsPanel" packages/mobile/src/screens/DiscoverScreen.tsx
          grep -q "backgroundColor: colors.primary" packages/mobile/src/screens/SessionHistoryScreen.tsx

      - name: Remove one-shot workflow and keep source clean
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/verify-targeted-fixes-once.yml
          git config user.name "KEEP Verify Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): remove one-shot targeted verification"
          git push origin HEAD:reconcile/claude-main-20260825
