name: KEEP — Vérification migrations SQL (PostgreSQL réel)

# Aucun secret nécessaire : ce workflow utilise un vrai service PostgreSQL 16,
# applique toutes les migrations présentes dans supabase/migrations, puis
# exécute les assertions métier réelles (triggers, cohérence devise, RLS,
# confidentialité Public/Privé, suppression KEEP et invitation ami préremplie).
# La branche de travail unique KEEP est la seule source active.

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - "supabase/migrations/**"
      - "supabase/scripts/**"
      - ".github/workflows/verify-migrations.yml"
  pull_request:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - "supabase/migrations/**"
      - "supabase/scripts/**"
      - ".github/workflows/verify-migrations.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Vérifier les migrations + triggers + RLS
        shell: bash
        run: |
          set +e
          bash supabase/scripts/verify-migrations.sh 2>&1 | tee verify-migrations.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Vérifier confidentialité Public / Privé
        shell: bash
        run: |
          set +e
          bash supabase/scripts/verify-profile-privacy.sh 2>&1 | tee verify-profile-privacy.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Vérifier suppression KEEP de bout en bout
        shell: bash
        run: |
          set +e
          bash supabase/scripts/verify-keep-delete.sh 2>&1 | tee verify-keep-delete.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Vérifier invitation ami préremplie
        shell: bash
        run: |
          set +e
          bash supabase/scripts/verify-referral-profile-link.sh 2>&1 | tee verify-referral-profile-link.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Conserver les diagnostics SQL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-migrations-log
          path: |
            verify-migrations.log
            verify-profile-privacy.log
            verify-keep-delete.log
            verify-referral-profile-link.log
          if-no-files-found: ignore
          retention-days: 2
