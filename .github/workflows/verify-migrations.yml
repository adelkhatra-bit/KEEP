name: KEEP — Vérification migrations SQL (PostgreSQL réel)

# Aucun secret nécessaire : ce workflow utilise un vrai service PostgreSQL 16,
# applique toutes les migrations présentes dans supabase/migrations, puis
# exécute les assertions métier réelles (triggers, cohérence devise, RLS).
# La branche de travail unique KEEP est la seule source active.

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - "supabase/migrations/**"
      - "supabase/scripts/verify-migrations.sh"
      - ".github/workflows/verify-migrations.yml"
  pull_request:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - "supabase/migrations/**"
      - "supabase/scripts/verify-migrations.sh"
      - ".github/workflows/verify-migrations.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les migrations + triggers + RLS
        run: bash supabase/scripts/verify-migrations.sh
