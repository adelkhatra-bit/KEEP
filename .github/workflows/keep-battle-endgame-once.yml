name: KEEP Battle endgame

on:
  push:
    paths:
      - '.github/workflows/keep-battle-endgame-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add endgame screens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/mobile/src/components/KeepBattleMobileGameV3.tsx')
          s = p.read_text()

          s = s.replace(
            "import { KeepBattleArenaState, KeepBattleTheme, loadKeepBattleArena, loadKeepBattleThemes, startKeepBattleArena, submitKeepBattleArenaQuizAnswer, subscribeKeepBattleArena } from '../services/keepBattleService';",
            "import { buildKeepBattleArenaInviteLink, KeepBattleArenaState, KeepBattleTheme, loadKeepBattleArena, loadKeepBattleThemes, startKeepBattleArena, submitKeepBattleArenaQuizAnswer, subscribeKeepBattleArena } from '../services/keepBattleService';"
          )

          s = s.replace("  const [soloScore, setSoloScore] = React.useState(0);", "  const [soloScore, setSoloScore] = React.useState(0);\n  const [soloFinished, setSoloFinished] = React.useState(false);")
          s = s.replace("  const versusScale = React.useRef(new Animated.Value(.72)).current;", "  const versusScale = React.useRef(new Animated.Value(.72)).current;\n  const celebrationOpacity = React.useRef(new Animated.Value(0)).current;\n  const celebrationScale = React.useRef(new Animated.Value(.72)).current;")

          marker = "  React.useEffect(() => { void loadKeepBattleThemes().then((rows) => rows.length && setThemes(rows)).catch(() => {}); }, []);"
          insert = """  const celebrate = React.useCallback(() => {\n    celebrationOpacity.setValue(0);\n    celebrationScale.setValue(.72);\n    Animated.sequence([\n      Animated.parallel([\n        Animated.timing(celebrationOpacity, { toValue: 1, duration: 220, useNativeDriver: true }),\n        Animated.spring(celebrationScale, { toValue: 1.08, friction: 4, tension: 90, useNativeDriver: true }),\n      ]),\n      Animated.spring(celebrationScale, { toValue: 1, friction: 5, tension: 80, useNativeDriver: true }),\n    ]).start();\n  }, [celebrationOpacity, celebrationScale]);\n\n"""
          if insert not in s:
              s = s.replace(marker, insert + marker)

          s = s.replace("""  React.useEffect(() => {
    if (!solo || !soloAnswer || soloIndex >= solo.rounds.length - 1) return undefined;
    const id = setTimeout(() => { setSoloIndex((v) => v + 1); setSoloAnswer(null); }, 950);
    return () => clearTimeout(id);
  }, [solo, soloAnswer, soloIndex]);""", """  React.useEffect(() => {
    if (!solo || !soloAnswer) return undefined;
    if (soloIndex >= solo.rounds.length - 1) {
      const id = setTimeout(() => { setSoloFinished(true); celebrate(); }, 950);
      return () => clearTimeout(id);
    }
    const id = setTimeout(() => { setSoloIndex((v) => v + 1); setSoloAnswer(null); }, 950);
    return () => clearTimeout(id);
  }, [solo, soloAnswer, soloIndex, celebrate]);""")

          s = s.replace("setArena(null); setBrowseOnline(false); setSolo(pack); setSoloIndex(0); setSoloAnswer(null); setSoloScore(0); setSoloStartedAt(0); setAudioReady(false); setHandledOutgoingId('');", "setArena(null); setBrowseOnline(false); setSolo(pack); setSoloIndex(0); setSoloAnswer(null); setSoloScore(0); setSoloFinished(false); setSoloStartedAt(0); setAudioReady(false); setHandledOutgoingId('');")

          share_marker = """  const shareInvite = React.useCallback(async () => {
    await Share.share({ message: `Viens me défier sur KEEP Battle ⚡\\n10 secondes · 3 choix · gagne des Free\\n${KEEP_BATTLE_SHARE}` });
  }, []);"""
          share_insert = share_marker + """\n\n  const shareArenaInvite = React.useCallback(async (state: KeepBattleArenaState) => {\n    const link = buildKeepBattleArenaInviteLink(state.arenaCode);\n    await Share.share({ message: `Rejoins notre KEEP Battle ⚡\\n${state.seats.length} joueur${state.seats.length > 1 ? 's' : ''} déjà dans le groupe\\n${link}` });\n  }, []);"""
          if "const shareArenaInvite" not in s:
              s = s.replace(share_marker, share_insert)

          s = s.replace("if (!arena || arena.status !== 'WAITING' || !arena.isHost || arena.seats.length < 2) return undefined;", "if (!arena || arena.status !== 'WAITING' || arena.lastResult || arena.seats.length < 2) return undefined;")

          solo_return = """    const pct = audioReady ? (soloRemaining / ROUND_MS) * 100 : 100;
    return <View style={s.root}>"""
          solo_end = """    const pct = audioReady ? (soloRemaining / ROUND_MS) * 100 : 100;
    if (soloFinished) {
      const perfect = soloScore === solo.rounds.length;
      return <View style={s.root}>
        <View style={s.header}><TouchableOpacity style={s.back} onPress={() => { setSoloFinished(false); setSolo(null); void leaveSoloBattle().catch(() => {}); }}><Text style={s.backText}>‹</Text></TouchableOpacity><View style={s.headerMid}><Text style={s.kicker}>KEEP BATTLE</Text><Text style={s.title}>PARTIE TERMINÉE</Text></View><Text style={s.round}>8/8</Text></View>
        <Animated.View style={[s.finishHero, { opacity: celebrationOpacity, transform: [{ scale: celebrationScale }] }]}>
          <Text style={s.finishSpark}>✦  ⚡  ✦</Text>
          <Text style={s.finishTrophy}>{perfect ? '👑' : soloScore >= 6 ? '🏆' : '⚡'}</Text>
          <Text style={s.finishTitle}>{perfect ? 'PARFAIT · 8/8' : `${soloScore}/8`}</Text>
          <Text style={s.finishSub}>{perfect ? 'Aucune erreur. KEEP BATTLE MASTER.' : soloScore >= 6 ? 'Très gros score.' : soloScore >= 4 ? 'Bien joué. Tu peux faire mieux.' : 'Repars immédiatement pour prendre ta revanche.'}</Text>
          <View style={s.finishScore}><Text style={s.finishScoreBig}>{soloScore}</Text><Text style={s.finishScoreSlash}> / 8</Text></View>
        </Animated.View>
        <Text style={s.finishQuestion}>Que souhaites-tu faire ?</Text>
        <TouchableOpacity style={s.finishPrimary} onPress={() => { setSoloFinished(false); setSolo(null); void startSolo(); }}><Text style={s.finishPrimaryText}>REFAIRE UNE PARTIE</Text></TouchableOpacity>
        {enabled ? <TouchableOpacity style={s.finishSecondary} onPress={() => { setSoloFinished(false); void openOnline(); }}><Text style={s.finishSecondaryText}>DÉFIER UN JOUEUR</Text></TouchableOpacity> : null}
        <TouchableOpacity style={s.finishSecondary} onPress={() => { void shareInvite(); }}><Text style={s.finishSecondaryText}>INVITER UN AMI</Text></TouchableOpacity>
      </View>;
    }
    return <View style={s.root}>"""
          if solo_return not in s:
              raise SystemExit('solo return marker not found')
          s = s.replace(solo_return, solo_end)

          arena_marker = """    const versusLabel = players.length > 2 ? `ÉQUIPE A (${teamA.length}) VS ÉQUIPE B (${teamB.length})` : `${first ? `@${first.username}` : 'KEEP'} VS ${second ? `@${second.username}` : 'KEEP'}`;
    return <View style={s.root}>"""
          arena_end = """    const versusLabel = players.length > 2 ? `ÉQUIPE A (${teamA.length}) VS ÉQUIPE B (${teamB.length})` : `${first ? `@${first.username}` : 'KEEP'} VS ${second ? `@${second.username}` : 'KEEP'}`;
    if (arena.status === 'WAITING' && arena.lastResult) {
      const winner = arena.lastWinner;
      return <View style={s.root}>
        <View style={s.header}><TouchableOpacity style={s.back} onPress={() => { setArena(null); void stopTrackPreview(); }}><Text style={s.backText}>‹</Text></TouchableOpacity><View style={s.headerMid}><Text style={s.kicker}>KEEP BATTLE · FIN DU MATCH</Text><Text style={s.title}>{themeLabel(arena.themeCode)}</Text></View><Text style={s.round}>{arena.seats.length}J</Text></View>
        <Animated.View style={[s.finishHero, { opacity: celebrationOpacity, transform: [{ scale: celebrationScale }] }]}>
          <Text style={s.finishSpark}>✦  👑  ✦</Text>
          {winner ? <Avatar name={winner.username} url={winner.avatarUrl} size={72} /> : <Text style={s.finishTrophy}>🏆</Text>}
          <Text style={s.finishTitle}>{winner ? `@${winner.username}` : 'BATTLE TERMINÉ'}</Text>
          <Text style={s.finishSub}>{winner ? 'remporte ce Battle' : 'Résultat enregistré'}</Text>
          <View style={s.finishScore}><Text style={s.finishScoreBig}>{arena.lastResult.score}</Text><Text style={s.finishScoreSlash}> pts</Text></View>
          <Text style={arena.lastResult.won ? s.finishWon : s.finishLost}>{arena.lastResult.won ? `+${arena.lastResult.creditDelta} FREE · GAGNÉ` : `${arena.lastResult.creditDelta} FREE · MATCH TERMINÉ`}</Text>
        </Animated.View>
        <Text style={s.finishQuestion}>Le groupe reste ensemble. Et maintenant ?</Text>
        <TouchableOpacity style={s.finishPrimary} onPress={() => { setBusy(true); void startKeepBattleArena(arena.id).then((next) => { setArena(next); animateVersus(); }).catch((e: any) => Alert.alert('Battle', String(e?.message || 'Impossible de relancer.'))).finally(() => setBusy(false)); }}><Text style={s.finishPrimaryText}>{busy ? 'PRÉPARATION…' : 'REVANCHE'}</Text></TouchableOpacity>
        {arena.openSeats > 0 ? <TouchableOpacity style={s.finishSecondary} onPress={() => { void shareArenaInvite(arena); }}><Text style={s.finishSecondaryText}>AJOUTER UN JOUEUR · {arena.openSeats} PLACE{arena.openSeats > 1 ? 'S' : ''}</Text></TouchableOpacity> : null}
        <TouchableOpacity style={s.finishSecondary} onPress={() => { setArena(null); void stopTrackPreview(); }}><Text style={s.finishSecondaryText}>QUITTER LE BATTLE</Text></TouchableOpacity>
      </View>;
    }
    return <View style={s.root}>"""
          if arena_marker not in s:
              raise SystemExit('arena marker not found')
          s = s.replace(arena_marker, arena_end)

          effect_marker = """  React.useEffect(() => { if (arena?.round?.revealed) { void stopTrackPreview(); animateResult(); } }, [arena?.round?.revealed, arena?.round?.position, arena?.matchNo, animateResult]);"""
          effect_replace = effect_marker + """\n  React.useEffect(() => {\n    if (arena?.status === 'WAITING' && arena.lastResult) celebrate();\n  }, [arena?.status, arena?.lastResult?.matchNo, celebrate]);"""
          if "arena.lastResult) celebrate()" not in s:
              s = s.replace(effect_marker, effect_replace)

          style_marker = """  root: { width: '100%', flex: 1, paddingBottom: 4 },"""
          style_insert = """  root: { width: '100%', flex: 1, paddingBottom: 4 }, finishHero: { minHeight: 300, marginTop: 14, borderRadius: 28, borderWidth: 1, borderColor: '#5A476B', backgroundColor: '#17101F', alignItems: 'center', justifyContent: 'center', padding: 20, overflow: 'hidden' }, finishSpark: { color: '#E5F266', fontSize: 22, fontWeight: '900', letterSpacing: 5 }, finishTrophy: { fontSize: 72, marginTop: 8 }, finishTitle: { color: '#FFF', fontSize: 30, fontWeight: '900', textAlign: 'center', marginTop: 8 }, finishSub: { color: '#FFF', fontSize: 12, lineHeight: 17, fontWeight: '800', textAlign: 'center', marginTop: 7, maxWidth: 280 }, finishScore: { flexDirection: 'row', alignItems: 'baseline', marginTop: 13 }, finishScoreBig: { color: '#E5F266', fontSize: 54, lineHeight: 58, fontWeight: '900' }, finishScoreSlash: { color: '#FFF', fontSize: 18, fontWeight: '900' }, finishWon: { color: '#7FF2B7', fontSize: 12, fontWeight: '900', marginTop: 7 }, finishLost: { color: '#FFB3C3', fontSize: 12, fontWeight: '900', marginTop: 7 }, finishQuestion: { color: '#FFF', textAlign: 'center', fontSize: 12, fontWeight: '900', marginVertical: 12 }, finishPrimary: { minHeight: 50, borderRadius: 25, backgroundColor: '#E5F266', alignItems: 'center', justifyContent: 'center', marginBottom: 7 }, finishPrimaryText: { color: '#17130B', fontSize: 12, fontWeight: '900' }, finishSecondary: { minHeight: 46, borderRadius: 23, borderWidth: 1, borderColor: '#40334B', backgroundColor: '#18121F', alignItems: 'center', justifyContent: 'center', marginBottom: 7 }, finishSecondaryText: { color: '#FFF', fontSize: 11, fontWeight: '900' },"""
          if "finishHero:" not in s:
              s = s.replace(style_marker, style_insert)

          p.write_text(s)

          test = Path('packages/mobile/src/components/__tests__/KeepBattleMobileGameV3.compact.test.ts')
          t = test.read_text()
          before = """  it('keeps the horizontal music-style selector compact on 390x844', () => {"""
          extra = """  it('shows a complete 8-round endgame with replay and challenge choices', () => {\n    expect(source).toContain('PARFAIT · 8/8');\n    expect(source).toContain('REFAIRE UNE PARTIE');\n    expect(source).toContain('DÉFIER UN JOUEUR');\n    expect(source).toContain('INVITER UN AMI');\n    expect(source).toContain('setSoloFinished(true); celebrate()');\n  });\n\n  it('stops automatic multiplayer restart and shows rematch actions', () => {\n    expect(source).toContain("arena.status === 'WAITING' && arena.lastResult");\n    expect(source).toContain('REVANCHE');\n    expect(source).toContain('AJOUTER UN JOUEUR');\n    expect(source).toContain('QUITTER LE BATTLE');\n    expect(source).toContain('buildKeepBattleArenaInviteLink');\n    expect(source).toContain('arena.lastResult || arena.seats.length < 2');\n  });\n\n"""
          if "shows a complete 8-round endgame" not in t:
              t = t.replace(before, extra + before)
              test.write_text(t)
          PY
      - name: Verify mobile
        run: |
          npm ci
          npm --workspace packages/mobile run type-check
          npm --workspace packages/mobile test -- --runInBand KeepBattleMobileGameV3.compact.test.ts
          node scripts/verify-mobile-text-contrast.cjs
      - name: Commit patch
        run: |
          git config user.name "KEEP CI"
          git config user.email "actions@users.noreply.github.com"
          git add packages/mobile/src/components/KeepBattleMobileGameV3.tsx packages/mobile/src/components/__tests__/KeepBattleMobileGameV3.compact.test.ts
          git commit -m "feat(battle): add endgame choices and winner celebration"
          git push origin HEAD:reconcile/claude-main-20260825
