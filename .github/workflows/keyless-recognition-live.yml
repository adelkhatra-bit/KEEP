name: KEEP — Reconnaissance sans clé live

on:
  workflow_dispatch:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'supabase/functions/keep-music-keyless-source/**'
      - 'packages/mobile/src/services/keylessSocialRecognition.ts'
      - 'packages/mobile/src/services/keepMusicCoreRecognition.ts'
      - 'packages/mobile/src/components/SharedMusicHandoff.tsx'
      - '.github/workflows/keyless-recognition-live.yml'

permissions:
  contents: read

concurrency:
  group: keep-keyless-recognition-live
  cancel-in-progress: true

jobs:
  keyless-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEEP_SUPABASE_URL: 'https://rrhqsqzcplvmwxizqnla.supabase.co'
      KEEP_SUPABASE_ANON_KEY: 'sb_publishable_TUz-oaWk8QZDl4pTfCvkPw_3_iwJJru'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Health — aucune API privée requise
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const base = process.env.KEEP_SUPABASE_URL;
          const key = process.env.KEEP_SUPABASE_ANON_KEY;
          const res = await fetch(`${base}/functions/v1/keep-music-keyless-source`, {
            method: 'POST',
            headers: { apikey: key, Authorization: `Bearer ${key}`, 'content-type': 'application/json' },
            body: JSON.stringify({ action: 'health' }),
          });
          const payload = await res.json();
          if (!res.ok || payload?.ok !== true) throw new Error(`health failed: ${res.status} ${JSON.stringify(payload)}`);
          if (payload?.apiKeyRequired !== false) throw new Error('keyless resolver unexpectedly requires a private API key');
          if (!Array.isArray(payload?.catalogs) || !payload.catalogs.includes('APPLE_ITUNES_SEARCH')) throw new Error('Apple public catalog missing');
          if (!payload.catalogs.includes('DEEZER_PUBLIC_SEARCH')) throw new Error('Deezer public catalog missing');
          console.log('KEYLESS HEALTH OK', payload);
          JS
      - name: Reconnaissance réelle — lien Apple public sans clé
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const base = process.env.KEEP_SUPABASE_URL;
          const key = process.env.KEEP_SUPABASE_ANON_KEY;
          const search = await fetch('https://itunes.apple.com/search?term=Daft%20Punk%20One%20More%20Time&entity=song&limit=10&country=FR');
          if (!search.ok) throw new Error(`iTunes public search failed: ${search.status}`);
          const catalog = await search.json();
          const row = (catalog.results || []).find(x => /one more time/i.test(String(x.trackName || '')) && /daft punk/i.test(String(x.artistName || '')));
          if (!row?.trackViewUrl) throw new Error('stable public Apple test song not found');
          const res = await fetch(`${base}/functions/v1/keep-music-keyless-source`, {
            method: 'POST',
            headers: { apikey: key, Authorization: `Bearer ${key}`, 'content-type': 'application/json', 'x-keep-device-id': 'github-keyless-live-apple' },
            body: JSON.stringify({
              url: row.trackViewUrl,
              rawText: `${row.artistName} - ${row.trackName}`,
              title: `${row.artistName} - ${row.trackName}`,
              platform: 'WEB',
            }),
          });
          const payload = await res.json();
          if (!res.ok || !payload?.recognition) throw new Error(`keyless recognition failed: ${res.status} ${JSON.stringify(payload)}`);
          const title = String(payload.recognition.title || '').toLowerCase();
          const artist = String(payload.recognition.artist || '').toLowerCase();
          if (!title.includes('one more time') || !artist.includes('daft punk')) throw new Error(`wrong recognition: ${JSON.stringify(payload.recognition)}`);
          if (Number(payload.recognition.confidence || 0) < 0.68) throw new Error(`confidence too low: ${payload.recognition.confidence}`);
          console.log('KEYLESS APPLE LINK OK', { strategy: payload.strategy, title: payload.recognition.title, artist: payload.recognition.artist, confidence: payload.recognition.confidence });
          JS
      - name: Reconnaissance réelle — métadonnées partagées sans URL ni clé
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const base = process.env.KEEP_SUPABASE_URL;
          const key = process.env.KEEP_SUPABASE_ANON_KEY;
          const res = await fetch(`${base}/functions/v1/keep-music-keyless-source`, {
            method: 'POST',
            headers: { apikey: key, Authorization: `Bearer ${key}`, 'content-type': 'application/json', 'x-keep-device-id': 'github-keyless-live-metadata' },
            body: JSON.stringify({
              rawText: 'Daft Punk - One More Time',
              title: 'Daft Punk - One More Time',
              platform: 'TIKTOK',
            }),
          });
          const payload = await res.json();
          if (!res.ok || !payload?.recognition) throw new Error(`metadata-only recognition failed: ${res.status} ${JSON.stringify(payload)}`);
          const title = String(payload.recognition.title || '').toLowerCase();
          const artist = String(payload.recognition.artist || '').toLowerCase();
          if (!title.includes('one more time') || !artist.includes('daft punk')) throw new Error(`wrong metadata-only recognition: ${JSON.stringify(payload.recognition)}`);
          if (Number(payload.recognition.confidence || 0) < 0.68) throw new Error(`metadata-only confidence too low: ${payload.recognition.confidence}`);
          console.log('KEYLESS METADATA ONLY OK', { strategy: payload.strategy, title: payload.recognition.title, artist: payload.recognition.artist, confidence: payload.recognition.confidence });
          JS
      - name: YouTube partagé — même vidéo depuis PC, iPhone et Shorts
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const base = process.env.KEEP_SUPABASE_URL;
          const key = process.env.KEEP_SUPABASE_ANON_KEY;
          const variants = [
            'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
            'https://youtu.be/dQw4w9WgXcQ?si=iosshare',
            'https://music.youtube.com/watch?v=dQw4w9WgXcQ',
            'https://www.youtube.com/shorts/dQw4w9WgXcQ',
          ];
          for (const [i,url] of variants.entries()) {
            const r = await fetch(`${base}/functions/v1/keep-music-keyless-source`, {
              method:'POST',headers:{
                apikey:key,Authorization:`Bearer ${key}`,
                'Content-Type':'application/json','x-keep-device-id':'github-keyless-youtube-'+i,
              },body:JSON.stringify({url,platform:'YOUTUBE'}),signal:AbortSignal.timeout(45000),
            });
            const p = await r.json();
            if(!r.ok || !p?.recognition?.title || !p?.recognition?.artist)
              throw new Error('No real YouTube title for '+url+': '+JSON.stringify(p));
            const identity=(p.recognition.title+' '+p.recognition.artist).toLowerCase();
            if(!identity.includes('never gonna give you up') || !identity.includes('rick astley'))
              throw new Error('WRONG YOUTUBE SONG: '+url+' resolved to '+identity);
            if(!String(p.recognition.externalUrls?.source||'').includes('dQw4w9WgXcQ'))
              throw new Error('Source URL lost the actual video ID: '+JSON.stringify(p.recognition.externalUrls));
            console.log('LIVE YOUTUBE SHARE OK', {url,track:p.recognition.title,artist:p.recognition.artist,strategy:p.strategy});
          }
          // YouTube share captions can be unrelated to the video. The link must
          // always win over text accidentally copied around it.
          const spoof = await fetch(`${base}/functions/v1/keep-music-keyless-source`, {
            method: 'POST',headers:{apikey:key,Authorization:`Bearer ${key}`,
              'Content-Type':'application/json','x-keep-device-id':'github-keyless-youtube-spoof-check'},
            body:JSON.stringify({url:variants[0],platform:'YOUTUBE',
              rawText:'Daft Punk - One More Time',title:'Daft Punk - One More Time'}),
            signal:AbortSignal.timeout(45000),
          });
          const suspect = await spoof.json();
          const text=(String(suspect.recognition?.title||'')+' '+String(suspect.recognition?.artist||'')).toLowerCase();
          if(!spoof.ok || !text.includes('rick astley') || !text.includes('never gonna give you up'))
            throw new Error('Copied caption changed YouTube video identity: '+JSON.stringify(suspect));
          JS
      - name: Deux liens YouTube différents — jamais le même titre par erreur
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const base = process.env.KEEP_SUPABASE_URL;
          const key = process.env.KEEP_SUPABASE_ANON_KEY;
          async function recognize(videoId, device) {
            const url = 'https://www.youtube.com/watch?v=' + videoId;
            const response = await fetch(base + '/functions/v1/keep-music-keyless-source', {
              method: 'POST',
              headers: { apikey: key, Authorization: 'Bearer ' + key, 'content-type': 'application/json', 'x-keep-device-id': device },
              body: JSON.stringify({ url, platform: 'YOUTUBE' }),
              signal: AbortSignal.timeout(45000),
            });
            const body = await response.json();
            if (!response.ok || !body?.recognition?.title) throw Error('YouTube recognition missing for ' + videoId + ': ' + JSON.stringify(body));
            return { ...body, videoId };
          }
          const first = await recognize('dQw4w9WgXcQ', 'github-two-links-first');
          const second = await recognize('9bZkp7q19f0', 'github-two-links-second');
          const a = first.recognition;
          const b = second.recognition;
          if (!/rick astley/i.test(a.artist) || !/never gonna give you up/i.test(a.title)) throw Error('First YouTube link matched wrong song: ' + JSON.stringify(a));
          if (!/psy/i.test(b.artist) || !/gangnam style/i.test(b.title)) throw Error('Second YouTube link kept the first song or matched wrong music: ' + JSON.stringify(b));
          if (a.title === b.title && a.artist === b.artist) throw Error('Two different videos produced identical song');
          console.log('TWO DISTINCT YOUTUBE LINKS OK', { first: a.artist + ' — ' + a.title, second: b.artist + ' — ' + b.title });
          JS
      - name: Spotify et Deezer partagés — vraie recherche musicale
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const base = process.env.KEEP_SUPABASE_URL;
          const key = process.env.KEEP_SUPABASE_ANON_KEY;
          const h = {apikey:key,Authorization:`Bearer ${key}`,'content-type':'application/json'};
          async function check(url,platform,title,artist) {
            const res = await fetch(`${base}/functions/v1/keep-music-keyless-source`, {
              method:'POST',headers:{...h,'x-keep-device-id':'github-keyless-'+platform.toLowerCase()},
              body:JSON.stringify({url,platform}),signal:AbortSignal.timeout(45000),
            });
            const payload = await res.json();
            if(!res.ok || !payload?.recognition?.title || !payload?.recognition?.artist)
              throw Error(platform+' share lookup failed: '+JSON.stringify(payload));
            const rec = payload.recognition;
            if(!rec.title.toLowerCase().includes(title) || !rec.artist.toLowerCase().includes(artist))
              throw Error(platform+' wrong music: '+JSON.stringify(rec));
            console.log('LIVE PROVIDER SHARE OK',{platform,title:rec.title,artist:rec.artist,strategy:payload.strategy});
          }
          await check('https://open.spotify.com/track/4PTG3Z6ehGkBFwjybzWkR8','SPOTIFY','never gonna give you up','rick astley');
          const response = await fetch('https://api.deezer.com/search?q='+encodeURIComponent('Daft Punk One More Time')+'&limit=20',{signal:AbortSignal.timeout(12000)});
          if(!response.ok) throw Error('Deezer public search offline: HTTP '+response.status);
          const rows=(await response.json()).data||[];
          const song=rows.find(row=>/one more time/i.test(String(row.title||'')) && /daft punk/i.test(String(row.artist?.name||'')));
          if(!song?.id) throw Error('Deezer public catalogue not found for test song');
          await check('https://www.deezer.com/track/'+song.id,'DEEZER','one more time','daft punk');
          JS
      - name: Contrat mobile — fallback sans clé reste branché
        run: |
          grep -q "keep-music-keyless-source" packages/mobile/src/services/keepMusicCoreRecognition.ts
          grep -q "resolveKeylessSocialMusic" packages/mobile/src/components/SharedMusicHandoff.tsx
          grep -q "ingestExternalRecognition" packages/mobile/src/components/SharedMusicHandoff.tsx
          grep -q "apiKeyRequired: false" supabase/functions/keep-music-keyless-source/index.ts
          grep -q "FALLBACK_RECHECK_MS = 30 \* 1000" packages/mobile/src/services/keepMusicCoreRecognition.ts
