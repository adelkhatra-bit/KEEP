name: KEEP Battle native push actions fix

on:
  push:
    branches: ['reconcile/claude-main-20260825']
    paths:
      - 'scripts/patch_keep_battle_native_push_actions.py'
      - '.github/workflows/keep-battle-native-push-actions-once.yml'

permissions:
  contents: write

concurrency:
  group: keep-battle-native-push-actions
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: reconcile/claude-main-20260825
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Sync branch
        run: git pull --rebase origin reconcile/claude-main-20260825
      - name: Apply native notification actions and compact card invite
        run: python scripts/patch_keep_battle_native_push_actions.py
      - name: Install dependencies
        run: npm ci
      - name: Verify Battle notification actions
        run: |
          grep -Fq "const BATTLE_CATEGORY = 'KEEP_BATTLE_CHALLENGE'" packages/mobile/src/services/pushNotificationService.ts
          grep -Fq "buttonTitle: 'REFUSER'" packages/mobile/src/services/pushNotificationService.ts
          grep -Fq "buttonTitle: 'ACCEPTER'" packages/mobile/src/services/pushNotificationService.ts
          grep -Fq 'categoryId: BATTLE_CATEGORY' packages/backend/src/lib/pushNotifications.ts
          grep -Fq 'souhaite faire un Battle avec vous. Acceptez-vous ?' packages/mobile/src/components/KeepBattleMobileGameV3.tsx
          grep -Fq "max_players smallint not null default 10" supabase/migrations/20260829034000_keep_battle_arena_foundation.sql
          npm --prefix packages/mobile run type-check
          npm --prefix packages/backend run build
          npm --prefix packages/mobile test -- --runInBand BattleNotificationActions.contract.test.ts
      - name: Commit fix
        run: |
          git config user.name 'KEEP Guardian'
          git config user.email 'actions@github.com'
          git add packages/mobile/src/services/pushNotificationService.ts packages/backend/src/lib/pushNotifications.ts packages/mobile/src/components/KeepBattleMobileGameV3.tsx packages/mobile/src/screens/__tests__/BattleNotificationActions.contract.test.ts
          git commit -m 'fix(battle): compact challenge actions under question'
          git pull --rebase origin reconcile/claude-main-20260825
          git push origin HEAD:reconcile/claude-main-20260825
