version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: reconcile/claude-main-20260825
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      keep-safe-minor-patches:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    target-branch: reconcile/claude-main-20260825
    schedule:
      interval: weekly
      day: monday
      time: '05:45'
      timezone: Europe/Paris
    open-pull-requests-limit: 3
