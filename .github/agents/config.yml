# KEEP — Configuration GitHub-native minimale pour agents IA
# Ce fichier n'accorde PAS des permissions reelles. Il documente le perimetre
# autorise cote depot pour rester aligne avec CLAUDE.md, AGENTS.md et
# docs/ops/GITHUB_AI_COMMAND_CENTER.md.

schema_version: 2
source_branch: reconcile/claude-main-20260825

agents:
  chatgpt:
    enabled: true
    role: cadrage
    repository_access: read-only
    code_write: false
    workflow_dispatch: false
    artifacts_read: false
    secrets_access: false
    notes:
      - Utilise le relais canonique keep-ai-relay et les miroirs AI/AI_INSTRUCTIONS.md / AI/AI_REPORT.md.
      - Ne recoit jamais de secrets ni d'acces d'administration GitHub.

  claude:
    enabled: true
    role: implementation-validation
    repository_access: branch-and-pr-only
    code_write: true
    workflow_dispatch: true
    artifacts_read: true
    secrets_access: false
    notes:
      - Respecte agent-lock.cjs et AGENT_MESSAGES.md.
      - Toute ecriture de code passe par une branche dediee et une PR/verifications.

  codex:
    enabled: true
    role: implementation-validation
    repository_access: branch-and-pr-only
    code_write: true
    workflow_dispatch: true
    artifacts_read: true
    secrets_access: false
    notes:
      - Respecte agent-lock.cjs et AGENT_MESSAGES.md.
      - Toute ecriture de code passe par une branche dediee et une PR/verifications.

  copilot:
    enabled: true
    role: github-native-execution
    repository_access: branch-and-pr-only
    code_write: true
    workflow_dispatch: true
    artifacts_read: true
    secrets_access: false
    notes:
      - Utiliser pour des taches ciblees issues/PR/workflows.
      - Ne jamais contourner les garde-fous GitHub / CodeQL / guardians.

  design:
    enabled: true
    role: ux-ui-consultation
    repository_access: read-only
    code_write: false
    workflow_dispatch: false
    artifacts_read: false
    secrets_access: false
    notes:
      - Source utile pour la structure UX/UI uniquement.
      - Jamais source de verite code, infra, base ou secrets.

security:
  require_human_approval_for:
    - github_app_installation_or_removal
    - secret_creation_rotation_or_revocation
    - external_platform_permission_grants
    - branch_protection_or_environment_rule_changes
    - destructive_repository_operations
  allow_destructive_operations: false
  allow_secret_access: false
  allow_repository_deletion: false
  allow_workflow_editing: true
  audit_logging: true

coordination:
  canonical_relay: keep-ai-relay
  relay_mirrors:
    - AI/AI_INSTRUCTIONS.md
    - AI/AI_REPORT.md
  agent_journal: AGENT_MESSAGES.md
  lock_script: scripts/agent-lock.cjs
  command_center_doc: docs/ops/GITHUB_AI_COMMAND_CENTER.md
  machine_readable_config: config/github-ai-command-center.json

workflow_policy:
  source_of_truth:
    - mobile-ci.yml
    - full-stack-ci.yml
    - keep-human-guardian.yml
    - keep-dual-viewport-guardian.yml
    - codeql.yml
    - app-store-native-preflight.yml
    - auto-eas-build.yml
    - web-preview-pages.yml
  proofs_must_return_to: pull_request
  parallel_shadow_systems_forbidden: true
