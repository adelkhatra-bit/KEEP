# 🤖 Multi-Agent Configuration
# Configuration centralisée pour agents IA (Claude, Styve, Jac, JT, etc.)

agents:
  claude:
    name: "Claude Copilot"
    description: "OpenAI Claude-based GitHub Copilot"
    enabled: true
    permissions:
      - read:repo
      - write:repo
      - admin:repo_hook
      - admin:org_hook
      - repo:status
      - repo:deployment
      - workflow
      - gist
      - notifications
      - user
      - delete_repo
      - codespace
    capabilities:
      - code_search
      - code_generation
      - pull_request_management
      - issue_management
      - workflow_management
      - repository_management
      - api_creation
      - deployment
      - testing
      - documentation
    scopes:
      - full_repo_access
      - workflow_execution
      - secrets_read
      - secrets_write
      - actions_admin

